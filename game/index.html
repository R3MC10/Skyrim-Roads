/* [homestead] Hearthfire-style homesteads (homestead.js) */
.hs img.art.scene.hsart{margin:2px 0 8px}
.chips.hstabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:0;margin:0 0 6px;border-top:1px solid var(--sk-line,rgba(236,232,222,.15));border-bottom:1px solid var(--sk-line,rgba(236,232,222,.15))}
.chips.hstabs::-webkit-scrollbar{display:none}.chips.hstabs .chip{flex:1 0 auto;min-height:40px;border:0;background:transparent;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:#bdb7a9}
.chips.hstabs .chip.on{color:#fff;background:radial-gradient(60% 100% at 50% 50%,rgba(255,255,255,.14),transparent 75%);text-shadow:0 0 10px rgba(255,255,255,.4)}
.hs .hsh{margin:12px 0 4px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#e2d6b8;border-bottom:1px solid rgba(214,178,94,.3);padding-bottom:3px}
.hs .hsrow{align-items:flex-start}.hs .hsrow .t{min-width:0;flex:1}.hs .hsrow.locked{opacity:.62}.hs .hsrow.on .t{color:#cfe8b0}
.hs img.hsthumb{flex:none;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.hsmats,.hsstock{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.hsm{font-size:12px;line-height:1;padding:4px 6px;border-radius:3px;background:rgba(255,255,255,.06);border:1px solid rgba(236,232,222,.12);white-space:nowrap}
.hsm.ok{color:#bfe3a0;border-color:rgba(150,200,120,.35)}.hsm.no{color:#f0a08a;border-color:rgba(228,110,90,.35)}
.hsstock .hsm{flex:1 1 30%;display:flex;gap:4px;align-items:baseline}.hsstock .hsm small{opacity:.7;overflow:hidden;text-overflow:ellipsis}
.hs .hswhy{display:block;color:#e2bb64;font-size:12px}.hs .hsready{color:#9affc0}.hs .hsbtns{display:flex;gap:4px;flex:none}
.hs .hscard .btn.pri{margin-top:6px;min-height:44px}.hs .hsother{opacity:.8}

/* [access] Settings → Accessibility (access.js): text size, colour-blind help, high contrast, reduce motion, one hand */
html.a11y-zoom{zoom:var(--tz)}
html.a11y-zoom canvas{zoom:calc(1 / var(--tz))}
.setrow.a11y-col{flex-direction:column;align-items:stretch;gap:6px}
.setrow.a11y-col .seg{display:flex;margin:0}
.setrow.a11y-col .seg button{flex:1 1 0;min-width:0;padding:8px 2px;letter-spacing:.02em;text-transform:none;font-size:15px}
html.a11y-zoom .seg button{letter-spacing:.04em;padding-left:4px;padding-right:4px}
html.a11y-zoom .tabs{zoom:calc(min(var(--tz),var(--tzcap,1.12)) / var(--tz))}
html.a11y-zoom .tab{letter-spacing:0}
.a11y-hint{color:var(--mute);font-size:13px;line-height:1.3}
/* colour-blind help: the same meanings, colours that stay apart */
html[data-cb=protan],html[data-cb=deutan]{--hp:#e0601a;--mp:#3f7fd6;--sp:#fff27a;--ember:#ff6a2a;--cb-low:#6fb6ff;--cb-med:#f2d27a;--cb-high:#e0501a;--cb-raid:#ff8a2a;--buff:#6fb6ff;--debuff:#ff8a2a;--stolen:#ff8a2a;--el-poison:#c88aff;--el-heal:#fff27a;--cat-thief:#6fb6ff;--cat-warrior:#ff8a2a}
html[data-cb=protan]{--hp:#f07020;--ember:#ff7a3a;--cb-high:#ff6a1a}
html[data-cb=tritan]{--hp:#e0303a;--mp:#2a9ad8;--sp:#ece6dc;--ember:#ff4d5a;--cb-low:#5fd0c8;--cb-med:#ff9ad0;--cb-high:#ff3a3a;--cb-raid:#ff4d5a;--buff:#5fd0c8;--debuff:#ff5a5a;--stolen:#ff5a5a;--el-frost:#bfefff;--el-poison:#c88aff;--sch-mysticism:#c8b4ff;--cat-mage:#c8b4ff}
html[data-cb]{--q-common:#ece8de;--q-fine:#20c0a0;--q-superior:#5b8cff;--q-exquisite:#f0a8ff;--q-legendary:#ffd84a;--q-unique:#ff5a3a}
html[data-cb] .hb.hp .track i{background:linear-gradient(color-mix(in srgb,var(--hp) 62%,#fff),var(--hp) 60%,color-mix(in srgb,var(--hp) 62%,#000));color:color-mix(in srgb,var(--hp) 55%,transparent)}
html[data-cb] .hb.mp .track i{background:linear-gradient(color-mix(in srgb,var(--mp) 62%,#fff),var(--mp) 60%,color-mix(in srgb,var(--mp) 62%,#000));color:color-mix(in srgb,var(--mp) 55%,transparent)}
html[data-cb] .hb.sp .track i{background:linear-gradient(color-mix(in srgb,var(--sp) 62%,#fff),var(--sp) 60%,color-mix(in srgb,var(--sp) 62%,#000));color:color-mix(in srgb,var(--sp) 55%,transparent)}
html[data-cb] .hb.low .track{box-shadow:0 0 0 1px #0b0c0e,0 0 0 2px var(--ember),0 0 8px var(--ember)}
html[data-cb] .danger-low,html[data-cb] #side[data-tab=log] .danger-low{color:var(--cb-low)}
html[data-cb] .danger-medium,html[data-cb] #side[data-tab=log] .danger-medium{color:var(--cb-med)}
html[data-cb] .danger-high,html[data-cb] #side[data-tab=log] .danger-high{color:var(--cb-high)}
html[data-cb] #side[data-tab=log] :is(.danger-low,.danger-medium,.danger-high){text-shadow:0 0 1px #000,0 1px 2px #000}
html[data-cb] .compass .cm.raid{color:var(--cb-raid)}
/* high-contrast text */
html.a11y-hc{--ink:#fff;--mute:#e6e0d2;--sk-ink:#fff;--sk-mute:#e6e0d2;--line:#7a808a;--sk-line:rgba(255,255,255,.45)}
html.a11y-hc body{color:#fff}
html.a11y-hc :is(.panel,.sheet,.dun .card,.trip){background:#060708!important;border-color:rgba(255,255,255,.5)!important}
html.a11y-hc :where(.sub,.a11y-hint,.item .t span,.vital small,.hb small,.top .who span,.top .meta,.top .iconbtn .ibl,.log time,.slot span,.race span,.status,.picked .t span,.dun .legend,.tab,.sky-row .nm i,.seg button:not(.on)){color:#ece6d8!important}
html.a11y-hc .tab.on{color:#fff!important;text-decoration:underline;text-underline-offset:3px}
html.a11y-hc #hudlog :is(.toast,.hlog){background:rgba(0,0,0,.92);color:#fff}
html.a11y-hc :is(.btn,.chip,.seg,input,select,textarea,.iconbtn){border-color:rgba(255,255,255,.75)!important}
html.a11y-hc .seg button.on{background:#ece6d8!important;color:#000!important}
html.a11y-hc :focus-visible{outline:3px solid #fff!important;outline-offset:2px}
/* reduce motion: everything lands at once */
html.a11y-still *,html.a11y-still *::before,html.a11y-still *::after{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:1ms!important;transition-delay:0s!important;scroll-behavior:auto!important}
html.a11y-still :is(.mo-amb,.mo-const,.mo-veil,.mo-fly){display:none!important}
/* one-hand mode: the main buttons gather at the bottom, right (default) or left */
html.a11y-1h .top :is(.soc,.snd){position:fixed;right:12px;z-index:6;width:48px;height:48px;border-radius:50%;background:rgba(10,11,13,.82);box-shadow:0 0 0 1px rgba(226,187,100,.45),0 6px 16px rgba(0,0,0,.5)}
html.a11y-1h .top .snd{right:66px;bottom:calc(124px + env(safe-area-inset-bottom))}
html.a11y-1h .top .soc{right:66px;bottom:calc(70px + env(safe-area-inset-bottom))}
html.a11y-1h .mapbtns{top:auto;bottom:8px}
html.a11y-1h .mapwrap:has(.picked:not(.hide)) .mapbtns{bottom:72px}
html.a11y-1h-left :is(.twbtn,.favbtn){right:auto;left:12px}
html.a11y-1h-left .top :is(.soc,.snd){right:auto;left:66px}
html.a11y-1h-left .mapbtns{right:auto;left:8px}
/* inventory helpers (invqol.js): kept marks, better/worse arrows, junk and buy-back buttons */
.iq-up,.iq-dn{font-weight:700;margin-left:5px;font-size:.92em;font-style:normal}
.iq-up,.sky-row .nm i.iq-up{color:var(--buff,#6fd36a)}.iq-dn,.sky-row .nm i.iq-dn{color:var(--debuff,#e0584a)}
html.a11y-hc i.iq-up{color:var(--buff,#6fd36a)!important}html.a11y-hc i.iq-dn{color:var(--debuff,#e0584a)!important}
.iq-keep{margin-left:4px;font-size:.82em;font-style:normal}
.sky-row .nm i.iq-up,.sky-row .nm i.iq-dn,.sky-row .nm i.iq-keep{margin:0 5px 0 0}
.iq-shop{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.iq-shop:empty{display:none}
.iq-shop .btn{flex:1 1 140px;min-width:0;white-space:normal;line-height:1.2}
.iq-sort{flex-wrap:wrap;align-items:center;gap:4px;margin:6px 0 8px}.iq-sort .sub{margin:0 4px 0 0}
.iq-junk{max-height:44vh;overflow:auto}
.iq-total{text-align:right;margin:8px 0 0}
.iq-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.iq-btns .btn{flex:1 1 120px;min-width:0;white-space:normal}
.iq-k.on{border-color:var(--gold);color:var(--gold)}
/* ==== crafting shortcuts (craftqol.js) ==== */
.cqbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:0 0 8px}
.cqbar .cqready,.cqalch .cqready{color:var(--mute);font-size:13px;line-height:1.25}
.cqnone{margin:0 0 8px}
.cqh{margin:10px 0 6px;font-size:15px}
.item.cqrow{flex-wrap:wrap}
.item.cqrow>.t{min-width:min(100%,170px)}
.item .cqbtns,.cqbtns{display:flex;align-items:center;gap:4px;flex:none;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.cqalch{margin-top:8px;justify-content:flex-start;margin-left:0}
.cqalch .cqready{flex:1;min-width:90px}
.item .t span.cqst,.cqst{display:block;font-size:13px;margin-top:2px}
.item .t span.cqst.ok,.cqst.ok{color:var(--buff,#8fd49a)}
.item .t span.cqst.ok::before{content:"✔ "}
.item .t span.cqst.no,.cqst.no{color:var(--debuff,#e39a86)}
.cqstar{min-width:36px;min-height:36px;padding:0;border:0;background:transparent;color:var(--mute);font-size:20px;line-height:1;cursor:pointer}
.cqstar.on{color:var(--gold)}
.cqstar:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn.sm.cqq{padding:0 8px;min-width:44px}
.chip .cqn{display:inline-block;min-width:1.4em;margin-left:4px;padding:0 4px;border-radius:999px;background:rgba(226,187,100,.22);color:var(--gold);font-size:12px;font-weight:600;text-align:center}
html.art-pixel .chip .cqn{border-radius:0}
/* [OURS] quicker travel and fights (fastqol.js) */
.fsbtn{white-space:nowrap}
.fqrecent{margin:2px 0 8px}
.fqrecent .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.fqrecent .chip{min-height:36px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fqloot{margin:8px 0;border-color:var(--ember,#b0573a)}
.fqloot .btn{min-height:44px}
.fqagain{width:100%;margin:8px 0 6px;min-height:44px}
/* [onboard] a clearer first hour (onboard.js): ideas in "What to do next", first-time tips */
.nextcard .obrow .obx{flex:none;margin-left:2px}
.obx{background:none;border:0;color:var(--muted,#9aa3ad);font-size:15px;line-height:1;min-width:32px;min-height:32px;padding:4px;cursor:pointer;border-radius:4px}
.obx:hover,.obx:focus-visible{color:#efe2bd;background:rgba(255,255,255,.06)}
.obfoot{margin:8px 0 0;font-size:13px}
.obtip{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:80;width:min(94vw,440px);box-sizing:border-box;padding:10px 12px 10px 14px;
  background:linear-gradient(180deg,rgba(20,22,26,.97),rgba(10,11,13,.97));border:1px solid rgba(226,187,100,.6);border-radius:6px;box-shadow:0 10px 28px rgba(0,0,0,.6);color:#efe7d2;animation:obin .25s ease-out}
.obtip.infight{top:auto;bottom:calc(8px + env(safe-area-inset-bottom));max-height:42vh;overflow:auto}
.obtip p{margin:4px 0 8px;font-size:14px;line-height:1.4}
.obtip-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.obtip-h b{font-family:var(--sk-ui,Cinzel,serif);letter-spacing:.06em;color:#f3e2b0;font-size:14px}
.obtip-b{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.obtip-b .linkbtn{margin-left:auto;font-size:13px}
.pixel .obtip,html.pixel .obtip{border-radius:0;border-width:2px}
@keyframes obin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){.obtip{animation:none}}
html.a11y-still .obtip{animation:none}
/* [tabs] menu tabs (menus.js): seven bottom tabs, a SkyUI sub-tab strip on top of each screen */
.tabs.mn-bar{grid-template-columns:repeat(7,minmax(0,1fr))}
.mn-bar .tab{padding:8px 0 10px;min-width:0;letter-spacing:.04em;font-size:9.5px}
.mn-bar .tab .mn-l{display:block;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:clip}
.mn-bar .tab .dot{right:calc(50% - 15px)}
@media (max-width:440px){.mn-bar .tab{font:600 10px/1.1 "Barlow Condensed","Barlow Semi Condensed",sans-serif;letter-spacing:.02em}}
body:has(.tabs.mn-bar) .top .soc{display:none}
body:has(#sky) .tabs.mn-bar:not(.hide){z-index:10}
body:has(.tabs.mn-bar:not(.hide)) .sky{bottom:var(--mn-h,58px)}
body:has(.tabs.mn-bar:not(.hide)) .sky-in{padding-bottom:8px}
.mn-sub{display:flex;gap:0;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;margin:0 0 10px;border-top:1px solid var(--sk-line,#3a3226);border-bottom:1px solid var(--sk-line,#3a3226);background:linear-gradient(180deg,rgba(10,11,13,.75),rgba(4,5,6,.6))}
.mn-sub::-webkit-scrollbar{display:none}
.mn-sub button{flex:1 0 auto;min-height:44px;padding:10px 14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--sk-mute,#a29c8e);font:600 13px/1 var(--sk-ui,inherit);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;cursor:pointer}
.mn-sub button.on{color:#f6eedb;border-bottom-color:#e2bb64;background:var(--sk-sel,rgba(255,255,255,.06));text-shadow:0 0 8px rgba(226,187,100,.45)}
html.art-pixel .mn-sub{border-radius:0}
html.a11y-zoom .mn-sub button{letter-spacing:.06em;padding-left:10px;padding-right:10px}
html.a11y-hc .mn-sub button{color:#ece6d8}html.a11y-hc .mn-sub button.on{background:#ece6d8;color:#000;text-shadow:none}
.mn-list{margin-left:6px;min-height:36px}
.mn-intro h2{margin-bottom:4px}
.twbar-tabs{justify-content:flex-start;overflow-x:hidden;scrollbar-width:none}.twbar-tabs::-webkit-scrollbar{display:none}
.twbar-t{white-space:nowrap;flex:0 0 auto;padding-left:8px;padding-right:8px}
/* ==== search everything (search.js) ==== */
.top{grid-template-columns:auto minmax(0,1fr) auto auto auto;grid-template-areas:"l w f s g" "l m m m m"}
.top .iconbtn.srchb{grid-area:f;width:38px;height:38px;border-radius:50%;background:rgba(10,11,13,.55);border:1px solid rgba(226,187,100,.38);color:#e9e2d0;box-shadow:inset 0 0 8px rgba(0,0,0,.6);flex:none}
html.art-pixel .top .iconbtn.srchb{border-radius:0}
html.a11y-1h .top .srchb{position:fixed;right:66px;bottom:calc(178px + env(safe-area-inset-bottom));z-index:6;width:48px;height:48px;border-radius:50%;background:rgba(10,11,13,.82);box-shadow:0 0 0 1px rgba(226,187,100,.45),0 6px 16px rgba(0,0,0,.5)}
html.a11y-1h-left .top .srchb{right:auto;left:66px}
.top .who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal.srch-m{place-items:start center;padding-top:calc(10px + env(safe-area-inset-top));z-index:26}
.sheet.srch{display:flex;flex-direction:column;max-height:calc(100dvh - 24px);padding:10px 10px 6px;overflow:hidden}
.srch-q{display:flex;gap:8px;align-items:center;flex:none}
.srch-q input{flex:1;min-width:0;min-height:44px;font-size:16px;padding:0 12px;background:rgba(0,0,0,.45);border:1px solid rgba(226,187,100,.38);color:#efe8d6;border-radius:6px}
.srch-q .iconbtn{flex:none;width:44px;height:44px}
.srch-body{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
.srch-g{display:flex;align-items:center;gap:6px;margin:12px 2px 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#d6b25e;border-bottom:1px solid rgba(226,187,100,.22);padding-bottom:3px}
.srch-g .num{margin-left:auto;color:#a9a395;letter-spacing:0;font-size:12px}
.srch-list{display:flex;flex-direction:column}
.srch-r{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 6px;text-align:left;background:transparent;border:0;border-bottom:1px solid rgba(228,220,200,.08);color:inherit;font:inherit;cursor:pointer}
.srch-r:hover,.srch-r:focus-visible{background:rgba(226,187,100,.09)}
.srch-r>img,.srch-r>canvas,.srch-r>svg,.srch-r>.skico,.srch-r>.sico,.srch-r>.qico{flex:none}
.srch-r .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.srch-r .t b{font-weight:600;overflow-wrap:anywhere}
.srch-r .t small{color:#a9a395;font-size:12.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.srch-r mark{background:rgba(226,187,100,.3);color:#ffe9b0;border-radius:2px;padding:0 1px}
.srch-go{color:#d6b25e;font-size:20px;flex:none}
.srch-emo{flex:none;width:30px;height:30px;display:grid;place-items:center;font-size:19px}
.srch-hint{cursor:default;opacity:.85}
.srch-more{margin:4px 0 0 46px;min-height:36px}
.srch-chips{display:flex;flex-wrap:wrap;gap:6px}
.srch-tip,.srch-none{margin:10px 4px}
.srch-back{margin:6px 0 8px}
.srch-d h2{margin:0;font-size:18px;text-align:left;letter-spacing:.04em;text-transform:none}
.srch-d h3{margin:12px 0 4px}
.srch-dh{display:flex;gap:12px;align-items:center}.srch-dh>div{min-width:0}
.srch-kvs{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.srch-kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid rgba(228,220,200,.08)}.srch-kv span{min-width:0;overflow-wrap:anywhere}.srch-kv b{flex:none;font-weight:600}
.srch-ok{color:#8fd18a}.srch-no{color:#e08a72}
.srch-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.srch-acts .btn{flex:1 1 140px}
.srch-spl{margin:8px 0}
.srch-flash{animation:srchfl 2s ease-out}
@keyframes srchfl{0%,30%{box-shadow:0 0 0 2px #e2bb64,0 0 16px rgba(226,187,100,.55);background-color:rgba(226,187,100,.14)}100%{box-shadow:none}}
html.art-pixel .srch-q input,html.art-pixel .srch-r mark{border-radius:0}
html.a11y-still .srch-flash{animation:none;outline:2px solid #e2bb64}
/* [remind] Today card and number badges (remind.js) */
.rmd-card .item.rmd-row{align-items:center}
.rmd-i{flex:none;width:26px;text-align:center;font-size:18px;color:var(--gold)}
.rmd-card .t{min-width:0;overflow-wrap:anywhere}
.rmd-card .btn.sm{flex:none;min-width:52px}
.rmd-when{font-weight:600;color:var(--gold)}
.rmd-soon .rmd-when{color:var(--mute)}
.rmd-n{font:600 .62em/1 var(--sans,inherit);color:#15120c;background:var(--gold);border-radius:10px;padding:3px 7px;vertical-align:middle;margin-left:6px;letter-spacing:.02em}
.rmd-more{display:block;margin:8px auto 0;min-height:36px}
.rmd-b{position:absolute;top:3px;right:calc(50% - 24px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:#15120c;font:700 11px/18px system-ui,sans-serif;text-align:center;box-shadow:0 0 0 2px rgba(10,11,13,.85);pointer-events:none;z-index:2}
.iconbtn > .rmd-b{top:-5px;right:-5px}
.tw-dir > .rmd-b{top:0;right:auto;left:calc(50% + 14px)}
.tab:has(> .rmd-b) > .dot,.iconbtn:has(> .rmd-b) > .dot,.tw-dir:has(> .rmd-b) > .dot{display:none}
.rmd-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rmd-set{margin:6px 0}.rmd-set summary{cursor:pointer;min-height:40px;display:flex;align-items:center;gap:6px;color:var(--ink,inherit)}.rmd-set summary small{color:var(--mute)}
html.art-pixel .rmd-b,html.art-pixel .rmd-n{border-radius:0}
/* bug hunt: at big text the Items/Magic/Skills names get their own row instead of piling on each other */

#tbf.pixel .bfbar,#tbf.pixel .bftele,#tbf.pixel .bfph,#tbf.pixel .bfhz{border-radius:0;border-width:2px;box-shadow:3px 3px 0 rgba(0,0,0,.7)}
#tbf.pixel .bftrack{border-width:2px;height:14px;image-rendering:pixelated}#tbf.pixel .bftrack i{background:repeating-linear-gradient(90deg,#d8432a 0 6px,#b5301c 6px 8px);box-shadow:none}
#tbf.pixel .bfname,.bfov.pixel .bfcard h2,.bfov.pixel .bfphase small{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.bfov.pixel .bfcard h2{font-size:clamp(16px,5.4vw,26px);text-shadow:3px 3px 0 #000}.bfov.pixel.bfphase small{font-size:20px;text-shadow:3px 3px 0 #000}
.bfov.pixel .bfcard h2::before,.bfov.pixel .bfcard h2::after{height:3px;width:24px;background:#d6b25e}
.bfov.pixel .bfcard{animation-timing-function:steps(6,end)}.bfov.pixel.bfloot .bfcard{border-width:3px;border-radius:0;box-shadow:4px 4px 0 #000}
/* reduce motion: everything still, cards just show and go */
.bfov.still .bfl,.bfov.still .bfcard,.bfov.still .bfpc,.bfov.still li,html.a11y-still #tbf .bftele,html.a11y-still #tbf.bfpush .tbscene{animation:none!important;opacity:1;transform:none;filter:none}
@media (prefers-reduced-motion:reduce){.bfov .bfl,.bfov .bfcard,.bfov .bfpc,.bfov li,#tbf .bftele,#tbf.bfpush .tbscene{animation:none!important}}
/* [perf] the red "next to act" pulse fades a glow layer in and out (cheap for the phone) instead of repainting the whole card every frame */
.tbu.fit-next{animation:none}
.tbu.fit-next::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;opacity:0;box-shadow:0 0 0 1px rgba(255,96,64,1),0 0 22px rgba(255,70,40,.65);animation:fitglow 1.6s ease-in-out infinite}
@keyframes fitglow{50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.tbu.fit-next::after{animation:none!important}}
/* [perf] the compass screen is fully hidden under a fight or the sky view: stop its twinkles and spins there */
body:has(> #tbf) #tw *,body:has(> #sky) #tw *{animation-play-state:paused!important}
/* ==== HUD tidy (hud2.js): one message lane, objective line, docked ★, one floating button, bars fade when full ==== */
#hudlane{position:fixed;left:8px;top:calc(env(safe-area-inset-top) + 8px);z-index:25;width:min(82vw,440px);display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none;transition:top .18s ease}
#hudlane .hl-log:empty,#hudlane .hl-say:empty{display:none}
#hudlane #hudlog{position:static;top:auto;left:auto;max-width:100%;width:100%}
#hudlane #hudlog .toast{max-width:100%;overflow-wrap:anywhere}
#hudlane #hudlog .hlog{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hudlane .hl-say{display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:100%}
#hudlane :is(.bark,.folbark){position:static;top:auto;left:auto;max-width:100%;box-sizing:border-box}
#hudlane .hl-say>.gone{opacity:0;transition:opacity .6s}
/* the objective: a thin line hanging under the compass */
.hudobj{position:absolute;top:40px;left:10px;right:52px;z-index:3;display:flex;justify-content:center;align-items:center;gap:6px;height:20px;pointer-events:none;
  font:500 12px/20px "Barlow Semi Condensed",system-ui,sans-serif;color:#efe8d6;text-shadow:0 1px 2px #000,0 0 6px #000;white-space:nowrap;overflow:hidden}
.hudobj.hide{display:none}
.hudobj .ho-d{flex:none;width:6px;height:6px;background:#f1cd72;transform:rotate(45deg);box-shadow:0 0 6px rgba(241,205,114,.6)}
.hudobj .ho-t{min-width:0;overflow:hidden;text-overflow:ellipsis;padding:0 10px;background:linear-gradient(90deg,transparent,rgba(6,7,9,.55) 18%,rgba(6,7,9,.55) 82%,transparent)}
.hudobj .ho-t b{font-weight:600;letter-spacing:.03em}
.hudobj .ho-w{color:rgba(233,226,208,.7);margin-left:6px}.hudobj .ho-w::before{content:"· "}
.hudobj .ho-t small{font:700 10px/1 "Barlow Condensed",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#f1cd72;margin-right:7px}
.hudobj.flash .ho-t{background:linear-gradient(90deg,transparent,rgba(6,7,9,.82) 12%,rgba(6,7,9,.82) 88%,transparent)}
.hudobj.flash .ho-d{animation:hudpulse 1.1s ease-in-out 3}
html.art-pixel .hudobj .ho-d{box-shadow:none}
/* map buttons: one slim capsule instead of four loose circles; the compass gets the room back */
.mapbtns{gap:0;border-radius:19px;background:rgba(8,9,11,.66);box-shadow:0 0 0 1px rgba(226,187,100,.38),0 2px 8px rgba(0,0,0,.45);overflow:hidden}
.mapbtns .iconbtn{width:36px;height:36px;border:0;border-radius:0;background:transparent;box-shadow:none;font-size:18px}
.mapbtns .iconbtn+.iconbtn{border-top:1px solid rgba(226,187,100,.2)}
.mapbtns .sneakbtn.on,.mapbtns .sneakbtn.huntbtn.on{box-shadow:inset 0 0 0 1px rgba(226,187,100,.55)}
.compass{right:52px}
html.art-pixel .mapbtns{border-radius:0}
/* bars: like Skyrim, a full bar fades away; tap the bars to see them */
.hb.full{opacity:0;transition:opacity .9s ease .6s}
.vitals.peek .hb.full,.vitals:focus-within .hb.full{opacity:.6;transition-delay:0s}
@media (hover:hover){.vitals:hover .hb.full{opacity:.6;transition-delay:0s}}
.hline .carry.light{opacity:0;transition:opacity .6s}
.vitals.peek .hline .carry.light{opacity:1}
@media (hover:hover){.vitals:hover .hline .carry.light{opacity:1}}
/* ★ favourites lives in the top bar next to Search and Menu */
.top{grid-template-columns:auto minmax(0,1fr) auto auto auto auto;grid-template-areas:"l w f v s g" "l m m m m m"}
.top #favTop{grid-area:v;width:38px;height:38px;border-radius:50%;color:#f1cd72;flex:none;background:rgba(10,11,13,.55);border:1px solid rgba(226,187,100,.38);box-shadow:inset 0 0 8px rgba(0,0,0,.6)}
.top #favTop .hico{width:19px;height:19px;fill:rgba(241,205,114,.18)}
body:not(.fav-docked) #favTop,body.fav-docked #favBtn{display:none!important}
html.art-pixel .top #favTop{border-radius:0}
@media (max-width:374px){.top .iconbtn .ibl{display:none}.top{column-gap:6px}}
/* the one floating button: smaller, and it moves (hud2.js sets right/bottom) */
.twbtn{width:46px;height:46px;transition:opacity .2s,transform .2s,bottom .25s ease,right .25s ease}
.twbtn svg{width:27px;height:27px}
html.art-pixel .twbtn,html.art-pixel .favbtn{border-radius:0}
body:has(#twBtn) .app{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
/* the bottom bar: names fit (hud2.js shrinks long ones), no keyboard letters on small screens */
.mn-bar .tab .mn-l{text-overflow:ellipsis}
@media (max-width:600px){.tab .hk{display:none!important}}
@media (max-width:440px){.mn-bar .tab{letter-spacing:0}.mn-bar .tab .mn-l{text-transform:none;font-size:10.5px;letter-spacing:.01em}}
@media (prefers-reduced-motion:reduce){#hudlane,.twbtn,.hb.full{transition:none}.hudobj.flash .ho-d{animation:none}}
/* patch notes: a header that stays put while the list scrolls (‹ Back on the title page, ✕ in the popup) */
.pnbar{position:sticky;z-index:5;display:flex;align-items:center;gap:8px;min-height:52px;background:linear-gradient(180deg,#0e0f12,#0a0b0d);border-bottom:1px solid rgba(214,178,94,.3);box-shadow:0 6px 14px rgba(0,0,0,.45)}
.pnbar h2{flex:1;margin:0!important;text-align:center;letter-spacing:.12em;text-transform:uppercase;font-size:17px}
.pnbar .pnback{flex:none;min-width:72px;min-height:44px;padding:0 12px;border:1px solid rgba(214,178,94,.4);border-radius:4px;background:rgba(0,0,0,.35);color:#f0e2b6;font:600 15px "Barlow Semi Condensed",sans-serif;letter-spacing:.04em;cursor:pointer}
.pnbar .pnback:active{background:rgba(214,178,94,.18)}
.pnbar .pnback.pnx{min-width:44px;font-size:18px}
.pnbar.pn-page::after{content:"";flex:none;width:72px}
.pnbar.pn-sheet::before{content:"";flex:none;width:44px}
.title .page .pnbar{top:-7vh;margin:-18px -18px 10px;padding:4px 10px;border-radius:4px 4px 0 0}
.sheet.pnsheet .pnbar{top:-20px;margin:-20px -18px 10px;padding:4px 10px}
html.art-pixel .pnbar,html.art-pixel .pnbar .pnback{border-radius:0}
/* [followertab] the follower's own Character tab (followertab.js): SkyUI-style gear list, empty state, one-line summary */
.ft-gear{margin-top:6px}
.ft-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ft-bar .ft-side{flex:1 1 auto;margin:0;min-width:0}
.ft-bar .ft-side button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft-wt{margin:6px 0 0}
.ft-cats{margin-top:6px}
.ft-cats .sky-cat{position:relative;min-width:58px}
.ft-cols{display:grid;grid-template-columns:minmax(0,1fr) 4.6em 3em 2.8em 3.2em;gap:6px;align-items:center}
.sky-head.ft-cols{padding:4px 10px}
.sky-head.ft-cols button{background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-align:right;padding:6px 0;min-height:32px}
.sky-head.ft-cols>:first-child{text-align:left}
.sky-row.ft-cols{width:100%;font-size:15px}
.sky-row.ft-cols .ft-ty{font-size:12px;color:#a59f90;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sky-row .nm .ft-ty2{display:none}
.ft-list{max-height:52vh;min-height:120px;overflow:auto}
.ft-detail{max-height:none}
.ft-detail h3{margin:0 0 6px}
.ft-stats{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:4px 0 8px;font-size:14px}
.ft-stats dt{color:#8c877a}
.ft-stats dd{margin:0;color:#e8dcc0}
.ft-cmp{display:flex;flex-direction:column;gap:2px;padding:6px 8px;margin:6px 0;background:rgba(255,255,255,.04);border-left:2px solid rgba(228,220,200,.25)}
.ft-cmp b.up{color:#9fe09a}
.ft-cmp b.down{color:#f0907a}
.ft-pick{display:block;padding:14px 4px;text-align:center;color:#8c877a;font-style:italic}
.ft-empty .ft-lead{font-size:18px;margin:4px 0}
.ft-empty .ft-here{margin:10px 0;padding:8px;border-left:2px solid var(--gold,#e8c46a);background:rgba(255,255,255,.04)}
.ft-empty .ft-hire .num{margin-left:4px;color:#e8c46a}
.ft-hires .ft-town{margin:0;padding:7px 2px;border-bottom:1px solid rgba(228,220,200,.08);display:flex;flex-direction:column;gap:2px}
.ft-hires .ft-town b{color:#e8dcc0;font-weight:600}
.ft-hires .ft-town span{color:#b8b09c;font-size:14px}
.ft-hires .ft-town i{font-style:normal;color:#e8c46a;font-size:12px}
.ft-sum{padding-top:8px;padding-bottom:8px}
.ft-line{width:100%;text-align:left;cursor:pointer}
html.art-pixel .ft-cmp,html.art-pixel .ft-here{border-radius:0}
html.art-pixel .ft-detail .sky-ico img{image-rendering:pixelated}
@media (max-width:440px){
  .ft-cols{grid-template-columns:minmax(0,1fr) 2.8em 2.6em 3em;gap:5px}
  .ft-cols .ft-ty{display:none}
  .sky-row .nm .ft-ty2{display:block;font-size:11px;color:#8c877a;line-height:1.1}

  .sky-row.ft-cols .nm img.art.ico{width:22px;height:22px;margin-right:5px}

}
