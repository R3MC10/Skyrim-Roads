<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyrim: Roads of the North</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a Nord's field kit at night — iron, frost, candle-lit parchment.
   IDEA: the game behaves like a folded campaign map in an iron case: the map is the screen, everything else hangs below it.
   PICTURE: the live parchment map of Skyrim with fog, your frost-blue marker and the dashed road ahead.
   COLOUR and TYPE: forged-iron charcoal, parchment map, frost blue for you and travel, ember red for danger, coin gold. Cinzel titles, Barlow Semi Condensed for the interface (Skyrim's condensed UI voice), Cormorant on the map.
   LAYOUT: phone first — status line, map, vitals, then the active panel; tab bar fixed at the bottom. Wider screens put the panel beside the map. */
:root{color-scheme:dark;--bg:#121417;--panel:#1b1e22;--panel2:#23272c;--line:#33383f;--ink:#ebe5d6;--mute:#a49d8c;--frost:#8fd3ff;--frost2:#2b5f80;--gold:#e2bb64;--ember:#d65a4a;--hp:#c4413a;--mp:#3f7fd6;--sp:#4fa35c;--parch:#d9c69c}
:root[data-theme=light]{color-scheme:dark}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#1d2228 0%,var(--bg) 60%);color:var(--ink);font:16px/1.45 "Barlow Semi Condensed",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:Cinzel,Georgia,serif;font-weight:700;margin:0;line-height:1.1;letter-spacing:.02em}
h2{font-size:20px}h3{font-size:15px;color:var(--parch)}
.app{max-width:1240px;margin:0 auto;padding:0 12px calc(84px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;padding:10px 2px 8px}
.top .who{flex:1;min-width:0}.top .who span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.top .who b{font-family:Cinzel,serif;font-size:18px;display:block;line-height:1.1}
.top .who span,.top .meta{color:var(--mute);font-size:14px}
.top .meta{text-align:right;max-width:46%;font-size:13px;line-height:1.3}.top .meta .gold{white-space:nowrap}
.top .snd,.top .soc{width:40px;height:40px;font-size:18px;flex:none}
.sndrow{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:16px}.sndrow span{width:70px}.sndrow input{flex:1;accent-color:var(--gold);height:32px}
.gold{color:var(--gold);font-weight:600}
.layout{display:grid;gap:12px}
@media(max-width:700px){.layout .mapwrap{aspect-ratio:auto;height:min(56vh,560px);width:100%}}
@media(min-width:900px){.layout{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}.side{position:sticky;top:8px}}
.mapwrap{position:relative;border-radius:10px;overflow:hidden;background:#0c0d10;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px #3a3229;aspect-ratio:10/7;touch-action:none}
.mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapbtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid #4a4237;background:rgba(18,20,23,.82);display:grid;place-items:center;font-size:20px}
.picked{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:10px;background:rgba(18,20,23,.9);border:1px solid #4a4237}
.picked .t{flex:1;line-height:1.2}.picked .t b{font-family:Cinzel,serif}.picked .t span{color:var(--mute);font-size:14px;display:block}
.vitals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.bar{height:8px;border-radius:5px;background:#2a2e34;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
.vital small{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.trip{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;gap:6px}
.trip.enc{border-color:var(--ember);background:#2a1715}
.trip .row{display:flex;align-items:center;gap:10px}.trip .row b{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel+.panel{margin-top:12px}
.sub{color:var(--mute);font-size:14px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #4d5560;background:var(--panel2);font-weight:600}
.btn.pri{background:var(--frost2);border-color:#4a8cb3;color:#eaf7ff}
.btn.danger{background:#5a1f1a;border-color:#8a3a30}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.iconbtn:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible{outline:2px solid var(--frost);outline-offset:2px}
input,select{min-height:44px;font-size:16px;border-radius:10px;border:1px solid #4d5560;background:#14171a;padding:0 10px;width:100%}
.list{display:grid;gap:6px;margin-top:10px}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid transparent}
.item.on{border-color:#4a8cb3}
.item .t{flex:1;line-height:1.25}.item .t span{display:block;color:var(--mute);font-size:14px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid #4d5560;background:transparent;min-height:36px;font-size:14px}
.chip.on{background:var(--frost2);border-color:#4a8cb3}
.evc{display:flex;flex-direction:column;gap:8px;margin-top:10px}.evc .btn{width:100%;min-height:46px}
.dun{position:fixed;inset:0;z-index:8;overflow:auto;background:radial-gradient(90% 50% at 50% 0%,#2a2620 0%,#0d0e10 70%);padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
.dun .in{width:min(560px,100%);margin:0 auto;display:grid;gap:10px}
.dun .hd{display:flex;align-items:center;gap:8px}.dun .hd h2{flex:1;margin:0;font-size:20px}
.dun .card{background:var(--panel);border:1px solid #4a4237;border-radius:12px;padding:14px}
.dun .card.foe{border-color:var(--ember)}.dun .card.res{border-color:#5c6a52}
.dun .card h3{margin:0 0 6px;font-family:Cinzel,serif;font-size:17px}
.dun .card p{margin:6px 0}
.dun svg{width:100%;height:auto;display:block}
.dun .node{cursor:pointer}.dun .node:focus{outline:none}
.dun .node circle{fill:#24282d;stroke:#4d5560;stroke-width:2}
.dun .node.done circle{fill:#3a3427;stroke:#8a7a5c}
.dun .node.here circle{stroke:var(--gold);stroke-width:3}
.dun .node.next circle{stroke:var(--frost);stroke-width:3;animation:pulse 1.6s ease-in-out infinite}
.dun .node.boss circle{stroke:var(--ember)}
@keyframes pulse{50%{stroke-opacity:.35}}
@media (prefers-reduced-motion:reduce){.dun .node.next circle{animation:none}}
.dun .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px;margin-top:8px}
.skill small{display:flex;justify-content:space-between}.skill .bar{height:5px;margin-top:3px}
.log{display:grid;gap:4px;margin-top:8px;font-size:15px}
.log div{padding:6px 0;border-bottom:1px solid #2a2e34}
.log time{color:var(--mute);font-size:13px;margin-right:6px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:rgba(14,16,19,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5;backdrop-filter:blur(6px)}
.tab{border:0;background:none;padding:8px 2px 10px;min-height:56px;color:var(--mute);font-size:12px;display:grid;justify-items:center;gap:2px;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.on{color:var(--frost)}
.tab .dot{position:absolute;top:6px;right:calc(50% - 16px);width:9px;height:9px;border-radius:50%;background:var(--gold)}
.modal{position:fixed;inset:0;background:rgba(5,6,8,.72);display:grid;place-items:end center;z-index:10;padding:12px}
@media(min-width:700px){.modal{place-items:center}}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid #4a4237;border-radius:14px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet.enc{border-color:var(--ember)}
.danger-low{color:#8fd08f}.danger-medium{color:var(--gold)}.danger-high{color:var(--ember)}
.flog{font-size:14px;margin-top:10px;max-height:260px;overflow:auto;border-top:1px solid var(--line)}
.flog div{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:6px;padding:4px 0;border-bottom:1px solid #2a2e34}
.flog .r{color:var(--frost)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#24292f;border:1px solid #4d5560;border-radius:10px;padding:10px 14px;z-index:20;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.races{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.race{text-align:left;padding:10px;border-radius:10px;border:1px solid #4d5560;background:var(--panel2);min-height:44px}
.race.on{border-color:var(--frost);background:#1c2c38}
.race b{font-family:Cinzel,serif;display:block}.race span{font-size:13px;color:var(--mute)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--mute)}.status.live i{background:var(--sp)}
.hide{display:none!important}
.rule{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;background:var(--panel2);border-radius:10px}
.rule .n{color:var(--frost);font-weight:600}
.rule .acts{display:flex;gap:4px}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.slot{padding:8px 10px;border-radius:10px;background:var(--panel2);font-size:14px}.slot span{color:var(--mute);display:block;font-size:12px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* ---- Skyrim look: smoky panels, thin silver rules, centred small-caps headings */
.panel{background:linear-gradient(180deg,rgba(26,28,31,.96),rgba(14,15,17,.96));border:1px solid rgba(228,220,200,.16);border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 24px rgba(0,0,0,.35)}
.panel>h2{display:flex;align-items:center;gap:12px;justify-content:center;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#efe8d6;margin:2px 0 6px}
.panel>h2::before,.panel>h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(228,220,200,.45))}
.panel>h2::after{background:linear-gradient(90deg,rgba(228,220,200,.45),transparent)}
.panel h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#cfc6b0;border-bottom:1px solid rgba(228,220,200,.12);padding-bottom:4px}
.item{background:rgba(255,255,255,.035);border:0;border-left:2px solid transparent;border-radius:2px}
.item.on{border-left-color:var(--gold);background:linear-gradient(90deg,rgba(226,187,100,.12),rgba(255,255,255,.03))}
.btn{border-radius:3px;border-color:rgba(228,220,200,.28);background:rgba(255,255,255,.04);letter-spacing:.03em}
.btn.pri{background:rgba(143,211,255,.12);border-color:rgba(143,211,255,.55);color:#eaf7ff}
.btn.danger{background:rgba(214,90,74,.16);border-color:rgba(214,90,74,.6)}
.chip{border-radius:2px;border-color:rgba(228,220,200,.22)}
.chip.on{background:rgba(255,255,255,.1);border-color:rgba(228,220,200,.7);color:#fff}
.trip{border-radius:4px;background:linear-gradient(180deg,rgba(26,28,31,.96),rgba(14,15,17,.96));border-color:rgba(228,220,200,.16)}
.tabs{background:linear-gradient(180deg,rgba(14,15,17,.92),rgba(6,7,8,.98));border-top:1px solid rgba(228,220,200,.18)}
.tab.on{color:#f4ecd8}.tab.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:#e8e1cf}
.sheet{border-radius:4px;background:linear-gradient(180deg,rgba(26,28,31,.98),rgba(12,13,15,.98));border-color:rgba(228,220,200,.22)}
input,select{border-radius:3px;border-color:rgba(228,220,200,.22);background:rgba(0,0,0,.35)}
/* ---- the Skyrim / SkyUI menu */
.sky{position:fixed;inset:0;z-index:9;background:radial-gradient(120% 70% at 0% 0%,#15171a 0%,#050607 70%);display:flex;justify-content:center}
.sky-in{width:min(720px,100%);display:flex;flex-direction:column;height:100%;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.sky-top{display:flex;align-items:center;gap:8px}
.sky-pages{flex:1;display:flex;justify-content:center;gap:6px}
.sky-page{background:none;border:0;border-bottom:2px solid transparent;color:#8c877a;font-family:Cinzel,serif;font-size:15px;letter-spacing:.2em;text-transform:uppercase;padding:10px 10px;min-height:44px}
.sky-page.on{color:#f4ecd8;border-bottom-color:#e8e1cf}
.sky-cats{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:6px;border-top:1px solid rgba(228,220,200,.14);border-bottom:1px solid rgba(228,220,200,.14);padding:4px 0}
.sky-cats::-webkit-scrollbar{display:none}
.sky-cat{flex:none;display:grid;justify-items:center;gap:2px;min-width:64px;min-height:52px;background:none;border:0;color:#8c877a;font-size:11px;padding:4px 6px;border-radius:2px}
.sky-cat svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.sky-cat.on{color:#f4ecd8;background:rgba(255,255,255,.07)}
.sky-title{font-family:Cinzel,serif;letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:#cfc6b0;margin:8px 4px 2px}
.sky-cols{display:grid;grid-template-columns:minmax(0,1fr) 3.4em 3.2em 3.8em;gap:8px;align-items:center}
.sky-cols2{display:grid;grid-template-columns:minmax(0,1fr) 4em;gap:8px;align-items:center}
.sky-head{padding:4px 10px;color:#8c877a;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.sky-head button,.sky-head span{background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-align:right;padding:6px 0}
.sky-head>:first-child{text-align:left}
.sky-list{flex:1;overflow:auto;display:flex;flex-direction:column;border-top:1px solid rgba(228,220,200,.1)}
.sky-row{background:none;border:0;border-left:2px solid transparent;text-align:right;padding:9px 10px;min-height:44px;color:#ddd5c2;font-size:16px}
.sky-row .nm{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sky-row .nm i{font-style:normal;color:#8c877a}.sky-row .nm .ench{color:#9fd0f0}.sky-row .nm .stolen{color:var(--ember)}
.sky-row .nm small{display:block;color:#8c877a;font-size:12px}
.sky-row .nm .bar{display:block;height:3px;margin-top:4px;max-width:180px}
.sky-row.eq .nm::before{content:"◆ ";color:#e8e1cf;font-size:12px}
.sky-row.sel{background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.02));border-left-color:#e8e1cf;color:#fff}
.sky-empty{padding:16px 10px}
.sky-detail{border-top:1px solid rgba(228,220,200,.18);padding:10px 6px 4px;max-height:44vh;overflow:auto}
.sky-detail h3{font-family:Cinzel,serif;font-size:19px;letter-spacing:.06em;color:#f4ecd8;text-transform:none;border:0;padding:0}
.sky-stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin:6px 0}
.sky-stats div{display:flex;gap:6px;align-items:baseline}.sky-stats span{color:#8c877a;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.sky-detail p{margin:4px 0}
.sky-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sky-acts .btn{flex:1 1 auto}
.sky-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid rgba(228,220,200,.18);margin-top:6px;padding:8px 6px 4px;font-size:13px;color:#8c877a;letter-spacing:.08em;text-transform:uppercase}
.sky-foot b{color:#f4ecd8;letter-spacing:0;margin-left:4px}.sky-foot .gold{text-transform:none;letter-spacing:0}
.sky-vitals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:2px 6px 4px}.sky-vitals .bar{height:5px}

/* ---- title screen ---- */
.title{position:fixed;inset:0;z-index:60;background:radial-gradient(90% 70% at 50% 35%,#20262d 0%,#0b0d10 70%,#050607 100%);display:flex;flex-direction:column;align-items:center;overflow:hidden;color:var(--ink)}
.title canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.title .vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 50%,rgba(0,0,0,.75) 100%)}
.title .inner{position:relative;z-index:1;width:min(520px,100%);flex:1;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 7vh) 20px calc(env(safe-area-inset-bottom) + 18px);overflow-y:auto}
.title .emb{width:92px;height:92px;opacity:.95;filter:drop-shadow(0 0 18px rgba(226,187,100,.25));animation:tfade 1.6s ease both}
.title h1{margin-top:14px;text-align:center;font-size:clamp(30px,9vw,46px);letter-spacing:.14em;line-height:1.05;background:linear-gradient(180deg,#f4efe2 0%,#c9c1ad 55%,#8d8571 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 24px rgba(0,0,0,.6);animation:tfade 1.8s .2s ease both}
.title .tag{margin-top:8px;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:19px;color:var(--mute);letter-spacing:.04em;animation:tfade 2s .5s ease both}
.title .press:focus{outline:none}
.title .press{margin-top:auto;margin-bottom:12vh;font-family:Cinzel,serif;letter-spacing:.3em;font-size:15px;color:#d8d1c0;text-transform:uppercase;background:none;border:0;padding:20px 30px;animation:tpulse 2.6s ease-in-out infinite}
.title .menu{margin-top:auto;margin-bottom:4vh;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;animation:tfade .8s ease both}
.title .mi{position:relative;background:none;border:0;padding:12px 8px;min-height:52px;width:100%;font-family:Cinzel,serif;font-weight:600;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a1;transition:color .2s,text-shadow .2s;display:flex;flex-direction:column;align-items:center}
.title .mi small{font-family:"Barlow Semi Condensed",sans-serif;font-weight:500;font-size:14px;letter-spacing:.04em;text-transform:none;color:var(--mute);margin-top:2px}
.title .mi .lbl{position:relative;display:inline-block;padding:0 6px}
.title .mi .lbl::before,.title .mi .lbl::after{content:"";position:absolute;top:50%;width:0;height:1px;opacity:0;transition:width .25s,opacity .25s}
.title .mi .lbl::before{right:100%;background:linear-gradient(270deg,rgba(255,255,255,.85),transparent)}
.title .mi .lbl::after{left:100%;background:linear-gradient(90deg,rgba(255,255,255,.85),transparent)}
.title .mi:hover,.title .mi:focus-visible,.title .mi.sel{color:#fff;text-shadow:0 0 14px rgba(255,255,255,.35);outline:none}
.title .mi:hover .lbl::before,.title .mi:hover .lbl::after,.title .mi:focus-visible .lbl::before,.title .mi:focus-visible .lbl::after,.title .mi.sel .lbl::before,.title .mi.sel .lbl::after{width:min(70px,14vw);opacity:1}
.title .mi .badge{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;background:var(--gold);color:#1b1408;font:600 12px "Barlow Semi Condensed",sans-serif;letter-spacing:.04em;vertical-align:middle}
.title .foot{position:relative;z-index:1;font-size:13px;color:#7d7768;text-align:center;padding:0 16px calc(env(safe-area-inset-bottom) + 10px);letter-spacing:.03em}
.title .page{margin-top:22px;width:100%;background:rgba(14,16,19,.82);border:1px solid #3a3530;border-radius:4px;padding:18px 18px 16px;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:tfade .4s ease both}
.title .page h2{text-align:center;letter-spacing:.12em;text-transform:uppercase;font-size:18px;margin-bottom:10px}
.title .page h3{margin:14px 0 4px}
