<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyrim: Roads of the North</title>
<style>/* fonts bundled with the game (work offline) */
@font-face{font-family:"Cinzel";font-style:normal;font-weight:600;font-display:swap;src:url(font-cinzel-600.woff2) format("woff2")}
@font-face{font-family:"Cinzel";font-style:normal;font-weight:700;font-display:swap;src:url(font-cinzel-700.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:400;font-display:swap;src:url(font-barlow-semi-condensed-400.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(font-barlow-semi-condensed-500.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(font-barlow-semi-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(font-barlow-condensed-500.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(font-barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:600;font-display:swap;src:url(font-cormorant-garamond-600.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:700;font-display:swap;src:url(font-cormorant-garamond-700.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:600;font-display:swap;src:url(font-cormorant-garamond-600-italic.woff2) format("woff2")}

</style>
<style>
/* VOICE: a Nord's field kit at night — iron, frost, candle-lit parchment.
   IDEA: the game behaves like a folded campaign map in an iron case: the map is the screen, everything else hangs below it.
   PICTURE: the live parchment map of Skyrim with fog, your frost-blue marker and the dashed road ahead.
   COLOUR and TYPE: forged-iron charcoal, parchment map, frost blue for you and travel, ember red for danger, coin gold. Cinzel titles, Barlow Semi Condensed for the interface (Skyrim's condensed UI voice), Cormorant on the map.
   LAYOUT: phone first — status line, map, vitals, then the active panel; tab bar fixed at the bottom. Wider screens put the panel beside the map. */
:root{color-scheme:dark;--bg:#121417;--panel:#1b1e22;--panel2:#23272c;--line:#33383f;--ink:#ebe5d6;--mute:#a49d8c;--frost:#8fd3ff;--frost2:#2b5f80;--gold:#e2bb64;--ember:#d65a4a;--hp:#c4413a;--mp:#3f7fd6;--sp:#4fa35c;--parch:#d9c69c}
:root[data-theme=light]{color-scheme:dark}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#1d2228 0%,var(--bg) 60%);color:var(--ink);font:16px/1.45 "Barlow Semi Condensed",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:Cinzel,Georgia,serif;font-weight:700;margin:0;line-height:1.1;letter-spacing:.02em}
h2{font-size:20px}h3{font-size:15px;color:var(--parch)}
.app{max-width:1240px;margin:0 auto;padding:0 12px calc(84px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;padding:10px 2px 8px}
.top .who{flex:1;min-width:0}.top .who span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.top .who b{font-family:Cinzel,serif;font-size:18px;display:block;line-height:1.1}
.top .who span,.top .meta{color:var(--mute);font-size:14px}
.top .meta{text-align:right;max-width:46%;font-size:13px;line-height:1.3}.top .meta .gold{white-space:nowrap}
.top .snd,.top .soc{width:40px;height:40px;font-size:18px;flex:none}
.sndrow{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:16px}.sndrow span{width:70px}.sndrow input{flex:1;accent-color:var(--gold);height:32px}
.gold{color:var(--gold);font-weight:600}
.layout{display:grid;gap:12px}
@media(max-width:700px){.layout .mapwrap{aspect-ratio:auto;height:min(56vh,560px);width:100%}}
@media(min-width:900px){.layout{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}.side{position:sticky;top:8px}}
.mapwrap{position:relative;border-radius:10px;overflow:hidden;background:#0c0d10;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px #3a3229;aspect-ratio:10/7;touch-action:none}
.mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapbtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid #4a4237;background:rgba(18,20,23,.82);display:grid;place-items:center;font-size:20px}
.picked{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:10px;background:rgba(18,20,23,.9);border:1px solid #4a4237}
.picked .t{flex:1;line-height:1.2}.picked .t b{font-family:Cinzel,serif}.picked .t span{color:var(--mute);font-size:14px;display:block}
.vitals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.bar{height:8px;border-radius:5px;background:#2a2e34;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
.vital small{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.trip{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;gap:6px}
.trip.enc{border-color:var(--ember);background:#2a1715}
.trip .row{display:flex;align-items:center;gap:10px}.trip .row b{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel+.panel{margin-top:12px}
.sub{color:var(--mute);font-size:14px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #4d5560;background:var(--panel2);font-weight:600}
.btn.pri{background:var(--frost2);border-color:#4a8cb3;color:#eaf7ff}
.btn.danger{background:#5a1f1a;border-color:#8a3a30}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.iconbtn:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible{outline:2px solid var(--frost);outline-offset:2px}
input,select{min-height:44px;font-size:16px;border-radius:10px;border:1px solid #4d5560;background:#14171a;padding:0 10px;width:100%}
.list{display:grid;gap:6px;margin-top:10px}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid transparent}
.item.on{border-color:#4a8cb3}
.item .t{flex:1;line-height:1.25}.item .t span{display:block;color:var(--mute);font-size:14px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid #4d5560;background:transparent;min-height:36px;font-size:14px}
.chip.on{background:var(--frost2);border-color:#4a8cb3}
.evc{display:flex;flex-direction:column;gap:8px;margin-top:10px}.evc .btn{width:100%;min-height:46px}
.dun{position:fixed;inset:0;z-index:8;overflow:auto;background:radial-gradient(90% 50% at 50% 0%,#2a2620 0%,#0d0e10 70%);padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
.dun .in{width:min(560px,100%);margin:0 auto;display:grid;gap:10px}
.dun .hd{display:flex;align-items:center;gap:8px}.dun .hd h2{flex:1;margin:0;font-size:20px}
.dun .card{background:var(--panel);border:1px solid #4a4237;border-radius:12px;padding:14px}
.dun .card.foe{border-color:var(--ember)}.dun .card.res{border-color:#5c6a52}
.dun .card h3{margin:0 0 6px;font-family:Cinzel,serif;font-size:17px}
.dun .card p{margin:6px 0}
.dun svg{width:100%;height:auto;display:block}
.dun .node{cursor:pointer}.dun .node:focus{outline:none}
.dun .node circle{fill:#24282d;stroke:#4d5560;stroke-width:2}
.dun .node.done circle{fill:#3a3427;stroke:#8a7a5c}
.dun .node.here circle{stroke:var(--gold);stroke-width:3}
.dun .node.next circle{stroke:var(--frost);stroke-width:3;animation:pulse 1.6s ease-in-out infinite}
.dun .node.boss circle{stroke:var(--ember)}
@keyframes pulse{50%{stroke-opacity:.35}}
@media (prefers-reduced-motion:reduce){.dun .node.next circle{animation:none}}
.dun .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px;margin-top:8px}
.skill small{display:flex;justify-content:space-between}.skill .bar{height:5px;margin-top:3px}
.log{display:grid;gap:4px;margin-top:8px;font-size:15px}
.log div{padding:6px 0;border-bottom:1px solid #2a2e34}
.log time{color:var(--mute);font-size:13px;margin-right:6px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:rgba(14,16,19,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5;backdrop-filter:blur(6px)}
.tab{border:0;background:none;padding:8px 2px 10px;min-height:56px;color:var(--mute);font-size:12px;display:grid;justify-items:center;gap:2px;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.on{color:var(--frost)}
.tab .dot{position:absolute;top:6px;right:calc(50% - 16px);width:9px;height:9px;border-radius:50%;background:var(--gold)}
.modal{position:fixed;inset:0;background:rgba(5,6,8,.72);display:grid;place-items:end center;z-index:10;padding:12px}
@media(min-width:700px){.modal{place-items:center}}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid #4a4237;border-radius:14px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet.enc{border-color:var(--ember)}
.danger-low{color:#8fd08f}.danger-medium{color:var(--gold)}.danger-high{color:var(--ember)}
.flog{font-size:14px;margin-top:10px;max-height:260px;overflow:auto;border-top:1px solid var(--line)}
.flog div{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:6px;padding:4px 0;border-bottom:1px solid #2a2e34}
.flog .r{color:var(--frost)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#24292f;border:1px solid #4d5560;border-radius:10px;padding:10px 14px;z-index:20;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.races{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.race{text-align:left;padding:10px;border-radius:10px;border:1px solid #4d5560;background:var(--panel2);min-height:44px}
.race.on{border-color:var(--frost);background:#1c2c38}
.race b{font-family:Cinzel,serif;display:block}.race span{font-size:13px;color:var(--mute)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--mute)}.status.live i{background:var(--sp)}
.hide{display:none!important}
.rule{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;background:var(--panel2);border-radius:10px}
.rule .n{color:var(--frost);font-weight:600}
.rule .acts{display:flex;gap:4px}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.slot{padding:8px 10px;border-radius:10px;background:var(--panel2);font-size:14px}.slot span{color:var(--mute);display:block;font-size:12px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* ---- Skyrim look: smoky panels, thin silver rules, centred small-caps headings */
.panel{background:linear-gradient(180deg,rgba(26,28,31,.96),rgba(14,15,17,.96));border:1px solid rgba(228,220,200,.16);border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 24px rgba(0,0,0,.35)}
.panel>h2{display:flex;align-items:center;gap:12px;justify-content:center;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#efe8d6;margin:2px 0 6px}
.panel>h2::before,.panel>h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(228,220,200,.45))}
.panel>h2::after{background:linear-gradient(90deg,rgba(228,220,200,.45),transparent)}
.panel h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#cfc6b0;border-bottom:1px solid rgba(228,220,200,.12);padding-bottom:4px}
.item{background:rgba(255,255,255,.035);border:0;border-left:2px solid transparent;border-radius:2px}
.item.on{border-left-color:var(--gold);background:linear-gradient(90deg,rgba(226,187,100,.12),rgba(255,255,255,.03))}
.btn{border-radius:3px;border-color:rgba(228,220,200,.28);background:rgba(255,255,255,.04);letter-spacing:.03em}
.btn.pri{background:rgba(143,211,255,.12);border-color:rgba(143,211,255,.55);color:#eaf7ff}
.btn.danger{background:rgba(214,90,74,.16);border-color:rgba(214,90,74,.6)}
.chip{border-radius:2px;border-color:rgba(228,220,200,.22)}
.chip.on{background:rgba(255,255,255,.1);border-color:rgba(228,220,200,.7);color:#fff}
.trip{border-radius:4px;background:linear-gradient(180deg,rgba(26,28,31,.96),rgba(14,15,17,.96));border-color:rgba(228,220,200,.16)}
.tabs{background:linear-gradient(180deg,rgba(14,15,17,.92),rgba(6,7,8,.98));border-top:1px solid rgba(228,220,200,.18)}
.tab.on{color:#f4ecd8}.tab.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:#e8e1cf}
.sheet{border-radius:4px;background:linear-gradient(180deg,rgba(26,28,31,.98),rgba(12,13,15,.98));border-color:rgba(228,220,200,.22)}
input,select{border-radius:3px;border-color:rgba(228,220,200,.22);background:rgba(0,0,0,.35)}
/* ---- the Skyrim / SkyUI menu */
.sky{position:fixed;inset:0;z-index:9;background:radial-gradient(120% 70% at 0% 0%,#15171a 0%,#050607 70%);display:flex;justify-content:center}
.sky-in{width:min(720px,100%);display:flex;flex-direction:column;height:100%;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.sky-top{display:flex;align-items:center;gap:8px}
.sky-pages{flex:1;display:flex;justify-content:center;gap:6px}
.sky-page{background:none;border:0;border-bottom:2px solid transparent;color:#8c877a;font-family:Cinzel,serif;font-size:15px;letter-spacing:.2em;text-transform:uppercase;padding:10px 10px;min-height:44px}
.sky-page.on{color:#f4ecd8;border-bottom-color:#e8e1cf}
.sky-cats{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:6px;border-top:1px solid rgba(228,220,200,.14);border-bottom:1px solid rgba(228,220,200,.14);padding:4px 0}
.sky-cats::-webkit-scrollbar{display:none}
.sky-cat{flex:none;display:grid;justify-items:center;gap:2px;min-width:64px;min-height:52px;background:none;border:0;color:#8c877a;font-size:11px;padding:4px 6px;border-radius:2px}
.sky-cat svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.sky-cat.on{color:#f4ecd8;background:rgba(255,255,255,.07)}
.sky-title{font-family:Cinzel,serif;letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:#cfc6b0;margin:8px 4px 2px}
.sky-cols{display:grid;grid-template-columns:minmax(0,1fr) 3.4em 3.2em 3.8em;gap:8px;align-items:center}
.sky-cols2{display:grid;grid-template-columns:minmax(0,1fr) 4em;gap:8px;align-items:center}
.sky-head{padding:4px 10px;color:#8c877a;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.sky-head button,.sky-head span{background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-align:right;padding:6px 0}
.sky-head>:first-child{text-align:left}
.sky-list{flex:1;overflow:auto;display:flex;flex-direction:column;border-top:1px solid rgba(228,220,200,.1)}
.sky-row{background:none;border:0;border-left:2px solid transparent;text-align:right;padding:9px 10px;min-height:44px;color:#ddd5c2;font-size:16px}
.sky-row .nm{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sky-row .nm i{font-style:normal;color:#8c877a}.sky-row .nm .ench{color:#9fd0f0}.sky-row .nm .stolen{color:var(--ember)}
.sky-row .nm small{display:block;color:#8c877a;font-size:12px}
.sky-row .nm .bar{display:block;height:3px;margin-top:4px;max-width:180px}
.sky-row.eq .nm::before{content:"◆ ";color:#e8e1cf;font-size:12px}
.sky-row.sel{background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.02));border-left-color:#e8e1cf;color:#fff}
.sky-empty{padding:16px 10px}
.sky-detail{border-top:1px solid rgba(228,220,200,.18);padding:10px 6px 4px;max-height:44vh;overflow:auto}
.sky-detail h3{font-family:Cinzel,serif;font-size:19px;letter-spacing:.06em;color:#f4ecd8;text-transform:none;border:0;padding:0}
.sky-stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin:6px 0}
.sky-stats div{display:flex;gap:6px;align-items:baseline}.sky-stats span{color:#8c877a;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.sky-detail p{margin:4px 0}
.sky-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sky-acts .btn{flex:1 1 auto}
.sky-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid rgba(228,220,200,.18);margin-top:6px;padding:8px 6px 4px;font-size:13px;color:#8c877a;letter-spacing:.08em;text-transform:uppercase}
.sky-foot b{color:#f4ecd8;letter-spacing:0;margin-left:4px}.sky-foot .gold{text-transform:none;letter-spacing:0}
.sky-vitals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:2px 6px 4px}.sky-vitals .bar{height:5px}

/* ---- title screen ---- */
.title{position:fixed;inset:0;z-index:60;background:radial-gradient(90% 70% at 50% 35%,#20262d 0%,#0b0d10 70%,#050607 100%);display:flex;flex-direction:column;align-items:center;overflow:hidden;color:var(--ink)}
.title canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.title .vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 50%,rgba(0,0,0,.75) 100%)}
.title .inner{position:relative;z-index:1;width:min(520px,100%);flex:1;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 7vh) 20px calc(env(safe-area-inset-bottom) + 18px);overflow-y:auto}
.title .emb{width:92px;height:92px;opacity:.95;filter:drop-shadow(0 0 18px rgba(226,187,100,.25));animation:tfade 1.6s ease both}
.title h1{margin-top:14px;text-align:center;font-size:clamp(30px,9vw,46px);letter-spacing:.14em;line-height:1.05;background:linear-gradient(180deg,#f4efe2 0%,#c9c1ad 55%,#8d8571 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 24px rgba(0,0,0,.6);animation:tfade 1.8s .2s ease both}
.title .tag{margin-top:8px;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:19px;color:var(--mute);letter-spacing:.04em;animation:tfade 2s .5s ease both}
.title .press:focus{outline:none}
.title .press{margin-top:auto;margin-bottom:12vh;font-family:Cinzel,serif;letter-spacing:.3em;font-size:15px;color:#d8d1c0;text-transform:uppercase;background:none;border:0;padding:20px 30px;animation:tpulse 2.6s ease-in-out infinite}
.title .menu{margin-top:auto;margin-bottom:4vh;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;animation:tfade .8s ease both}
.title .mi{position:relative;background:none;border:0;padding:12px 8px;min-height:52px;width:100%;font-family:Cinzel,serif;font-weight:600;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a1;transition:color .2s,text-shadow .2s;display:flex;flex-direction:column;align-items:center}
.title .mi small{font-family:"Barlow Semi Condensed",sans-serif;font-weight:500;font-size:14px;letter-spacing:.04em;text-transform:none;color:var(--mute);margin-top:2px}
.title .mi .lbl{position:relative;display:inline-block;padding:0 6px}
.title .mi .lbl::before,.title .mi .lbl::after{content:"";position:absolute;top:50%;width:0;height:1px;opacity:0;transition:width .25s,opacity .25s}

html.art-pixel .bar,html.art-pixel .bar i{border-radius:0}
@media (prefers-reduced-motion:reduce){.modal,.modal .sheet,.toast.pop,#side.pswap,.pban,.pban.out,.pgold{animation:none!important}.btn:active,.chip:active,.iconbtn:active,.tab:active{transform:none}}
/* ---- paper doll (dollart.js) */
.sky-doll{padding:8px 2px 4px}.sky-doll .doll{max-width:420px;margin:0 auto}.sky-doll .dsum{display:none}
.doll{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:6px;margin:4px 0 6px}
.dcol{display:flex;flex-direction:column;gap:8px;align-items:center}
.dfig{display:flex;justify-content:center}.dfig img{border:1px solid #4a4237;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.35);max-width:100%;height:auto}
.dslot{position:relative;width:60px;min-height:60px;padding:4px 2px 2px;border-radius:8px;border:1px solid #4a4237;background:rgba(18,20,23,.55);display:flex;flex-direction:column;align-items:center;gap:1px;color:inherit;cursor:pointer}
.dslot.full{border-color:#7a6a4a;background:rgba(214,178,94,.08)}.dslot:active{transform:scale(.96)}
.dslot img.art{border-radius:6px}.dslot .dsl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.dslot .dst{position:absolute;top:-7px;right:-7px;min-width:20px;padding:1px 4px;border-radius:9px;background:#1c2128;border:1px solid #7a6a4a;font-size:11px;line-height:15px;color:var(--gold)}
.dammo{display:flex;align-items:center;gap:8px;margin:2px 0 4px;font-size:14px}.dammo i{color:var(--mute);font-style:normal;font-size:12px}.dammo.warn{color:#e88}
.dsum{display:flex;justify-content:space-around;gap:6px;padding:6px 4px;border-top:1px solid #3a3226;border-bottom:1px solid #3a3226;font-size:14px;color:var(--mute)}.dsum b{color:#f1e6cc}
.dpick{max-height:52vh;overflow:auto}.dpick .item{width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.dcmp{min-width:46px;text-align:right;font-size:13px}.dcmp i{color:var(--mute);font-style:normal}.dup{color:#7fd07a}.ddown{color:#e07a6a}.dsame{color:var(--mute)}
.lochip{display:inline-flex;align-items:center;gap:6px}.lochip img.art{border-radius:50%}
.rgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.rpick{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;border:1px solid #4d5560;background:var(--panel2);color:inherit;font-size:11px;min-height:44px}
.rpick.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:rgba(214,178,94,.1)}.rpick img.art{border-radius:50%}
.rshow{display:grid;grid-template-columns:150px 1fr;gap:12px;margin-top:10px;padding:10px;border:1px solid #3a3226;border-radius:10px;background:rgba(18,20,23,.45)}
.rshow h3{margin:0 0 4px}.rshow .sub{margin:0 0 6px}.rsk{display:flex;flex-wrap:wrap;gap:4px 10px}.rskill{display:inline-flex;align-items:center;gap:4px;font-size:13px}.rskill b{color:var(--gold)}
.rpow{display:flex;align-items:center;gap:8px;margin:8px 0 0;font-size:13px}.rpow img.art{border-radius:50%;flex:none}
@media (max-width:420px){.rshow{grid-template-columns:1fr}.rfig{display:flex;justify-content:center}}
.npctalk{display:flex;gap:10px;align-items:center;margin:8px 0 4px;padding:8px 10px;background:rgba(21,19,15,.85);border:1px solid #3a3226;border-radius:8px}.npctalk img.npcport{flex:none;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.npct{min-width:0}.npct b{display:block;font-family:Cinzel,serif;font-size:15px;line-height:1.2}.npcrole{display:block;color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:1px}.npct q{display:block;font-style:italic;margin-top:5px;font-size:14px;line-height:1.35;color:#e9dcc0}
.item img.npcport{flex:none;border-radius:6px}
img.art.scene.evt{margin:0 0 10px}.modal img.art.scene.evt{margin:-2px 0 10px}
img.art.wagon{display:block;flex:none}.cvcard .cvhead{display:flex;gap:10px;align-items:center}.cvguards{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.cvguards span{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mute)}
/* ---- sky (skyart.js): the little weather picture in the top bar */
#clock .skyw{display:inline-block;vertical-align:-6px;margin-right:4px}#clock img.skyic{display:inline-block;border-radius:5px}
@keyframes skybob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}@keyframes skyglow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
#clock img.skyic.wx-cloudy,#clock img.skyic.wx-rain,#clock img.skyic.wx-storm,#clock img.skyic.wx-snow,#clock img.skyic.wx-blizzard,#clock img.skyic.wx-fog{animation:skybob 3.2s ease-in-out infinite}
#clock img.skyic.wx-clear{animation:skyglow 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){#clock img.skyic{animation:none!important}}
/* ---- raids, arena, clans (raidart.js) */
.raidhp{margin:8px 0 6px}.raidhp-top{display:flex;justify-content:space-between;font-weight:600;font-size:14px}.raidhp-bar{height:10px;background:#2a1a16;border:1px solid #5a2a22;border-radius:5px;overflow:hidden;margin-top:4px}.raidhp-bar i{display:block;height:100%;background:linear-gradient(90deg,#7a1f17,#c4372a 60%,#e8923a);transition:width .6s}
.raidtop{display:flex;flex-direction:column;gap:4px;margin-top:8px}.raidtop .rt{display:flex;align-items:center;gap:8px;font-size:14px}.raidtop .rt img{flex:none;border-radius:50%}.raidtop .rt .rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.raidtop .rt.me .rn{color:var(--gold)}
.arena-scene{margin:4px 0 8px;border:1px solid #4a4237;border-radius:6px;overflow:hidden;line-height:0;cursor:pointer}.arena-scene canvas{display:block;width:100%;height:auto}
img.season-banner{display:block;width:100%;height:auto;margin:2px 0 8px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:4px 0 10px}.pod{display:flex;flex-direction:column;align-items:center;gap:2px;width:30%;min-width:0}.pod b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pod span{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--gold)}.pod img{border-radius:50%}.pod i{display:flex;align-items:flex-start;justify-content:center;width:100%;font-style:normal;font-family:Cinzel,serif;font-weight:700;color:#3b2c1e;background:linear-gradient(180deg,#d6b25e,#a4853e);border:1px solid #6b5640;border-radius:4px 4px 0 0;padding-top:3px}.pod.p2 i{background:linear-gradient(180deg,#c9c9c9,#8f8f8f)}.pod.p3 i{background:linear-gradient(180deg,#c88a52,#8a5a34)}
.versus{display:flex;align-items:center;gap:6px;width:100%;margin-bottom:6px}.versus img{flex:none;border-radius:50%}.versus .vn{flex:1;min-width:0;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.versus .vn:last-of-type{text-align:right}.versus .vs{display:flex;flex-direction:column;align-items:center;color:var(--ember);font-size:18px;line-height:1}.versus .vs small{font-size:10px;color:var(--gold);margin-top:2px}
.clanhead{display:flex;gap:12px;align-items:center;margin:4px 0 6px}.clanhead b{display:block;font-family:Cinzel,serif;font-size:18px}.clanhead .num{display:block;color:var(--gold);font-weight:700}.clanhead .sub{display:block}img.clan-banner{flex:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))}
img.holds-map{display:block;width:100%;height:auto;border-radius:6px;margin:6px 0 10px;border:1px solid #4a4237}
#toast img.clan-banner{vertical-align:middle;margin-right:4px}
.hscene{position:relative;margin:2px 0 8px}.hscene img.art.scene{margin:0}.hscene .hot{position:absolute;background:transparent;border:0;padding:0;border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:rgba(214,178,94,.25)}.hscene .hot:focus-visible{outline:2px solid var(--gold)}
.bardsong{margin:10px 0 6px;padding:10px 12px;background:rgba(21,19,15,.85);border:1px solid #3a3226;border-radius:8px}.bardsong h3{margin:0 0 4px}.bardsong ol{margin:6px 0 8px;padding-left:20px}.bardsong li{margin:4px 0;line-height:1.35}.bardsong li i{font-style:italic}.bardsong li small{display:block;color:var(--mute);font-size:12px}
.verse{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid #2a251d}.verse .vt{flex:1;min-width:0}.verse .vt i{display:block;line-height:1.35}.verse .vt small{color:var(--mute);font-size:12px}.deedchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.deedchips .chip{text-align:left;white-space:normal;line-height:1.3;max-width:100%}
.singing{text-align:center}.singing .bardp{display:flex;justify-content:center;margin:4px 0 8px}.singing .sline{opacity:0;transform:translateY(6px);animation:sline .6s ease forwards;margin:10px 0;font-style:italic;font-size:16px;line-height:1.4}.singing .sline small{display:block;font-style:normal;color:var(--mute);font-size:12px;margin-top:2px}@keyframes sline{to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.singing .sline{animation:none;opacity:1;transform:none}}
/* ---- title art (titleart.js) */
.title .press,.title .mi,.title .foot{text-shadow:0 0 10px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.9)}.title .press{color:#f1ead8}.title .tag{text-shadow:0 0 8px rgba(0,0,0,.9)}
.title canvas.tanim{opacity:.85;-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.55) 0%,#000 40%);mask-image:linear-gradient(to bottom,rgba(0,0,0,.55) 0%,#000 40%)}
.title.tout{animation:toutf .3s ease forwards}@keyframes toutf{to{opacity:0}}
.title h1{background-size:100% 100%,220% 100%;background-image:linear-gradient(180deg,#f4efe2 0%,#c9c1ad 55%,#8d8571 100%),linear-gradient(100deg,transparent 40%,rgba(255,244,210,.55) 50%,transparent 60%);background-blend-mode:screen;animation:tfade 1.8s .2s ease both,tshine 7s ease-in-out 2.5s infinite}
@keyframes tshine{0%,60%{background-position:0 0,160% 0}100%{background-position:0 0,-60% 0}}
.cscene{position:relative;margin:10px 0 4px;border-radius:8px;overflow:hidden;border:1px solid #3a3226;line-height:0}.cscene img.cbg{display:block;width:100%;height:auto}
.cscene .cfig{position:absolute;left:50%;bottom:4%;width:29%;transform:translateX(-50%);animation:cfade .35s ease both}.cscene .cfig img{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
@keyframes cfade{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%)}}
.cshow .rshow .rfig{display:none}
.intro{position:fixed;inset:0;z-index:90;background:rgba(5,6,8,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;animation:tfade .4s ease both;cursor:pointer}
.intro.out{animation:toutf .3s ease forwards}
.intro .ipanel{width:min(520px,100%);animation:tfade .6s ease both}.intro img.ipic{display:block;width:100%;height:auto;border-radius:6px;border:1px solid #4a4237;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.intro p{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:21px;line-height:1.35;color:#e9dcc0;text-align:center;margin:16px 6px 0}
.intro .iskip{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);font-size:13px;letter-spacing:.08em;color:#7d7768;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.title h1,.cscene .cfig,.intro,.intro .ipanel{animation:none!important}}
.title .press{background:rgba(12,14,18,.62);border:1px solid rgba(214,178,94,.45);border-radius:999px;padding:14px 30px;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}@keyframes tpulse{0%,100%{opacity:.7}50%{opacity:1}}
/* ---- effects (fxart.js): the travel strip */
.tripvig{margin-top:8px;line-height:0}.tripvig canvas{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.35)}

:root{--sk-bg:rgba(0,0,0,.74);--sk-bg2:rgba(0,0,0,.55);--sk-ink:#ece8de;--sk-mute:#9d978a;--sk-line:rgba(236,232,222,.16);--sk-line2:rgba(236,232,222,.32);--sk-sel:linear-gradient(90deg,rgba(255,255,255,.17),rgba(255,255,255,.05) 70%,rgba(255,255,255,0));--sk-ui:"Barlow Condensed","Barlow Semi Condensed",system-ui,sans-serif;

%3E%3Crect%20transform%3D%22translate%280%2026%29%20scale%281%20-1%29%20rotate%2845%2012%2012%29%22%20x%3D%2210.5%22%20y%3D%2210.5%22%20width%3D%223%22%20height%3D%223%22%20fill%3D%22%23d9d4c7%22/%3E%3C/svg%3E");--sk-c4:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2226%22%20height%3D%2226%22%20viewBox%3D%220%200%2026%2026%22%3E%3Cg%20transform%3D%22translate%2826%2026%29%20scale%28-1%20-1%29%22%20fill%3D%22none%22%20stroke%3D%22%23d9d4c7%22%20stroke-width%3D%221.1%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M1.5%2024%20V7%20Q1.5%201.5%207%201.5%20H24%22/%3E%3Cpath%20d%3D%22M5%2018%20V9%20Q5%205%209%205%20H18%22%20stroke-opacity%3D%22.55%22/%3E%3Cpath%20d%3D%22M9%209%20l3%203%22%20stroke-opacity%3D%22.7%22/%3E%3C/g%3E%3Crect%20transform%3D%22translate%2826%2026%29%20scale%28-1%20-1%29%20rotate%2845%2012%2012%29%22%20x%3D%2210.5%22%20y%3D%2210.5%22%20width%3D%223%22%20height%3D%223%22%20fill%3D%22%23d9d4c7%22/%3E%3C/svg%3E");--sk-orn:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22120%22%20height%3D%2210%22%20viewBox%3D%220%200%20120%2010%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20x2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23d9d4c7%22%20stop-opacity%3D%220%22/%3E%3Cstop%20offset%3D%22.5%22%20stop-color%3D%22%23d9d4c7%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23d9d4c7%22%20stop-opacity%3D%220%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20d%3D%22M0%205%20H52%20M68%205%20H120%22%20stroke%3D%22url%28%23g%29%22%20stroke-width%3D%221%22/%3E%3Cpath%20d%3D%22M60%201%20L64%205%20L60%209%20L56%205Z%22%20fill%3D%22none%22%20stroke%3D%22%23d9d4c7%22/%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%225%22%20r%3D%221.2%22%20fill%3D%22%23d9d4c7%22/%3E%3C/svg%3E")}
body{background:radial-gradient(130% 70% at 50% 0%,#1a1d21 0%,#0b0c0e 62%,#060708 100%);color:var(--sk-ink)}
.sub{color:var(--sk-mute)}
/* panels: smoked glass, no box, silver corners */
#side .panel,.dun .card,.sheet{background:linear-gradient(180deg,rgba(0,0,0,.80),rgba(0,0,0,.68)),var(--tex,none);background-size:auto,160px 160px;border:0;border-radius:0;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45)}
#side .panel::before,.dun .card::before,.sheet::before{content:"";position:absolute;inset:0;border:0;border-top:1px solid transparent;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,var(--sk-line2) 18%,var(--sk-line2) 82%,transparent) 1;pointer-events:none;border-radius:0}
#side .panel::after,.dun .card::after,.sheet::after{content:"";position:absolute;inset:4px;pointer-events:none;background:var(--sk-c1) left top/22px 22px no-repeat,var(--sk-c2) right top/22px 22px no-repeat,var(--sk-c3) left bottom/22px 22px no-repeat,var(--sk-c4) right bottom/22px 22px no-repeat;opacity:.75;border:0}
.dun .card,.sheet{position:relative}
.dun .card.foe{box-shadow:inset 0 0 0 1px rgba(214,90,74,.35),0 10px 30px rgba(0,0,0,.45)}
/* headings: condensed small caps between fading rules */
#side .panel>h2,.sheet>h2,.dun .card>h3{font-family:var(--sk-ui);font-weight:600;font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:#f4f0e6;text-shadow:0 1px 2px #000}
#side .panel>h2::before{background:linear-gradient(90deg,transparent,var(--sk-line2))}#side .panel>h2::after{background:linear-gradient(90deg,var(--sk-line2),transparent)}
#side .panel h3,.sheet h3{font-family:var(--sk-ui);font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#d6d1c5;border-bottom:0;padding-bottom:6px;background:linear-gradient(90deg,var(--sk-line2),transparent) left bottom/100% 1px no-repeat}
/* list rows: SkyUI lines, white bar when selected */
.item{background:transparent;border:0;border-radius:0;border-bottom:1px solid rgba(236,232,222,.07);padding:9px 6px}
.list{gap:0}
.item:hover{background:linear-gradient(90deg,rgba(255,255,255,.06),transparent 80%)}
.item.on{background:var(--sk-sel);border-left:0;box-shadow:inset 2px 0 0 #ece8de}
.item .t{font-size:16px}.item .t span{color:var(--sk-mute)}
.item .num.gold,.item .gold{color:#e9d9a8}

.jnav{gap:2px!important}.jnav .chip{background:linear-gradient(180deg,#4a2a22,#2c1712);color:#e9d9b8;letter-spacing:.14em;font-size:12px;border-radius:0 0 3px 3px;border:0;box-shadow:0 2px 4px rgba(0,0,0,.4)}

/* ==== HUD (hud.js) ==== Skyrim: thin, mostly transparent, white text with a dark glow, small gold ornaments */
.hico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}

.top{gap:8px;padding:8px 2px 6px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,rgba(226,187,100,.45) 20%,rgba(226,187,100,.45) 80%,transparent) 1}

/* compass */
.compass{position:absolute;top:8px;left:10px;right:58px;height:30px;pointer-events:none;z-index:3;overflow:hidden;
  background:linear-gradient(90deg,transparent,rgba(6,7,9,.62) 14%,rgba(6,7,9,.62) 86%,transparent)}
.compass::before,.compass::after{content:"";position:absolute;left:6%;right:6%;height:1px;background:linear-gradient(90deg,transparent,rgba(233,226,208,.55) 25%,rgba(233,226,208,.55) 75%,transparent)}
.compass::before{top:0}.compass::after{bottom:0}

.compass .cm.raid{color:#ff8a6a;animation:hudpulse 1.4s ease-in-out infinite}

/* attribute bars */

/* bottom tab bar: Skyrim's tween menu */
.tabs{background:linear-gradient(180deg,rgba(10,11,13,.86),rgba(4,5,6,.97));border-top:0;box-shadow:0 -1px 0 rgba(226,187,100,.0)}
.tabs::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(226,187,100,.65) 18%,rgba(226,187,100,.65) 82%,transparent)}
.tab{color:rgba(214,207,190,.62);font:600 10.5px/1.1 Cinzel,Georgia,serif;letter-spacing:.12em;text-transform:uppercase;padding-top:9px}
.tab svg{stroke-width:1.5;width:21px;height:21px;transition:filter .2s,color .2s}
.tab.on{color:#f6eedb;text-shadow:0 0 10px rgba(226,187,100,.45)}

.tab.on::after{content:"";position:absolute;bottom:4px;left:30%;right:30%;height:1px;background:linear-gradient(90deg,transparent,#e2bb64,transparent)}
/* Skyrim's top-left messages: newest on top, older lines fade beneath */
#hudlog{position:fixed;left:8px;top:calc(env(safe-area-inset-top) + 56px);z-index:25;display:flex;flex-direction:column;align-items:flex-start;gap:3px;max-width:min(82vw,440px);pointer-events:none}
#hudlog .toast{position:static;transform:none;left:auto;bottom:auto;max-width:100%;border:0;border-radius:0;padding:6px 26px 6px 10px;background:linear-gradient(90deg,rgba(6,7,9,.86),rgba(6,7,9,.7) 70%,transparent);box-shadow:none;color:#f3ecdb;font-size:14px;line-height:1.35;text-shadow:0 1px 2px #000;pointer-events:none;border-left:2px solid rgba(226,187,100,.8)}
#hudlog .toast.pop{animation:hudin .28s cubic-bezier(.2,.8,.2,1)}
#hudlog .hlog{padding:3px 24px 3px 10px;font-size:12.5px;color:rgba(233,226,208,.72);background:linear-gradient(90deg,rgba(6,7,9,.6),transparent);text-shadow:0 1px 2px #000;transition:opacity .6s,transform .6s}
#hudlog .hlog.gone{opacity:0;transform:translateX(-12px)}
@keyframes hudin{from{opacity:0;transform:translateX(-18px)}}
/* banners: Skyrim's thin centred lines */
.pban{background:radial-gradient(ellipse at center,rgba(4,5,6,.82) 0,rgba(4,5,6,.6) 55%,transparent 75%);padding:10px 40px}
.pban::before,.pban::after{background:linear-gradient(90deg,transparent,rgba(240,232,212,.8) 30%,rgba(240,232,212,.8) 70%,transparent)}
.pban .ptx small{color:#e9e2d0;letter-spacing:.28em}
/* pixel style: square corners */
html.art-pixel .top .lvlb,html.art-pixel .top .iconbtn,html.art-pixel .mapbtns .iconbtn,html.art-pixel .hstat .hs{border-radius:0}
@media (prefers-reduced-motion:reduce){.compass .cm.raid,.hb.flash .track,#hudlog .toast.pop{animation:none!important}.hb .track i{transition:none}}
/* HUD: top bar fits a small phone; messages and banners clear of the compass */
.top .who span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-line-clamp:unset}
.top .meta{max-width:50%;min-width:0}.top .meta #clock{display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.top .meta .skyt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:12px}
#hudlog{top:calc(env(safe-area-inset-top) + 142px)}
#pbanners{top:calc(env(safe-area-inset-top) + 30vh)}
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"l w s g" "l m m m";column-gap:8px;row-gap:3px;align-items:center}
.top .lvlb{grid-area:l;align-self:start;margin-top:3px}.top .who{grid-area:w}.top .iconbtn.soc{grid-area:s}.top .iconbtn.snd{grid-area:g}
.top .meta{grid-area:m;max-width:none;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.top .meta #clock{justify-content:flex-start;flex:1}
/* popups must stay readable over the map: solid sheet, darker veil */
.modal{background:radial-gradient(80% 60% at 50% 50%,rgba(0,0,0,.7),rgba(0,0,0,.88))}.modal .sheet{background:linear-gradient(180deg,rgba(16,17,19,.97),rgba(6,7,8,.985)),var(--tex,none);background-size:auto,160px 160px}
</style>
