<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skyrim: Roads of the North</title>
<style>/* fonts bundled with the game (work offline) */
@font-face{font-family:"Cinzel";font-style:normal;font-weight:600;font-display:swap;src:url(font-cinzel-600.woff2) format("woff2")}
@font-face{font-family:"Cinzel";font-style:normal;font-weight:700;font-display:swap;src:url(font-cinzel-700.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:400;font-display:swap;src:url(font-barlow-semi-condensed-400.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(font-barlow-semi-condensed-500.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(font-barlow-semi-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(font-barlow-condensed-500.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(font-barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:600;font-display:swap;src:url(font-cormorant-garamond-600.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:700;font-display:swap;src:url(font-cormorant-garamond-700.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:600;font-display:swap;src:url(font-cormorant-garamond-600-italic.woff2) format("woff2")}

</style>
<style>
/* VOICE: a Nord's field kit at night — iron, frost, candle-lit parchment.
   IDEA: the game behaves like a folded campaign map in an iron case: the map is the screen, everything else hangs below it.
   PICTURE: the live parchment map of Skyrim with fog, your frost-blue marker and the dashed road ahead.
   COLOUR and TYPE: forged-iron charcoal, parchment map, frost blue for you and travel, ember red for danger, coin gold. Cinzel titles, Barlow Semi Condensed for the interface (Skyrim's condensed UI voice), Cormorant on the map.
   LAYOUT: phone first — status line, map, vitals, then the active panel; tab bar fixed at the bottom. Wider screens put the panel beside the map. */
:root{color-scheme:dark;--bg:#121417;--panel:#1b1e22;--panel2:#23272c;--line:#33383f;--ink:#ebe5d6;--mute:#a49d8c;--frost:#8fd3ff;--frost2:#2b5f80;--gold:#e2bb64;--ember:#d65a4a;--hp:#c4413a;--mp:#3f7fd6;--sp:#4fa35c;--parch:#d9c69c}
:root[data-theme=light]{color-scheme:dark}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#1d2228 0%,var(--bg) 60%);color:var(--ink);font:16px/1.45 "Barlow Semi Condensed",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:Cinzel,Georgia,serif;font-weight:700;margin:0;line-height:1.1;letter-spacing:.02em}
h2{font-size:20px}h3{font-size:15px;color:var(--parch)}
.app{max-width:1240px;margin:0 auto;padding:0 12px calc(84px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;padding:10px 2px 8px}
.top .who{flex:1;min-width:0}.top .who span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.top .who b{font-family:Cinzel,serif;font-size:18px;display:block;line-height:1.1}
.top .who span,.top .meta{color:var(--mute);font-size:14px}
.top .meta{text-align:right;max-width:46%;font-size:13px;line-height:1.3}.top .meta .gold{white-space:nowrap}
.top .snd,.top .soc{width:40px;height:40px;font-size:18px;flex:none}
.sndrow{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:16px}.sndrow span{width:70px}.sndrow input{flex:1;accent-color:var(--gold);height:32px}
.gold{color:var(--gold);font-weight:600}
.layout{display:grid;gap:12px}
@media(max-width:700px){.layout .mapwrap{aspect-ratio:auto;height:min(56vh,560px);width:100%}}
@media(min-width:900px){.layout{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}.side{position:sticky;top:8px}}
.mapwrap{position:relative;border-radius:10px;overflow:hidden;background:#0c0d10;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px #3a3229;aspect-ratio:10/7;touch-action:none}
.mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapbtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid #4a4237;background:rgba(18,20,23,.82);display:grid;place-items:center;font-size:20px}
.picked{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:10px;background:rgba(18,20,23,.9);border:1px solid #4a4237}
.picked .t{flex:1;line-height:1.2}.picked .t b{font-family:Cinzel,serif}.picked .t span{color:var(--mute);font-size:14px;display:block}
.vitals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.bar{height:8px;border-radius:5px;background:#2a2e34;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
.vital small{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.trip{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;gap:6px}
.trip.enc{border-color:var(--ember);background:#2a1715}
.trip .row{display:flex;align-items:center;gap:10px}.trip .row b{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel+.panel{margin-top:12px}
.sub{color:var(--mute);font-size:14px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #4d5560;background:var(--panel2);font-weight:600}
.btn.pri{background:var(--frost2);border-color:#4a8cb3;color:#eaf7ff}
.btn.danger{background:#5a1f1a;border-color:#8a3a30}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.iconbtn:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible{outline:2px solid var(--frost);outline-offset:2px}
input,select{min-height:44px;font-size:16px;border-radius:10px;border:1px solid #4d5560;background:#14171a;padding:0 10px;width:100%}
.list{display:grid;gap:6px;margin-top:10px}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid transparent}
.item.on{border-color:#4a8cb3}
.item .t{flex:1;line-height:1.25}.item .t span{display:block;color:var(--mute);font-size:14px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid #4d5560;background:transparent;min-height:36px;font-size:14px}
.chip.on{background:var(--frost2);border-color:#4a8cb3}
.evc{display:flex;flex-direction:column;gap:8px;margin-top:10px}.evc .btn{width:100%;min-height:46px}
.dun{position:fixed;inset:0;z-index:8;overflow:auto;background:radial-gradient(90% 50% at 50% 0%,#2a2620 0%,#0d0e10 70%);padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
.dun .in{width:min(560px,100%);margin:0 auto;display:grid;gap:10px}
.dun .hd{display:flex;align-items:center;gap:8px}.dun .hd h2{flex:1;margin:0;font-size:20px}
.dun .card{background:var(--panel);border:1px solid #4a4237;border-radius:12px;padding:14px}
.dun .card.foe{border-color:var(--ember)}.dun .card.res{border-color:#5c6a52}
.dun .card h3{margin:0 0 6px;font-family:Cinzel,serif;font-size:17px}
.dun .card p{margin:6px 0}
.dun svg{width:100%;height:auto;display:block}
.dun .node{cursor:pointer}.dun .node:focus{outline:none}
.dun .node circle{fill:#24282d;stroke:#4d5560;stroke-width:2}
.dun .node.done circle{fill:#3a3427;stroke:#8a7a5c}
.dun .node.here circle{stroke:var(--gold);stroke-width:3}
.dun .node.next circle{stroke:var(--frost);stroke-width:3;animation:pulse 1.6s ease-in-out infinite}
.dun .node.boss circle{stroke:var(--ember)}
@keyframes pulse{50%{stroke-opacity:.35}}
@media (prefers-reduced-motion:reduce){.dun .node.next circle{animation:none}}
.dun .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px;margin-top:8px}
.skill small{display:flex;justify-content:space-between}.skill .bar{height:5px;margin-top:3px}
.log{display:grid;gap:4px;margin-top:8px;font-size:15px}
.log div{padding:6px 0;border-bottom:1px solid #2a2e34}
.log time{color:var(--mute);font-size:13px;margin-right:6px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:rgba(14,16,19,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5;backdrop-filter:blur(6px)}
.tab{border:0;background:none;padding:8px 2px 10px;min-height:56px;color:var(--mute);font-size:12px;display:grid;justify-items:center;gap:2px;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.on{color:var(--frost)}
.tab .dot{position:absolute;top:6px;right:calc(50% - 16px);width:9px;height:9px;border-radius:50%;background:var(--gold)}
.modal{position:fixed;inset:0;background:rgba(5,6,8,.72);display:grid;place-items:end center;z-index:10;padding:12px}
@media(min-width:700px){.modal{place-items:center}}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid #4a4237;border-radius:14px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet.enc{border-color:var(--ember)}
.danger-low{color:#8fd08f}.danger-medium{color:var(--gold)}.danger-high{color:var(--ember)}
.flog{font-size:14px;margin-top:10px;max-height:260px;overflow:auto;border-top:1px solid var(--line)}
.flog div{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:6px;padding:4px 0;border-bottom:1px solid #2a2e34}
.flog .r{color:var(--frost)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#24292f;border:1px solid #4d5560;border-radius:10px;padding:10px 14px;z-index:20;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.races{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.race{text-align:left;padding:10px;border-radius:10px;border:1px solid #4d5560;background:var(--panel2);min-height:44px}
.race.on{border-color:var(--frost);background:#1c2c38}
.race b{font-family:Cinzel,serif;display:block}.race span{font-size:13px;color:var(--mute)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--mute)}.status.live i{background:var(--sp)}
.hide{display:none!important}
.rule{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;background:var(--panel2);border-radius:10px}
.rule .n{color:var(--frost);font-weight:600}
.rule .acts{display:flex;gap:4px}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.slot{padding:8px 10px;border-radius:10px;background:var(--panel2);font-size:14px}.slot span{color:var(--mute);display:block;font-size:12px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* ---- Skyrim look: smoky panels, thin silver rules, centred small-caps headings */
.panel{background:linear-gradient(180deg,rgba(26,28,31,.96),rgba(14,15,17,.96));border:1px solid rgba(228,220,200,.16);border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 24px rgba(0,0,0,.35)}
.panel>h2{display:flex;align-items:center;gap:12px;justify-content:center;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#efe8d6;margin:2px 0 6px}
.panel>h2::before,.panel>h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(228,220,200,.45))}
.panel>h2::after{background:linear-gradient(90deg,rgba(228,220,200,.45),transparent)}
.panel h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#cfc6b0;border-bottom:1px solid rgba(228,220,200,.12);padding-bottom:4px}
.item{background:rgba(255,255,255,.035);border:0;border-left:2px solid transparent;border-radius:2px}
.item.on{border-left-color:var(--gold);background:linear-gradient(90deg,rgba(226,187,100,.12),rgba(255,255,255,.03))}
.btn{border-radius:3px;border-color:rgba(228,220,200,.28);background:rgba(255,255,255,.04);letter-spacing:.03em}
.btn.pri{background:rgba(143,211,255,.12);border-color:rgba(143,211,255,.55);color:#eaf7ff}
.btn.danger{background:rgba(214,90,74,.16);border-color:rgba(214,90,74,.6)}
.chip{border-radius:2px;border-color:rgba(228,220,200,.22)}
.chip.on{background:rgba(255,255,255,.1);border-color:rgba(228,220,200,.7);color:#fff}
.trip{border-radius:4px;background:linear-gradient(180deg,rgba(26,28,31,.96),rgba(14,15,17,.96));border-color:rgba(228,220,200,.16)}
.tabs{background:linear-gradient(180deg,rgba(14,15,17,.92),rgba(6,7,8,.98));border-top:1px solid rgba(228,220,200,.18)}
.tab.on{color:#f4ecd8}.tab.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:#e8e1cf}
.sheet{border-radius:4px;background:linear-gradient(180deg,rgba(26,28,31,.98),rgba(12,13,15,.98));border-color:rgba(228,220,200,.22)}
input,select{border-radius:3px;border-color:rgba(228,220,200,.22);background:rgba(0,0,0,.35)}
/* ---- the Skyrim / SkyUI menu */
.sky{position:fixed;inset:0;z-index:9;background:radial-gradient(120% 70% at 0% 0%,#15171a 0%,#050607 70%);display:flex;justify-content:center}
.sky-in{width:min(720px,100%);display:flex;flex-direction:column;height:100%;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.sky-top{display:flex;align-items:center;gap:8px}
.sky-pages{flex:1;display:flex;justify-content:center;gap:6px}
.sky-page{background:none;border:0;border-bottom:2px solid transparent;color:#8c877a;font-family:Cinzel,serif;font-size:15px;letter-spacing:.2em;text-transform:uppercase;padding:10px 10px;min-height:44px}
.sky-page.on{color:#f4ecd8;border-bottom-color:#e8e1cf}
.sky-cats{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:6px;border-top:1px solid rgba(228,220,200,.14);border-bottom:1px solid rgba(228,220,200,.14);padding:4px 0}
.sky-cats::-webkit-scrollbar{display:none}
.sky-cat{flex:none;display:grid;justify-items:center;gap:2px;min-width:64px;min-height:52px;background:none;border:0;color:#8c877a;font-size:11px;padding:4px 6px;border-radius:2px}
.sky-cat svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.sky-cat.on{color:#f4ecd8;background:rgba(255,255,255,.07)}
.sky-title{font-family:Cinzel,serif;letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:#cfc6b0;margin:8px 4px 2px}
.sky-cols{display:grid;grid-template-columns:minmax(0,1fr) 3.4em 3.2em 3.8em;gap:8px;align-items:center}
.sky-cols2{display:grid;grid-template-columns:minmax(0,1fr) 4em;gap:8px;align-items:center}
.sky-head{padding:4px 10px;color:#8c877a;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.sky-head button,.sky-head span{background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-align:right;padding:6px 0}
.sky-head>:first-child{text-align:left}
.sky-list{flex:1;overflow:auto;display:flex;flex-direction:column;border-top:1px solid rgba(228,220,200,.1)}
.sky-row{background:none;border:0;border-left:2px solid transparent;text-align:right;padding:9px 10px;min-height:44px;color:#ddd5c2;font-size:16px}
.sky-row .nm{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sky-row .nm i{font-style:normal;color:#8c877a}.sky-row .nm .ench{color:#9fd0f0}.sky-row .nm .stolen{color:var(--ember)}
.sky-row .nm small{display:block;color:#8c877a;font-size:12px}
.sky-row .nm .bar{display:block;height:3px;margin-top:4px;max-width:180px}
.sky-row .nm .eqm{flex:none;width:12px;margin-right:4px;color:#f3d98b;font-size:12px;text-shadow:0 0 6px rgba(255,210,120,.6)}
.sky-row.eq{background:linear-gradient(90deg,rgba(243,217,139,.09),transparent 70%)}
.sky-row.sel{background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.02));border-left-color:#e8e1cf;color:#fff}
.sky-empty{padding:16px 10px}
.sky-detail{border-top:1px solid rgba(228,220,200,.18);padding:10px 6px 4px;max-height:44vh;overflow:auto}
.sky-detail h3{font-family:Cinzel,serif;font-size:19px;letter-spacing:.06em;color:#f4ecd8;text-transform:none;border:0;padding:0}
.sky-stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin:6px 0}
.sky-stats div{display:flex;gap:6px;align-items:baseline}.sky-stats span{color:#8c877a;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.sky-detail p{margin:4px 0}
.sky-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sky-acts .btn{flex:1 1 auto}
.sky-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid rgba(228,220,200,.18);margin-top:6px;padding:8px 6px 4px;font-size:13px;color:#8c877a;letter-spacing:.08em;text-transform:uppercase}
.sky-foot b{color:#f4ecd8;letter-spacing:0;margin-left:4px}.sky-foot .gold{text-transform:none;letter-spacing:0}
.sky-vitals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:2px 6px 4px}.sky-vitals .bar{height:5px}

/* ---- title screen ---- */
.title{position:fixed;inset:0;z-index:60;background:radial-gradient(90% 70% at 50% 35%,#20262d 0%,#0b0d10 70%,#050607 100%);display:flex;flex-direction:column;align-items:center;overflow:hidden;color:var(--ink)}
.title canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.title .vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 50%,rgba(0,0,0,.75) 100%)}
.title .inner{position:relative;z-index:1;width:min(520px,100%);flex:1;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 7vh) 20px calc(env(safe-area-inset-bottom) + 18px);overflow-y:auto}
.title .emb{width:92px;height:92px;opacity:.95;filter:drop-shadow(0 0 18px rgba(226,187,100,.25));animation:tfade 1.6s ease both}
.title h1{margin-top:14px;text-align:center;font-size:clamp(30px,9vw,46px);letter-spacing:.14em;line-height:1.05;background:linear-gradient(180deg,#f4efe2 0%,#c9c1ad 55%,#8d8571 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 24px rgba(0,0,0,.6);animation:tfade 1.8s .2s ease both}
.title .tag{margin-top:8px;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:19px;color:var(--mute);letter-spacing:.04em;animation:tfade 2s .5s ease both}
.title .press:focus{outline:none}
.title .press{margin-top:auto;margin-bottom:12vh;font-family:Cinzel,serif;letter-spacing:.3em;font-size:15px;color:#d8d1c0;text-transform:uppercase;background:none;border:0;padding:20px 30px;animation:tpulse 2.6s ease-in-out infinite}
.title .menu{margin-top:auto;margin-bottom:4vh;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;animation:tfade .8s ease both}
.title .mi{position:relative;background:none;border:0;padding:12px 8px;min-height:52px;width:100%;font-family:Cinzel,serif;font-weight:600;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a1;transition:color .2s,text-shadow .2s;display:flex;flex-direction:column;align-items:center}
.title .mi small{font-family:"Barlow Semi Condensed",sans-serif;font-weight:500;font-size:14px;letter-spacing:.04em;text-transform:none;color:var(--mute);margin-top:2px}

body{background:radial-gradient(130% 70% at 50% 0%,#1a1d21 0%,#0b0c0e 62%,#060708 100%);color:var(--sk-ink)}
.sub{color:var(--sk-mute)}
/* panels: smoked glass, no box, silver corners */
#side .panel,.dun .card,.sheet{background:linear-gradient(180deg,rgba(0,0,0,.80),rgba(0,0,0,.68)),var(--tex,none);background-size:auto,160px 160px;border:0;border-radius:0;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45)}

#side .panel::after,.dun .card::after,.sheet::after{content:"";position:absolute;inset:4px;pointer-events:none;background:var(--sk-c1) left top/22px 22px no-repeat,var(--sk-c2) right top/22px 22px no-repeat,var(--sk-c3) left bottom/22px 22px no-repeat,var(--sk-c4) right bottom/22px 22px no-repeat;opacity:.75;border:0}
.dun .card,.sheet{position:relative}
.dun .card.foe{box-shadow:inset 0 0 0 1px rgba(214,90,74,.35),0 10px 30px rgba(0,0,0,.45)}
/* headings: condensed small caps between fading rules */
#side .panel>h2,.sheet>h2,.dun .card>h3{font-family:var(--sk-ui);font-weight:600;font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:#f4f0e6;text-shadow:0 1px 2px #000}

#side .panel h3,.sheet h3{font-family:var(--sk-ui);font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#d6d1c5;border-bottom:0;padding-bottom:6px;background:linear-gradient(90deg,var(--sk-line2),transparent) left bottom/100% 1px no-repeat}
/* list rows: SkyUI lines, white bar when selected */
.item{background:transparent;border:0;border-radius:0;border-bottom:1px solid rgba(236,232,222,.07);padding:9px 6px}
.list{gap:0}
.item:hover{background:linear-gradient(90deg,rgba(255,255,255,.06),transparent 80%)}
.item.on{background:var(--sk-sel);border-left:0;box-shadow:inset 2px 0 0 #ece8de}
.item .t{font-size:16px}.item .t span{color:var(--sk-mute)}
.item .num.gold,.item .gold{color:#e9d9a8}
/* buttons: thin outlined small caps; primary glows white, danger smoulders */
.btn{border-radius:1px;border:1px solid rgba(236,232,222,.26);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01));color:#ece8de;font-family:var(--sk-ui);font-weight:600;letter-spacing:.09em;text-transform:uppercase;font-size:15px}
.btn.sm{font-size:13px;letter-spacing:.07em;min-height:38px}
.btn:hover:not(:disabled){border-color:rgba(236,232,222,.55);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03))}
.btn.pri{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06));border-color:rgba(255,255,255,.62);color:#fff;text-shadow:0 0 8px rgba(255,255,255,.35)}
.btn.pri:hover:not(:disabled){background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.09));border-color:#fff}
.btn.danger{background:linear-gradient(180deg,rgba(176,52,40,.32),rgba(120,28,20,.18));border-color:rgba(214,90,74,.62);color:#f6dcd6}
.btn:disabled{opacity:.38}
input,select,textarea{border-radius:1px;border:0;border-bottom:1px solid var(--sk-line2);background:rgba(255,255,255,.05);color:var(--sk-ink)}
input:focus,select:focus{outline:none;border-bottom-color:#fff;background:rgba(255,255,255,.09)}
/* category chips and segmented tabs: SkyUI header strip, white underline on the active one */
.chip{border:0;border-radius:0;background:none;color:var(--sk-mute);font-family:var(--sk-ui);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:13px;padding:6px 10px;border-bottom:2px solid transparent}
.chip.on{color:#fff;background:linear-gradient(0deg,rgba(255,255,255,.12),transparent);border-bottom-color:#ece8de}
.seg{border:0;border-top:1px solid var(--sk-line);border-bottom:1px solid var(--sk-line);border-radius:0}
.seg button{font-family:var(--sk-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--sk-mute)}
.seg button.on{background:var(--sk-sel);color:#fff;box-shadow:inset 0 -2px 0 #ece8de}
/* town: the place list reads like Skyrim's dialogue options, centred, no boxes */
.chips:has(>[data-act=shop]){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin:8px 0 4px;padding:6px 0;border-top:1px solid var(--sk-line);border-bottom:1px solid var(--sk-line)}
.chips:has(>[data-act=shop]) .chip{text-transform:none;letter-spacing:.02em;font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-weight:500;font-size:16px;color:#bdb7a9;min-height:40px;border:0;text-align:center;padding:6px 4px}
.chips:has(>[data-act=shop]) .chip.on{color:#fff;background:radial-gradient(60% 100% at 50% 50%,rgba(255,255,255,.16),transparent 75%);text-shadow:0 0 10px rgba(255,255,255,.4)}
/* who you're talking to: Skyrim's dialogue header */
.npctalk{background:radial-gradient(80% 120% at 50% 0%,rgba(255,255,255,.06),transparent 70%);border:0;border-radius:0;border-top:1px solid var(--sk-line);border-bottom:1px solid var(--sk-line);padding:10px 6px}
.npct b{font-family:var(--sk-ui);font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:15px;color:#fff}
.npcrole{letter-spacing:.14em!important;color:var(--sk-mute)!important}
.npct q{font-style:normal;color:#ece8de;font-size:16px;quotes:none}
/* barter: your purse vs the trader, SkyUI's bottom line */
.barter-head{font-family:var(--sk-ui);letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--sk-mute);border-top:1px solid var(--sk-line);border-bottom:1px solid var(--sk-line);padding:8px 4px;margin:8px 0 4px}
.barter-head b{font-size:16px;letter-spacing:.02em}
/* modals: Skyrim message box, centred */
.modal{place-items:center;background:radial-gradient(80% 60% at 50% 50%,rgba(0,0,0,.55),rgba(0,0,0,.82))}
.sheet{border-radius:0;padding:20px 18px}
.sheet>h2{font-size:18px;text-align:center}
.sheet>p{text-align:center;font-size:16px}
.sheet:has(img.art.death){box-shadow:inset 0 0 80px rgba(120,20,14,.55),0 0 0 1px rgba(160,40,30,.45),0 20px 60px rgba(0,0,0,.7)}
.sheet:has(img.art.death)>h2{font-family:Cinzel,serif;font-size:26px;letter-spacing:.3em;color:#e9c8c0;text-shadow:0 0 18px rgba(200,40,30,.6)}
/* level up: three Skyrim choices */
.panel:has([data-act=lvl]) .grid2{gap:10px!important}
.btn[data-act=lvl]{min-height:76px;display:flex;flex-direction:column;justify-content:center;gap:6px;font-size:14px;letter-spacing:.18em;border-color:rgba(236,232,222,.3);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.2))}
.btn[data-act=lvl]::after{content:"";display:block;height:5px;width:70%;margin:0 auto;border-radius:3px}
.btn[data-a=health]::after{background:linear-gradient(90deg,#7a1d18,#d24a3e)}.btn[data-a=magicka]::after{background:linear-gradient(90deg,#1d3f7a,#4f8fe0)}.btn[data-a=stamina]::after{background:linear-gradient(90deg,#1f5a2a,#5fbf6a)}
/* tactics: rule cards as SkyUI rows */
.rcard{background:transparent;border:0;border-radius:0;border-bottom:1px solid rgba(236,232,222,.08);border-left:2px solid rgba(236,232,222,.25);padding:10px 8px}
.rcard.dead{border-left-color:#b5473a}.rlist{gap:4px}
/* the skills menu (Pack): finer SkyUI type */
.sky{background:radial-gradient(120% 70% at 0% 0%,#121416 0%,#030304 72%)}
.sky-row{font-family:var(--sk-ui);font-weight:500;font-size:17px;letter-spacing:.02em;border-bottom:1px solid rgba(236,232,222,.05)}
.sky-row.sel{background:var(--sk-sel);border-left-color:#fff}
.sky-head{font-family:var(--sk-ui);font-weight:600;font-size:12px;letter-spacing:.2em}
.sky-cat{font-family:var(--sk-ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.sky-page{font-family:var(--sk-ui);font-weight:600;letter-spacing:.28em}
.sky-detail{background:linear-gradient(0deg,rgba(255,255,255,.04),transparent);border-top:0;background-image:var(--sk-orn);background-repeat:no-repeat;background-position:center top;background-size:100% 10px;padding-top:16px}
.sky-detail h3{font-family:var(--sk-ui);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:20px}
.sky-stats span{font-family:var(--sk-ui);letter-spacing:.16em}
.sky-foot{font-family:var(--sk-ui);letter-spacing:.16em}
/* the Journal: Skyrim's quest book — parchment pages, ink type, ribbon bookmarks */
#side[data-tab=log] .panel{background:radial-gradient(130% 90% at 50% 40%,#efe3c4 0%,#e2d1a8 62%,#c9b386 100%);color:#3a2c1c;box-shadow:0 0 0 1px #6b5640,0 8px 26px rgba(0,0,0,.55),inset 0 0 40px rgba(110,80,40,.35)}
#side[data-tab=log] .panel::before{border-image:linear-gradient(90deg,transparent,rgba(90,62,30,.5) 18%,rgba(90,62,30,.5) 82%,transparent) 1}
#side[data-tab=log] .panel::after{filter:invert(1) sepia(1) saturate(2) hue-rotate(-10deg) brightness(.45);opacity:.6}
#side[data-tab=log] .panel>h2{font-family:Cinzel,serif;color:#3a2a17;text-shadow:none;letter-spacing:.14em}
#side[data-tab=log] .panel>h2::before{background:linear-gradient(90deg,transparent,rgba(90,62,30,.55))}#side[data-tab=log] .panel>h2::after{background:linear-gradient(90deg,rgba(90,62,30,.55),transparent)}
#side[data-tab=log] .panel h3{color:#4a3720;background:linear-gradient(90deg,rgba(90,62,30,.5),transparent) left bottom/100% 1px no-repeat}
#side[data-tab=log] .sub,#side[data-tab=log] .item .t span,#side[data-tab=log] .log time{color:#6b5640}
#side[data-tab=log] .item{border-bottom-color:rgba(90,62,30,.18)}
#side[data-tab=log] .item.on{background:linear-gradient(90deg,rgba(90,62,30,.16),transparent 80%);box-shadow:inset 2px 0 0 #5a3e1e}
#side[data-tab=log] .item .t,#side[data-tab=log] p,#side[data-tab=log] .log div{color:#3a2c1c}
#side[data-tab=log] .log div{border-bottom-color:rgba(90,62,30,.18)}
#side[data-tab=log] .gold,#side[data-tab=log] .num.gold{color:#7a4f10}
#side[data-tab=log] .btn{color:#3a2a17;border-color:rgba(90,62,30,.55);background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.08));text-shadow:none}
#side[data-tab=log] .btn.pri{background:linear-gradient(180deg,#5a3e1e,#3d2911);color:#f4e9cc;border-color:#2e1f0d}
#side[data-tab=log] .btn.danger{background:linear-gradient(180deg,#7a2a1c,#521a10);color:#f6dcd6}
#side[data-tab=log] .chip{color:#6b5640}#side[data-tab=log] .chip.on{color:#2e1f0d;border-bottom-color:#5a3e1e;background:linear-gradient(0deg,rgba(90,62,30,.15),transparent)}
#side[data-tab=log] input,#side[data-tab=log] select{background:rgba(255,255,255,.4);color:#2e1f0d;border-bottom-color:rgba(90,62,30,.6)}
#side[data-tab=log] .chatlog{background:rgba(255,255,255,.25);border-color:rgba(90,62,30,.3);color:#2e1f0d}
#side[data-tab=log] .bar{background:rgba(90,62,30,.2)}
#side[data-tab=log] a{color:#5a3e1e}
#side[data-tab=log] .danger-high{color:#9b2a1c}#side[data-tab=log] .danger-medium{color:#8a5a12}#side[data-tab=log] .danger-low{color:#2f6a2a}
.jnav{gap:2px!important}.jnav .chip{background:linear-gradient(180deg,#4a2a22,#2c1712);color:#e9d9b8;letter-spacing:.14em;font-size:12px;border-radius:0 0 3px 3px;border:0;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.jnav .chip:nth-child(3n+2){background:linear-gradient(180deg,#273a4a,#14202a)}.jnav .chip:nth-child(3n){background:linear-gradient(180deg,#36402a,#1c2314)}
/* the stars of a skill (perk constellation, skyui.js) */
.skc{position:relative;margin:8px 0 6px;border-top:1px solid var(--sk-line);border-bottom:1px solid var(--sk-line);background:radial-gradient(120% 90% at 50% 100%,#14233a 0%,#070b12 70%);overflow:hidden}
.skc svg{display:block;width:100%;height:auto}
.skc .lbl{font-family:var(--sk-ui);fill:#cfd6e4;font-size:11px;letter-spacing:.08em}
.skc .st{cursor:pointer}
.skc .st circle.core{fill:#9aa7bd}.skc .st.on circle.core{fill:#fff}.skc .st.can circle.core{fill:#cfe3ff}
.skc .st .glow{fill:url(#skglow);opacity:0}.skc .st.on .glow{opacity:.9}.skc .st.can .glow{opacity:.5}
.skc line{stroke:#5f6f88;stroke-width:1}.skc line.on{stroke:#e8f0ff;stroke-width:1.4}
.skc .twinkle{animation:sktw 3.2s ease-in-out infinite}
@keyframes sktw{50%{opacity:.25}}
.item.skflash{animation:skflash 1.2s ease-out}
@keyframes skflash{from{background:rgba(255,255,255,.28)}}
/* dungeon screen */
.dun{background:radial-gradient(90% 50% at 50% 0%,#1c1a17 0%,#060607 72%)}
.dun .hd h2{font-family:var(--sk-ui);font-weight:600;letter-spacing:.2em;text-transform:uppercase}
/* skill checks (guild jobs, locks): a thin chance gauge */
.chance{font-family:var(--sk-ui);letter-spacing:.1em}
/* pixel style: squarer, no corner curls */
html.art-pixel #side .panel::after,html.art-pixel .sheet::after,html.art-pixel .dun .card::after{background:none}
@media (prefers-reduced-motion:reduce){.skc .twinkle,.item.skflash{animation:none}}
.skc .st:focus{outline:none}.skc .st:focus-visible circle.core{stroke:#fff;stroke-width:2}
.chips:has(>[data-act=pskill]){flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--sk-line);border-bottom:1px solid var(--sk-line);padding:2px 0;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.chips:has(>[data-act=pskill])::-webkit-scrollbar{display:none}.chips:has(>[data-act=pskill]) .chip{flex:none}
.chips:has(>[data-act=shop]) .chip{min-height:36px}
.slot{background:transparent;border-radius:0;border-top:1px solid var(--sk-line);font-family:var(--sk-ui);letter-spacing:.08em}
/* tips and the guide offer: a Skyrim loading-screen hint — dark, centred rule, gold only on the title */
.tut{border:0;border-radius:0;background:linear-gradient(180deg,rgba(0,0,0,.82),rgba(0,0,0,.7));box-shadow:0 0 0 1px rgba(0,0,0,.5);position:relative;padding:14px 16px;border-top:1px solid transparent;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,rgba(226,187,100,.55) 20%,rgba(226,187,100,.55) 80%,transparent) 1}
.tut .tut-h{font-family:var(--sk-ui);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:14px;color:#efe2bd}
.tut p{color:#ddd6c6}
/* chips that hold sentences (verse ideas, chat phrases) read as text, not tabs */
.deedchips .chip,.chips.quick .chip{text-transform:none;letter-spacing:.01em;font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-weight:500;font-size:15px;color:#ddd6c6;border:1px solid var(--sk-line);border-radius:1px;text-align:left;padding:8px 10px}
.deedchips .chip.on,.chips.quick .chip:active{border-color:#ece8de;background:var(--sk-sel)}
.bardsong{border:0!important;border-radius:0!important;background:radial-gradient(90% 120% at 50% 0%,rgba(255,255,255,.06),rgba(0,0,0,.35))!important;border-top:1px solid var(--sk-line)!important;border-bottom:1px solid var(--sk-line)!important}
/* ==== end SkyUI theme ==== */
/* ==== HUD (hud.js) ==== Skyrim: thin, mostly transparent, white text with a dark glow, small gold ornaments */
.hico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
/* top bar */
.top{gap:8px;padding:8px 2px 6px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,rgba(226,187,100,.45) 20%,rgba(226,187,100,.45) 80%,transparent) 1}
.top .lvlb{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 15px/1 Cinzel,Georgia,serif;color:#f6eedb;background:radial-gradient(circle at 50% 40%,#2a2c30,#0c0d10);box-shadow:inset 0 0 0 1px rgba(226,187,100,.7),0 0 0 2px rgba(0,0,0,.6),0 0 10px rgba(226,187,100,.18);text-shadow:0 1px 2px #000}
.top .who b{font-size:17px;letter-spacing:.06em;text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.6)}
.top .who span{font-size:12.5px;letter-spacing:.02em}
.top .meta{font-size:12.5px;text-shadow:0 1px 2px #000}
.top .meta .gold{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:#f1cd72}
.top .meta .gold::before{content:"";width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3c8 0 18%,#e2bb64 19% 62%,#8a6a2a 63%);box-shadow:0 0 0 1px #3b2c1e;flex:none}
.top .iconbtn.snd,.top .iconbtn.soc{width:38px;height:38px;border-radius:50%;background:rgba(10,11,13,.55);border:1px solid rgba(226,187,100,.38);color:#e9e2d0;box-shadow:inset 0 0 8px rgba(0,0,0,.6)}
.top .iconbtn.soc.on{border-color:#e2bb64;color:#ffe9b0;box-shadow:0 0 10px rgba(226,187,100,.35),inset 0 0 8px rgba(0,0,0,.6)}
/* map buttons */
.mapbtns .iconbtn{width:40px;height:40px;border-radius:50%;background:rgba(8,9,11,.62);border:1px solid rgba(226,187,100,.38);color:#efe8d6;font:600 20px/1 Georgia,serif;text-shadow:0 1px 2px #000;box-shadow:0 2px 8px rgba(0,0,0,.45)}
/* compass */
.compass{position:absolute;top:8px;left:10px;right:58px;height:30px;pointer-events:none;z-index:3;overflow:hidden;
  background:linear-gradient(90deg,transparent,rgba(6,7,9,.62) 14%,rgba(6,7,9,.62) 86%,transparent)}
.compass::before,.compass::after{content:"";position:absolute;left:6%;right:6%;height:1px;background:linear-gradient(90deg,transparent,rgba(233,226,208,.55) 25%,rgba(233,226,208,.55) 75%,transparent)}
.compass::before{top:0}.compass::after{bottom:0}
.compass .ctape,.compass .cmarks{position:absolute;inset:0}
.compass .ctick{position:absolute;bottom:3px;width:1px;height:5px;background:rgba(233,226,208,.45);transform:translateX(-50%)}
.compass .ctick.mid{height:8px;background:rgba(233,226,208,.6)}
.compass .cdir{position:absolute;top:50%;transform:translate(-50%,-50%);font:700 13px/1 Cinzel,Georgia,serif;color:#f1ead8;text-shadow:0 0 4px #000,0 1px 2px #000;letter-spacing:.04em}
.compass .cdir.n{color:#f1cd72}
.compass .cm{position:absolute;top:50%;transform:translate(-50%,-50%);line-height:0;color:#efe8d6}.compass .cm .hico{paint-order:stroke}
.compass .cm .hico{width:15px;height:15px;stroke-width:1.7}
.compass .cm[data-place]{pointer-events:auto;cursor:pointer;padding:6px}
.compass .cm.unk em{font:italic 700 13px/1 Georgia,serif;color:rgba(233,226,208,.55)}
.compass .cm.pp i{display:block;width:6px;height:6px;border-radius:50%;background:#8fd3ff;box-shadow:0 0 0 1px #0b2333}
.compass .cm.quest{color:#f1cd72;z-index:2}.compass .cm.quest .hico{width:16px;height:16px;fill:#f1cd72;stroke:#3b2c1e;stroke-width:1.2}
.compass .cm.raid{color:#ff8a6a;animation:hudpulse 1.4s ease-in-out infinite}
.compass i.cl,.compass i.cr{position:absolute;top:50%;width:5px;height:5px;background:#e2bb64;transform:translateY(-50%) rotate(45deg);opacity:.8}
.compass i.cl{left:11%}.compass i.cr{right:11%}
@keyframes hudpulse{50%{opacity:.45}}
/* attribute bars */
.vitals{display:block;margin-top:10px}
.hbars{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:10px;align-items:center}
.hb{position:relative;display:flex;align-items:center;height:16px;transition:opacity .6s}
.hb.full{opacity:.42}
.hb .cap{flex:none;width:7px;height:7px;transform:rotate(45deg);background:linear-gradient(135deg,#efe8d6,#7b7466);box-shadow:0 0 0 1px #0b0c0e}
.hb .track{flex:1;height:7px;margin:0 3px;position:relative;background:linear-gradient(#0a0b0d,#1b1d21);box-shadow:0 0 0 1px #0b0c0e,0 0 0 2px rgba(200,190,165,.35);clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 50%,calc(100% - 4px) 100%,4px 100%,0 50%);display:flex}
.hb .track i{display:block;height:100%;width:var(--p);transition:width .5s ease}
.hb.hp .track{justify-content:center}.hb.mp .track{justify-content:flex-end}
.hb.hp .track i{background:linear-gradient(#e46a5f,#a52c25 60%,#7d1e19)}
.hb.mp .track i{background:linear-gradient(#77a8ee,#2f63b4 60%,#234c8a)}
.hb.sp .track i{background:linear-gradient(#86c98d,#3d8a47 60%,#2b6533)}
.hb small{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:10px;line-height:1;color:rgba(233,226,208,.7);margin-top:1px;text-shadow:0 1px 1px #000}
.hb.low .track{box-shadow:0 0 0 1px #0b0c0e,0 0 0 2px rgba(214,90,74,.7),0 0 8px rgba(214,90,74,.5)}
.hb.flash .track{animation:hudflash .65s ease-out}
@keyframes hudflash{0%{filter:brightness(2.2)}100%{filter:none}}
.hline{display:flex;justify-content:space-between;align-items:center;margin-top:12px;min-height:20px;font-size:12px;color:var(--mute)}
.hline .carry{display:inline-flex;align-items:center;gap:4px;letter-spacing:.03em}.hline .carry .hico{width:13px;height:13px}
.hline .carry.over{color:#e07b6a}
.hstat{display:inline-flex;gap:6px}
.hstat .hs{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:rgba(8,9,11,.6);box-shadow:inset 0 0 0 1px rgba(226,187,100,.35);color:#e9e2d0}
.hstat .hs .hico{width:13px;height:13px;stroke-width:1.8}
.hstat .hs.vamp,.hstat .hs.law,.hstat .hs.over,.hstat .hs.sick{color:#ff8a6a}.hstat .hs.rest{color:#f1cd72}.hstat .hs.wolf{color:#d9c69c}.hstat .hs.ride{color:#8fd3ff}
/* bottom tab bar: Skyrim's tween menu */
.tabs{background:linear-gradient(180deg,rgba(10,11,13,.86),rgba(4,5,6,.97));border-top:0;box-shadow:0 -1px 0 rgba(226,187,100,.0)}
.tabs::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(226,187,100,.65) 18%,rgba(226,187,100,.65) 82%,transparent)}
.tab{color:rgba(214,207,190,.62);font:600 10.5px/1.1 Cinzel,Georgia,serif;letter-spacing:.12em;text-transform:uppercase;padding-top:9px}
.tab svg{stroke-width:1.5;width:21px;height:21px;transition:filter .2s,color .2s}
.tab.on{color:#f6eedb;text-shadow:0 0 10px rgba(226,187,100,.45)}
.tab.on svg{filter:drop-shadow(0 0 5px rgba(226,187,100,.55));color:#ffe9b0}
.tab.on::before{content:"";position:absolute;top:-4px;left:50%;width:7px;height:7px;background:#e2bb64;transform:translateX(-50%) rotate(45deg);box-shadow:0 0 8px rgba(226,187,100,.8)}
.tab.on::after{content:"";position:absolute;bottom:4px;left:30%;right:30%;height:1px;background:linear-gradient(90deg,transparent,#e2bb64,transparent)}
/* Skyrim's top-left messages: newest on top, older lines fade beneath */
#hudlog{position:fixed;left:8px;top:calc(env(safe-area-inset-top) + 56px);z-index:25;display:flex;flex-direction:column;align-items:flex-start;gap:3px;max-width:min(82vw,440px);pointer-events:none}
#hudlog .toast{position:static;transform:none;left:auto;bottom:auto;max-width:100%;border:0;border-radius:0;padding:6px 26px 6px 10px;background:linear-gradient(90deg,rgba(6,7,9,.86),rgba(6,7,9,.7) 70%,transparent);box-shadow:none;color:#f3ecdb;font-size:14px;line-height:1.35;text-shadow:0 1px 2px #000;pointer-events:none;border-left:2px solid rgba(226,187,100,.8)}
#hudlog .toast.pop{animation:hudin .28s cubic-bezier(.2,.8,.2,1)}
#hudlog .hlog{padding:3px 24px 3px 10px;font-size:12.5px;color:rgba(233,226,208,.72);background:linear-gradient(90deg,rgba(6,7,9,.6),transparent);text-shadow:0 1px 2px #000;transition:opacity .6s,transform .6s}
#hudlog .hlog.gone{opacity:0;transform:translateX(-12px)}
@keyframes hudin{from{opacity:0;transform:translateX(-18px)}}
/* banners: Skyrim's thin centred lines */
.pban{background:radial-gradient(ellipse at center,rgba(4,5,6,.82) 0,rgba(4,5,6,.6) 55%,transparent 75%);padding:10px 40px}
.pban::before,.pban::after{background:linear-gradient(90deg,transparent,rgba(240,232,212,.8) 30%,rgba(240,232,212,.8) 70%,transparent)}
.pban .ptx small{color:#e9e2d0;letter-spacing:.28em}
/* pixel style: square corners */
html.art-pixel .top .lvlb,html.art-pixel .top .iconbtn,html.art-pixel .mapbtns .iconbtn,html.art-pixel .hstat .hs{border-radius:0}
@media (prefers-reduced-motion:reduce){.compass .cm.raid,.hb.flash .track,#hudlog .toast.pop{animation:none!important}.hb .track i{transition:none}}
/* HUD: top bar fits a small phone; messages and banners clear of the compass */
.top .who span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-line-clamp:unset}
.top .meta{max-width:50%;min-width:0}.top .meta #clock{display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.top .meta .skyt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:12px}
#hudlog{top:calc(env(safe-area-inset-top) + 142px)}
#pbanners{top:calc(env(safe-area-inset-top) + 30vh)}
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"l w s g" "l m m m";column-gap:8px;row-gap:3px;align-items:center}
.top .lvlb{grid-area:l;align-self:start;margin-top:3px}.top .who{grid-area:w}.top .iconbtn.soc{grid-area:s}.top .iconbtn.snd{grid-area:g}
.top .meta{grid-area:m;max-width:none;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.top .meta #clock{justify-content:flex-start;flex:1}
/* popups must stay readable over the map: solid sheet, darker veil */
.modal{background:radial-gradient(80% 60% at 50% 50%,rgba(0,0,0,.7),rgba(0,0,0,.88))}.modal .sheet{background:linear-gradient(180deg,rgba(16,17,19,.97),rgba(6,7,8,.985)),var(--tex,none);background-size:auto,160px 160px}
/* ==== immersion (immerse.js) ==== */
.lockpick{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(70% 60% at 50% 45%,rgba(0,0,0,.7),rgba(0,0,0,.92));padding:12px}
.lpcard{width:min(360px,100%);text-align:center;background:linear-gradient(180deg,rgba(16,17,19,.97),rgba(6,7,8,.985));box-shadow:0 0 0 1px rgba(228,220,200,.18),0 20px 60px rgba(0,0,0,.6);padding:14px 14px 12px}
.lpcard h3{font-family:"Barlow Condensed",Cinzel,serif;letter-spacing:.22em;text-transform:uppercase;font-size:17px;margin:0}
.lpsub{margin:2px 0 8px;color:var(--mute,#a9a395);font-size:13px;letter-spacing:.06em}
.lpcard canvas{width:100%;max-width:300px;height:auto;touch-action:none;display:block;margin:0 auto;border-radius:4px}
.lpcard input[type=range]{width:100%;margin:8px 0 2px;accent-color:#d6b25e}
.lphint{font-size:13px;color:var(--mute,#a9a395);margin:4px 0 8px}
.lprow{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:6px}.lprow .btn{flex:1;min-height:46px}
#lppicks{flex:none;min-width:96px;font-size:13px;letter-spacing:.06em;color:#e9dcc0}
#lpturn{user-select:none;-webkit-user-select:none;touch-action:none}#lpturn.snap{animation:lpsnap .3s}
@keyframes lpsnap{0%,100%{transform:none}30%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
.lppref{display:flex;gap:6px;align-items:center;justify-content:center;font-size:12px;color:var(--mute,#a9a395);margin-top:8px;text-transform:none;letter-spacing:0}
.lppref input{width:18px!important;height:18px!important;min-height:0!important;margin:0;padding:0;flex:none;accent-color:#d6b25e}
.lockpick.won .lpcard{animation:lpwon .45s ease-out}@keyframes lpwon{to{transform:scale(1.04);opacity:0}}
.bark{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 196px);z-index:45;display:flex;gap:8px;align-items:center;max-width:min(330px,86vw);padding:6px 10px 6px 6px;background:rgba(14,15,17,.94);border:1px solid rgba(214,178,94,.35);border-left:2px solid rgba(214,178,94,.8);border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.6);pointer-events:none;animation:bkin .35s ease-out}
.bark .bkp img{display:block;border-radius:50%;width:34px;height:34px}.bark .bkt b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#d6b25e}
.bark q{display:block;font-size:14px;line-height:1.3;color:#f1ead8;font-style:italic;text-shadow:0 0 6px #000}.bark.gone{opacity:0;transition:opacity .6s}
@keyframes bkin{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.loadcard{position:fixed;inset:0;z-index:70;background:#050506;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:30px;animation:ldin .25s ease-out;cursor:pointer}
.loadcard.gone{opacity:0;transition:opacity .3s}.ldspin{perspective:600px}.ldspin img{display:block;width:150px;height:150px;animation:ldspin 6s linear infinite;filter:drop-shadow(0 10px 24px rgba(0,0,0,.8)) grayscale(.15)}
.loadcard.still .ldspin img{animation:none}
@keyframes ldspin{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}@keyframes ldin{from{opacity:0}to{opacity:1}}
.ldtxt{max-width:330px;text-align:center}.ldwhy{font-family:"Barlow Condensed",sans-serif;letter-spacing:.24em;text-transform:uppercase;font-size:12px;color:#8f8a80;margin:0 0 8px}
.ldtip{font-size:16px;line-height:1.45;color:#ece6d6;margin:0;border-top:1px solid rgba(228,220,200,.18);padding-top:10px}
.ltstats h3{margin:12px 0 4px;font-size:13px;letter-spacing:.2em;text-transform:uppercase}.strows{display:grid;gap:0}
.strow{display:flex;justify-content:space-between;align-items:baseline;padding:5px 2px;border-bottom:1px solid rgba(60,45,30,.18)}.strow b{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.bark,.loadcard,.lockpick.won .lpcard,#lpturn.snap{animation:none!important}}
.fscene{position:relative}
.fsctl{position:absolute;left:50%;transform:translateX(-50%);bottom:5px;display:flex;gap:6px;line-height:1}
.fsbtn{font:600 12px/1 var(--font-ui,inherit);color:#fbf3dc;background:rgba(28,33,40,.72);border:1px solid #8e6b2b;border-radius:5px;padding:6px 9px;min-height:28px;cursor:pointer;opacity:.85}
.fsbtn:hover,.fsbtn:focus-visible{background:rgba(60,50,36,.9);outline:none;border-color:#d6b25e}
.flog>div{transition:opacity .25s}.flog>div.fpend{opacity:.3}
/* co-op dungeons (coop.js): SkyUI-style lobby and party strip */
.coop{margin-top:10px;padding:10px 12px;border:1px solid rgba(214,178,94,.28);border-radius:6px;background:linear-gradient(180deg,rgba(20,21,24,.82),rgba(8,9,11,.9))}
.coop.on{border-color:rgba(214,178,94,.55);box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),0 0 18px rgba(214,178,94,.08)}
.coop h3{margin:0 0 6px;font-family:var(--title,inherit);letter-spacing:.08em;text-transform:uppercase;font-size:.86rem;color:var(--gold,#d6b25e)}
.coop .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.coop .row .btn.danger{flex:1}
.coop .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.coopbar{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.coopbar .cm{display:inline-flex;flex-direction:column;padding:3px 9px;border:1px solid rgba(255,255,255,.12);border-radius:4px;background:rgba(0,0,0,.35);font-size:.8rem;line-height:1.2}
.coopbar .cm small{opacity:.7;font-size:.7rem}
.coopbar .cm.with{border-color:rgba(214,178,94,.6);color:var(--gold,#d6b25e)}
.coopwait{margin:0 0 8px;color:var(--gold,#d6b25e)}

/* economy.js: price arrows and the market card */
.econ-b{font-size:11px;font-weight:700;padding:1px 5px;border-radius:8px;margin-right:6px;white-space:nowrap;letter-spacing:.02em}
.econ-b.econ-up,.econ-card .econ-up{color:#e08a6a}
.econ-b.econ-down,.econ-card .econ-down{color:#8fc48a}
.econ-b.econ-up{background:rgba(224,138,106,.12);border:1px solid rgba(224,138,106,.35)}
.econ-b.econ-down{background:rgba(143,196,138,.12);border:1px solid rgba(143,196,138,.35)}
.econ-card{margin:6px 0 8px;padding:6px 10px;border:1px solid rgba(214,178,94,.28);border-radius:8px;background:rgba(10,11,13,.45)}
.econ-card summary{cursor:pointer;font-size:13px;list-style:none}
.econ-card summary::-webkit-details-marker{display:none}
.econ-card .sub{margin:6px 0 0}
.econ-routes div{font-size:12.5px;padding:3px 0;border-top:1px solid rgba(255,255,255,.06)}

/* ---- exploration rewards: ring mini-game, discoveries, library */
.xgame{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;background:radial-gradient(80% 60% at 50% 50%,rgba(0,0,0,.72),rgba(0,0,0,.9));padding:16px}
.xgame .xg-in{width:min(420px,100%);background:linear-gradient(180deg,rgba(22,22,24,.98),rgba(8,8,10,.99));border:1px solid rgba(214,178,94,.45);border-radius:6px;padding:16px 14px;box-shadow:0 10px 40px rgba(0,0,0,.6);text-align:center}
.xgame h3{margin:0 0 6px;font-family:var(--serif,serif);letter-spacing:.08em;text-transform:uppercase;color:#e8d6a8}
.xgame .xg-sub{margin:0 0 12px;color:#bfb6a2;font-size:.92em;line-height:1.4}
.xgame .xg-rings{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.xgame .xg-ring{display:flex;flex-direction:column;align-items:center;gap:6px}
.xgame .xg-face{width:84px;height:84px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 40% 35%,#6d6a62,#36342f 60%,#1d1c19);border:3px solid #8b7b55;box-shadow:inset 0 0 14px rgba(0,0,0,.75),0 0 0 2px #1a1710}
.xgame .xg-sym{font-size:34px;line-height:1;filter:grayscale(.5) sepia(.5) drop-shadow(0 1px 1px #000)}
.xgame .xg-face small{margin-top:3px;color:#e8d6a8;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.xgame .xg-arr{width:48px;height:34px;border-radius:4px;border:1px solid rgba(214,178,94,.4);background:rgba(30,28,24,.9);color:#e8d6a8;font-size:16px;cursor:pointer}
.xgame .xg-arr:active{background:rgba(80,68,40,.9)}
.xgame .xg-btns{display:flex;gap:8px}.xgame .xg-btns .btn{flex:1}
.xstats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.xstats span{flex:1 1 40%;padding:6px 8px;border:1px solid rgba(214,178,94,.25);border-radius:4px;background:rgba(0,0,0,.25);font-size:.9em}
.xstats b{color:var(--gold,#e2bb64);float:right}
.xh{margin:12px 0 6px;font-size:.85em;letter-spacing:.1em;text-transform:uppercase;color:#cdbb8e}
.item.dim{opacity:.5}.xbook{font-size:22px;width:28px;text-align:center}
.xread p{font-family:var(--serif,Georgia,serif);font-size:1.05em;line-height:1.6;color:#e9e1cc;background:linear-gradient(180deg,rgba(64,52,34,.35),rgba(30,24,16,.35));border:1px solid rgba(214,178,94,.25);padding:12px;border-radius:4px}
.panel.xcard{border-color:var(--gold,#e2bb64)}
/* ---- fair levelling: progress view and Legendary skills (legendary.js) */
.leg-stars{color:#e8c66a;text-shadow:0 0 6px rgba(232,198,106,.55);font-weight:700;letter-spacing:1px}
.leg-box{margin-top:10px;padding:10px 12px;border:1px solid rgba(214,178,94,.5);border-radius:8px;background:linear-gradient(180deg,rgba(214,178,94,.12),rgba(214,178,94,.03))}
.leg-box p{margin:0 0 8px}
.prog-panel .bar{height:8px}
.prog-row{width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.prog-row .t .bar{display:inline-block;width:90px;height:5px;vertical-align:middle;margin-right:6px}
.leg-ready{margin-top:8px;color:#e8c66a}
.cw-hold{display:flex;align-items:center;gap:7px;margin:6px 0 2px;font-variant:small-caps;letter-spacing:.04em}
.cw-flag{display:inline-block;width:12px;height:16px;flex:0 0 auto;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.cw-imperial{background:linear-gradient(180deg,#b3242a,#6d1215)}.cw-stormcloak{background:linear-gradient(180deg,#3f6fb0,#1d3963)}.cw-neutral{background:linear-gradient(180deg,#c9a24c,#7a5f22)}
.cf-name{display:inline-flex;gap:6px;align-items:center}.cf-name input{width:9.5em;min-height:36px;background:rgba(0,0,0,.35);border:1px solid rgba(214,178,94,.35);color:inherit;border-radius:4px;padding:4px 8px;font:inherit}
/* player halls and guild halls */
.hallnav{margin:8px 0 4px;flex-wrap:wrap}
.hallnav .chip{min-height:36px}
/* ---- patch notes (patchnotes.js) */
.pnotes{text-align:left;width:100%;max-width:560px;margin:0 auto}
.pnotes .pn{background:linear-gradient(180deg,rgba(18,19,22,.92),rgba(8,9,11,.95));border:1px solid rgba(214,178,94,.28);border-radius:6px;margin:8px 0;padding:0 12px}
.pnotes .pn[open]{border-color:rgba(214,178,94,.55);box-shadow:0 0 0 1px rgba(214,178,94,.08) inset}
.pnotes summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:2px;padding:11px 0;min-height:44px;justify-content:center}
.pnotes summary::-webkit-details-marker{display:none}
.pnotes .pnt{font-family:Cinzel,serif;color:#e8cf8e;font-size:15px;letter-spacing:.04em}
.pnotes .pn[open] .pnt{color:#f3dfa6}
.pnotes .pnm{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9a927f}
.pnotes ul{margin:0 0 12px;padding:8px 0 0 18px;border-top:1px solid rgba(214,178,94,.18)}
.pnotes li{margin:6px 0;line-height:1.45;color:#ddd6c4;font-size:14px}
.pnotes li::marker{color:#c9a75e}
.pnotes .pnnext{border-style:dashed;background:rgba(30,26,16,.55)}
.pnotes .pnnext .pnt{color:#cfe0f0}
.pnwhat{text-align:center}.pnwhat h2{margin:4px 0 8px}.pnwhat ul{text-align:left;border-top:1px solid rgba(214,178,94,.3)}
.pnwhat .pnkick{font-family:Cinzel,serif;letter-spacing:.32em;text-transform:uppercase;font-size:11px;color:#c9a75e}
.title .page .pnotes{max-height:none}
.sheet.pnsheet{max-width:600px}
/* ==== clarity (ux) ==== screen headers with ⓘ help, "what to do next", grouped town, folded journal sections, search boxes */
.uxhead{display:flex;align-items:center;gap:10px;margin:10px 2px 0;padding:6px 2px 6px 4px;border-bottom:1px solid var(--sk-line,#3a3a3a)}
.uxh-t{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.uxh-t b{font-family:"Cinzel",serif;letter-spacing:.14em;font-size:14px;color:#ece8de;text-transform:uppercase}
.uxh-t span{font-size:13px;color:#9d978a}
.uxi{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--sk-line,#555);background:rgba(0,0,0,.35);color:#e9d9b8;font-size:18px;line-height:1;display:grid;place-items:center;cursor:pointer}
.uxi[aria-expanded=true]{border-color:var(--gold);color:var(--gold)}
.uxpop{margin:6px 2px 0;padding:10px 12px;border:1px solid #6b5a3a;background:linear-gradient(180deg,rgba(40,33,22,.92),rgba(18,16,12,.92));border-radius:2px}
.uxpop p{margin:0 0 8px;font-size:14px;line-height:1.45;color:#e6e0d2}
.nextcard{border-color:var(--gold)!important}
.nextcard h2{color:var(--gold)}
.nextcard .item.nx{align-items:center}
.nx-i{flex:none;width:26px;text-align:center;font-size:18px;color:var(--gold)}
.nx-q{font-size:11px;letter-spacing:.08em;color:#9d978a;text-transform:uppercase;margin-left:4px}
.towngroups{margin:8px 0 2px;border-top:1px solid var(--sk-line,#3a3a3a);border-bottom:1px solid var(--sk-line,#3a3a3a);padding:2px 0}
.towngroups .tg{display:grid;grid-template-columns:88px 1fr;align-items:start;gap:4px;padding:4px 0}
.towngroups .tg+.tg{border-top:1px dashed rgba(255,255,255,.07)}
.towngroups .tg-h{font-family:"Cinzel",serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);padding-top:11px;line-height:1.2}
.towngroups .chips:has(>[data-act=shop]){margin:0;padding:0;border:0;grid-template-columns:repeat(2,minmax(0,1fr))}
.towngroups .chips:has(>[data-act=shop]) .chip{font-size:15px;text-align:left;padding:6px 6px}
.towngroups .chip,.jnav .chip,.nextcard .btn{scroll-margin:90px 0 110px}
.tg-desc{margin:6px 2px 0;font-size:13px;color:#b8b2a4}.tg-desc b{color:#ece8de;font-weight:600}
.jnav .chip .jbadge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;margin-left:4px;border-radius:9px;background:var(--gold);color:#1a140c;font-size:11px;letter-spacing:0;font-weight:700}
.jnav .chip.folded{opacity:.72}
.panel{position:relative}
.jfold-b{position:absolute;top:10px;right:10px;min-height:32px;padding:0 10px;border:1px solid currentColor;background:transparent;color:inherit;opacity:.75;font-size:12px;letter-spacing:.08em;cursor:pointer}
.panel.jfold>*:not(h2):not(.jfold-b){display:none!important}
.panel.jfold{padding-bottom:6px}
.panel.jfold h2{margin-right:84px}
.uxsearch{width:100%;margin:6px 0 2px}
.sky-top .sky-i{margin-left:auto;width:36px;height:36px}
.sky .uxpop{margin:4px 10px}
.sky-search{margin:4px 0 6px!important;background:rgba(0,0,0,.4);border:1px solid var(--sk-line,#555);color:#ece8de;min-height:40px;padding:0 10px}
.top .iconbtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px 0 3px}
.top .iconbtn>svg,.top .iconbtn>span:not(.dot){width:20px;height:20px;font-size:17px;line-height:1}
.top .iconbtn .ibl{font-size:10px;line-height:1;letter-spacing:.04em;color:#bdb7a9;white-space:nowrap;pointer-events:none}
/* ---- Tab compass menu (tabmenu.js) */
.tw{position:fixed;inset:0;z-index:8;overflow:hidden;color:var(--sk-ink);touch-action:none;user-select:none;-webkit-user-select:none;animation:twin .22s ease-out;display:flex;flex-direction:column;align-items:center}
@keyframes twin{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.tw-bg{position:absolute;inset:-24px;z-index:0}

/* level-up constellation */
.mo-const{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 30vh - 80px);transform:translateX(-50%);z-index:29;pointer-events:none;animation:moconst 2.6s ease forwards;background:radial-gradient(closest-side,rgba(4,6,12,.82),rgba(4,6,12,.55) 60%,rgba(4,6,12,0));border-radius:50%;padding:20px 30px}
.mo-const line{stroke:rgba(245,222,160,.95);stroke-width:1.6;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:moline .5s var(--mo-out) forwards;animation-delay:calc(var(--d) + .12s)}
.mo-const circle{fill:#fff6dc;filter:drop-shadow(0 0 4px #f0d38a);transform:scale(0);animation:mostar .45s var(--mo-back) forwards;animation-delay:var(--d)}
@keyframes moline{to{stroke-dashoffset:0}}@keyframes mostar{to{transform:scale(1)}}
@keyframes moconst{0%{opacity:0}8%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-14px)}}
/* arriving in a town */
.mo-veil{position:fixed;inset:0;z-index:8;pointer-events:none;display:grid;place-items:center;background:radial-gradient(70% 50% at 50% 45%,rgba(4,5,6,.55),rgba(4,5,6,.85));animation:moveil 1.9s ease forwards}
.mo-vname{text-align:center;color:#f3e6c4;text-shadow:0 2px 10px #000;animation:movname 1.9s var(--mo-out) forwards}
.mo-vname small{display:block;font:600 11px/1 var(--sk-ui,sans-serif);letter-spacing:.4em;text-transform:uppercase;color:#b9ab8a;margin-bottom:8px}
.mo-vname b{display:block;font:700 30px/1.1 Cinzel,Georgia,serif;letter-spacing:.14em}
.mo-vname i{display:block;height:1px;margin:10px auto 0;width:180px;background:linear-gradient(90deg,transparent,#e2bb64,transparent);transform:scaleX(0);animation:movline .8s var(--mo-out) .25s forwards}
@keyframes moveil{0%{opacity:0}18%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes movname{0%{opacity:0;transform:translateY(10px);letter-spacing:.3em}25%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
@keyframes movline{to{transform:scaleX(1)}}
/* title: mist and embers */
.mo-amb{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0;--px:0;--py:0}
.mo-amb .mist{position:absolute;left:-30%;width:160%;height:45%;border-radius:50%;background:radial-gradient(closest-side,rgba(200,210,220,.10),rgba(200,210,220,0));will-change:transform}
.mo-amb .m1{bottom:8%;animation:momist1 26s linear infinite alternate}
.mo-amb .m2{bottom:28%;opacity:.7;animation:momist2 34s linear infinite alternate}
@keyframes momist1{from{transform:translate(calc(var(--px) * -14px - 6%),calc(var(--py) * -6px))}to{transform:translate(calc(var(--px) * -14px + 6%),calc(var(--py) * -6px))}}
@keyframes momist2{from{transform:translate(calc(var(--px) * -26px + 5%),calc(var(--py) * -10px))}to{transform:translate(calc(var(--px) * -26px - 7%),calc(var(--py) * -10px))}}
.mo-amb .emb span{position:absolute;bottom:-8px;width:3px;height:3px;border-radius:50%;background:#ffcf7a;box-shadow:0 0 6px #ff9a3c;opacity:0;animation:moember var(--t) linear infinite;animation-delay:var(--d)}
html.art-pixel .mo-amb .emb span{border-radius:0;box-shadow:none;width:4px;height:4px}
@keyframes moember{0%{opacity:0;transform:translate(0,0)}10%{opacity:.9}100%{opacity:0;transform:translate(var(--x),-70vh)}}
html:not(.mo-on) .mo-amb{display:none}
@media (prefers-reduced-motion:reduce){.mo-amb,.mo-const,.mo-veil,.mo-fly{display:none!important}.mo-st,.mo-ghost,.mo-press{animation:none!important}}
/* ==== favourites wheel (favwheel.js): Skyrim's Q menu as a touch wheel ==== */
.favbtn{position:fixed;right:12px;bottom:calc(128px + env(safe-area-inset-bottom));z-index:9;width:42px;height:42px;border-radius:50%;padding:0;cursor:pointer;font-size:20px;line-height:1;color:#e2bb64;background:radial-gradient(circle at 50% 40%,#2a2c30,#0b0c0e);border:1.5px solid rgba(226,187,100,.6);box-shadow:0 4px 12px rgba(0,0,0,.55)}
body.tw-on .favbtn{bottom:auto;top:calc(56px + env(safe-area-inset-top))}
body.tw-char .favbtn{display:none}
.favwheel{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(60% 45% at 50% 50%,rgba(0,0,0,.55),rgba(0,0,0,.86));touch-action:none}
.favwheel .fw-in{position:relative;width:320px;height:320px}
.favwheel .fw-ring{position:absolute;inset:24px;border-radius:50%;border:1px solid rgba(214,178,94,.35);box-shadow:inset 0 0 0 10px rgba(214,178,94,.05),0 0 30px rgba(214,178,94,.08)}
.favwheel .fw-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:118px;height:118px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;background:radial-gradient(circle at 50% 40%,#202226,#08090a);border:1px solid rgba(214,178,94,.5);color:#e8e0cc;font-size:11px;padding:8px}
.favwheel .fw-hub b{font-family:var(--title,inherit);letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:#e2bb64}
.favwheel .fw-hub span{opacity:.8;line-height:1.2}
.favwheel .fw-x{margin-top:4px;background:none;border:1px solid rgba(255,255,255,.2);color:#ddd;border-radius:999px;width:26px;height:26px;cursor:pointer;padding:0}
.favwheel .fw-slot{position:absolute;left:50%;top:50%;width:84px;margin-left:-42px;margin-top:-38px;transform:translate(var(--x),var(--y));display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;border-radius:10px;cursor:pointer;color:#efe6d0;background:linear-gradient(180deg,rgba(24,25,28,.95),rgba(8,9,10,.95));border:1px solid rgba(255,255,255,.14);box-shadow:0 3px 10px rgba(0,0,0,.6);font:inherit}
.favwheel .fw-slot.on{border-color:rgba(226,187,100,.85);box-shadow:0 0 0 1px rgba(226,187,100,.4),0 0 14px rgba(226,187,100,.3)}
.favwheel .fw-slot.off{opacity:.45}
.favwheel .fw-slot.fw-hit{border-color:#fff2c8;box-shadow:0 0 20px rgba(255,226,150,.7)}
.favwheel .fw-ico{display:grid;place-items:center;height:36px}
.favwheel .fw-nm{font-size:11px;line-height:1.15;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.favwheel .fw-sub{font-size:9.5px;color:#e2bb64;opacity:.85}
.favwheel .fw-empty{position:absolute;left:50%;top:calc(50% + 72px);transform:translateX(-50%);width:250px;text-align:center;color:#ddd;font-size:12.5px}
.favwheel.fw-pixel .fw-slot,.favwheel.fw-pixel .fw-hub{border-radius:0;box-shadow:3px 3px 0 #000;image-rendering:pixelated}
.favwheel.fw-pixel .fw-ring{border-radius:0;border-style:dashed}
.fw-star.on{color:#e2bb64;border-color:rgba(226,187,100,.7)}
html.mo-on .favwheel.fw-on{animation:fwbg .18s ease-out}
html.mo-on .favwheel.fw-on .fw-slot{animation:fwslot .26s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i) * 25ms)}
html.mo-on .favwheel.fw-pixel.fw-on .fw-slot{animation-timing-function:steps(4)}
html.mo-on .favwheel.fw-out{animation:fwbg .16s ease-in reverse both}
@keyframes fwbg{from{opacity:0}to{opacity:1}}
@keyframes fwslot{from{transform:translate(0,0) scale(.4);opacity:0}to{transform:translate(var(--x),var(--y)) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.favwheel *,.favwheel{animation:none!important}}
/* ---- Word Walls (shouts2.js): the curved wall of dragon script, one word burning in */
.wwall{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:radial-gradient(70% 55% at 50% 45%,rgba(20,26,34,.78),rgba(0,0,0,.92));animation:wwin .5s ease-out both}
.wwall.out{animation:wwout .35s ease-in both}
.ww-card{position:relative;width:min(92vw,420px);padding:22px 18px 18px;text-align:center;border:1px solid rgba(214,178,94,.4);border-radius:8px;background:linear-gradient(180deg,rgba(28,30,34,.96),rgba(10,11,13,.98));box-shadow:0 0 40px rgba(159,208,240,.12);overflow:hidden}
.ww-wall{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px 10px;padding:10px;font-size:20px;color:rgba(200,210,214,.13);pointer-events:none;letter-spacing:.1em}
.ww-wall span{animation:wwrune 2.4s ease-in-out infinite;animation-delay:calc(var(--i) * 70ms)}
.ww-glyph{position:relative;display:inline-block;margin:4px auto 6px;filter:drop-shadow(0 0 14px rgba(159,208,240,.75));animation:wwglow 2s ease-in-out infinite}
.ww-word{position:relative;font-family:var(--title,serif);font-size:2.4rem;letter-spacing:.35em;color:#e8f4fb;text-shadow:0 0 18px rgba(159,208,240,.9),0 0 4px #9fd0f0;animation:wwburn 1.6s ease-out both}
.ww-sub{position:relative;margin:8px 0 2px;color:#d6b25e}.ww-hint{position:relative;margin:0 0 12px;opacity:.8;font-size:.9rem}
.ww-card .btn{position:relative;width:100%}
@keyframes wwin{from{opacity:0}to{opacity:1}}@keyframes wwout{to{opacity:0}}
@keyframes wwrune{0%,100%{color:rgba(200,210,214,.1)}50%{color:rgba(159,208,240,.32)}}
@keyframes wwglow{0%,100%{filter:drop-shadow(0 0 8px rgba(159,208,240,.5))}50%{filter:drop-shadow(0 0 20px rgba(159,208,240,.95))}}
@keyframes wwburn{0%{opacity:0;letter-spacing:1.2em;filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{letter-spacing:.35em}}
html.art-pixel .ww-word{font-family:inherit;text-shadow:2px 2px 0 #2c4a5c}
@media (prefers-reduced-motion:reduce){.wwall,.ww-wall span,.ww-glyph,.ww-word{animation:none!important}}
/* weather that matters (weatherfx.js): the fight-screen note, the cold meter, the compass forecast */
.wxnote{margin:6px 0 0;padding:6px 9px;border-left:2px solid rgba(150,190,230,.55);background:rgba(20,28,38,.35);border-radius:3px}
.wxnote b{color:#cfe2f4;margin-right:4px}
.wxcold{position:relative;margin:0 0 10px;padding:6px 10px;border:1px solid rgba(150,190,230,.35);border-radius:6px;background:rgba(10,16,24,.7);overflow:hidden;font-size:.85rem;color:#d8e6f2}
.wxcold span{position:relative;z-index:1}
.wxcold i{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,#8fc3ee,#e8f4ff);transition:width .4s}
.wxcold.t2{border-color:rgba(190,220,255,.7);box-shadow:0 0 12px rgba(160,200,240,.18)}
.tw-fc{display:block;margin-top:2px;font-family:var(--sk-ui,inherit);color:#a9b8c6;font-size:12px;letter-spacing:.04em}
/* werewolf and Vampire Lord perk skies (beastart.js) */
.bstars{margin-top:12px}
.skc.bsky.wolf{background:radial-gradient(120% 90% at 50% 100%,#1a2230 0%,#07090e 70%)}
.skc.bsky.lord{background:radial-gradient(120% 90% at 50% 100%,#2a1018 0%,#0a0608 70%)}
.skc.bsky.lord .st.on circle.core{fill:#ffd0d8}.skc.bsky.lord line.on{stroke:#f0a0b0}
.bperk h3{margin:6px 0 2px}
.tw-card.bcard b{color:#e8c8a0}

/* [journal] quest-only Journal, Skyrim quest book look */
.journal .jseg{margin:6px 0 10px}
.jbadge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--gold);color:#16130d;font-size:11px;line-height:18px;font-weight:700}
.qcat{margin:14px 0 6px;font-family:Cinzel,serif;letter-spacing:.06em;color:var(--gold);font-size:13px;text-transform:uppercase;border-bottom:1px solid rgba(214,178,94,.25);padding-bottom:3px}
.qcard{border:1px solid rgba(214,178,94,.22);border-radius:8px;padding:10px;margin:0 0 10px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.12))}
.qcard.tracked{border-color:var(--gold);box-shadow:0 0 0 1px rgba(214,178,94,.35) inset,0 0 14px rgba(214,178,94,.12)}
.qcard.qcompleted{opacity:.8}
.qhead{display:flex;gap:10px;align-items:center}
.qhead .t{flex:1;font-family:"Cormorant Garamond",serif;font-weight:700;font-size:18px;line-height:1.15}
.qhead .t .qgiver{display:block;font-family:inherit;font-weight:400;font-size:13px;color:inherit;opacity:.7}
.qstar{color:var(--gold)}
.qico{font-size:24px;width:34px;text-align:center}
.qobj{margin-top:8px}
.qobj b{color:inherit}
.qobj p{margin:4px 0;color:inherit;font-size:14px;line-height:1.35}
.qmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px}.qmeta .qrec{color:inherit}.qmeta .qrec.low{color:var(--hp)}
.qrew{color:inherit;opacity:.8}
.qbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.qbtns .btn.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.qstages{list-style:none;margin:8px 0 0;padding:6px 0 0;border-top:1px dashed rgba(214,178,94,.2);font-size:13px}
.qstages li{padding:2px 0}
.qstages .qdone{color:inherit;opacity:.55;text-decoration:line-through}
.qstages .qcur{color:inherit;font-weight:700}
.socseg{flex-wrap:wrap}.socseg button{flex:1 0 33%;min-width:0}
body.tw-char .charnav{display:none}
html.px .qcard,html.px .jbadge{border-radius:0}
/* colour-coded numbers (spell info, costs): element damage, healing, buffs, debuffs, costs */
.spl-info{margin:8px 0 4px;display:grid;gap:6px}
.spl-row{font-size:13px;line-height:1.45;padding:6px 8px;border:1px solid rgba(214,178,94,.18);border-radius:6px;background:rgba(0,0,0,.22)}
.spl-k{display:block;font-family:var(--title,Cinzel),serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#d6b25e;margin-bottom:2px}
.nv{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.nv-fire{color:#ff9a3c}.nv-frost{color:#8fd3ff}.nv-shock{color:#c49bff}.nv-sun{color:#ffe17a}
.nv-heal,.nv-buff{color:#7fdc8a}.nv-stam{color:#9be07a}.nv-debuff{color:#ff7b6e}.nv-mana{color:#6fa8ff}.nv-dur{color:#c9c2b3;font-weight:500}

/* ingredient gathering (gather.js) */
em.fx-good,em.fx-bad,em.fx-unk{font-style:normal;display:inline}.fx-good{color:#8fd16a;font-weight:600}.fx-bad{color:#e46a5a;font-weight:600}.fx-unk{color:#8a8470}
.gcard .gnode.picked{opacity:.6}.gcard .gbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.gcard .gbtns .btn{flex:1 1 44%}
.gnotes{max-height:60vh;overflow:auto}.gnotes .item{align-items:flex-start}.gnotes .gwhere{font-size:.82em;opacity:.78}.gcount{color:#e2bb64}
.gbeds{width:100%;margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.gbed{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border:1px solid rgba(214,178,94,.35);border-radius:8px;background:rgba(40,60,30,.25)}
.gplant{display:flex;flex-wrap:wrap;gap:4px;width:100%}
/* road encounters (encounters.js): choices stack so long labels stay readable */
.evc.encc{display:grid;grid-template-columns:1fr;gap:6px}
.evc.encc .btn{text-align:left;white-space:normal;line-height:1.25;padding:9px 12px}
.evc.encc .btn.danger{border-color:rgba(196,87,46,.7)}

/* ===================================================================== AAA pass: design tokens, depth, colour coding [OURS]
   Tokens: spacing --s1..--s6, type --fs-*, metals --gold-N and --steel-N, elements --el-X, quality tiers --q-X, schools --sch-X,
   skill groups --cat-X. Painted UI textures dropped in the game folder arrive as --asset-X (see assets.js). */
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --fs-xs:11px;--fs-sm:13px;--fs-md:15px;--fs-lg:18px;--fs-xl:22px;
  --gold-1:#f4dc9a;--gold-2:#e2bb64;--gold-3:#9b7a35;--steel-1:#e9eef3;--steel-2:#9aa6b2;--steel-3:#4a525b;
  --el-fire:#ff8c42;--el-frost:#9fdcff;--el-shock:#d6bcff;--el-poison:#9fe26a;--el-heal:#d6e88a;
  --q-common:#ece8de;--q-fine:#7fdc7f;--q-superior:#6fb6ff;--q-exquisite:#c48cff;--q-legendary:#ffcf5a;--q-unique:#ff9a3c;
  --sch-destruction:#ff8c5a;--sch-restoration:#f2dc84;--sch-alteration:#8fd0c8;--sch-conjuration:#b49aff;--sch-illusion:#f19ad8;--sch-mysticism:#86b7ff;--sch-shout:#e8d7b0;--sch-power:#e2bb64;
  --cat-warrior:#ff7a6a;--cat-mage:#7fb2ff;--cat-thief:#7fd98c;--cat-crafting:#e2bb64;--cat-social:#e9a9d6;--cat-movement:#9fe0d8;
  --buff:#8fe38a;--debuff:#ff7f72;--stolen:#ff6a5a;--ease:cubic-bezier(.2,.8,.2,1)}
/* depth: panels get a soft vignette and a crisp gold hairline; painted panel texture when present */
.panel{box-shadow:inset 0 1px 0 rgba(244,220,154,.10),inset 0 0 0 1px rgba(0,0,0,.55),inset 0 -40px 60px -40px rgba(0,0,0,.55),0 10px 28px rgba(0,0,0,.42)}
:root.has-ui-panel .panel{background:linear-gradient(180deg,rgba(20,22,25,.80),rgba(8,9,11,.88)),var(--asset-panel) center/512px repeat}
:root.has-ui-parchment .qcard,:root.has-ui-parchment .parch{background-image:linear-gradient(rgba(240,226,190,.10),rgba(240,226,190,.10)),var(--asset-parchment)!important;background-size:auto,512px!important}
:root.has-ui-frame .modal .sheet{border:24px solid transparent;border-image:var(--asset-frame) 96 fill / 24px stretch}
h2{letter-spacing:.06em;text-shadow:0 1px 0 #000,0 0 18px rgba(226,187,100,.12)}
.sub{color:#b9b2a1}
/* buttons: one shape, clear press and focus */
.btn,.chip,.iconbtn,.sky-row,.sky-cat,.tab{transition:background-color .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease),transform .12s var(--ease),box-shadow .18s var(--ease)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.985);box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.btn:focus-visible,.chip:focus-visible,.sky-row:focus-visible,.tab:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.btn:disabled{opacity:.45;filter:saturate(.4)}
.btn.pri{box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 16px rgba(255,255,255,.06)}
/* vitals: richer health / magicka / stamina with segments and a glow */
.hb .track i{position:relative;box-shadow:0 0 8px currentColor}
.hb.hp .track i{color:rgba(228,80,64,.55)}.hb.mp .track i{color:rgba(80,140,240,.55)}.hb.sp .track i{color:rgba(90,190,100,.5)}
.hb .track i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.35) 9px 10px),linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%)}
.bar i{box-shadow:0 0 6px rgba(255,255,255,.08)}
/* quest / objective banners: a readable plate, and out of the way when a menu is open */
.pban{background:radial-gradient(ellipse at center,rgba(4,5,6,.94) 0,rgba(4,5,6,.86) 55%,rgba(4,5,6,0) 78%)}
body:has(#sky) #pbanners{opacity:0;transition:opacity .25s}
body:has(#sky) .toast{top:auto!important;bottom:calc(58px + env(safe-area-inset-bottom))!important}
/* floating buttons: glass discs that don't shout over the page */
.favbtn,.twbtn{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);background:rgba(10,11,13,.62)!important;box-shadow:0 0 0 1px rgba(226,187,100,.45),0 6px 16px rgba(0,0,0,.5)!important}
/* loading skeletons and empty states */
.skel{position:relative;overflow:hidden;background:rgba(255,255,255,.05);border-radius:2px;min-height:14px}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:skel 1.3s infinite}
@keyframes skel{to{transform:translateX(100%)}}
.sky-empty,.empty{padding:22px 14px;text-align:center;color:#b9b2a1;border:1px dashed rgba(236,232,222,.18);margin:12px;font-style:italic}
/* painted loading cards */
.loadcard.haspic{background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.15) 40%,rgba(0,0,0,.85)),var(--ldbg) center/cover no-repeat}
:root.has-ui-compass .tw-rose{background:var(--asset-compass) center/72% no-repeat}
:root.has-ui-compass .tw-rose>svg.tw-rosesvg{opacity:0}
:root.has-ui-nightsky .tw-bigw,:root.has-ui-nightsky .skc{background-image:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.55)),var(--asset-nightsky);background-size:cover;background-position:center}

/* ---------------------------------------------------------------- colour coding */
.q-common{color:var(--q-common)}.q-fine{color:var(--q-fine)}.q-superior{color:var(--q-superior)}.q-exquisite{color:var(--q-exquisite)}.q-legendary{color:var(--q-legendary)}.q-unique{color:var(--q-unique)}
.sky-row .nm.q-legendary,.sky-row .nm.q-unique,h3.q-legendary,h3.q-unique{text-shadow:0 0 10px color-mix(in srgb,currentColor 45%,transparent)}
.sky-row .nm[class*=" q-"]::before,.sky-row .nm[class^="q-"]::before{content:"";flex:none;width:3px;align-self:stretch;margin-right:6px;background:currentColor;opacity:.75;border-radius:1px}
.sky-row .nm.q-common::before{opacity:.18}
