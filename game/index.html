<style>
/* VOICE: a Nord's field kit at night — iron, frost, candle-lit parchment.
   IDEA: the game behaves like a folded campaign map in an iron case: the map is the screen, everything else hangs below it.
   PICTURE: the live parchment map of Skyrim with fog, your frost-blue marker and the dashed road ahead.
   COLOUR and TYPE: forged-iron charcoal, parchment map, frost blue for you and travel, ember red for danger, coin gold. Cinzel titles, Barlow Semi Condensed for the interface (Skyrim's condensed UI voice), Cormorant on the map.
   LAYOUT: phone first — status line, map, vitals, then the active panel; tab bar fixed at the bottom. Wider screens put the panel beside the map. */
:root{color-scheme:dark;--bg:#121417;--panel:#1b1e22;--panel2:#23272c;--line:#33383f;--ink:#ebe5d6;--mute:#a49d8c;--frost:#8fd3ff;--frost2:#2b5f80;--gold:#e2bb64;--ember:#d65a4a;--hp:#c4413a;--mp:#3f7fd6;--sp:#4fa35c;--parch:#d9c69c}
:root[data-theme=light]{color-scheme:dark}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#1d2228 0%,var(--bg) 60%);color:var(--ink);font:16px/1.45 "Barlow Semi Condensed",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:Cinzel,Georgia,serif;font-weight:700;margin:0;line-height:1.1;letter-spacing:.02em}
h2{font-size:20px}h3{font-size:15px;color:var(--parch)}
.app{max-width:1240px;margin:0 auto;padding:0 12px calc(84px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;padding:10px 2px 8px}
.top .who{flex:1;min-width:0}.top .who span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.top .who b{font-family:Cinzel,serif;font-size:18px;display:block;line-height:1.1}
.top .who span,.top .meta{color:var(--mute);font-size:14px}
.top .meta{text-align:right;max-width:46%;font-size:13px;line-height:1.3}.top .meta .gold{white-space:nowrap}
.top .snd,.top .soc{width:40px;height:40px;font-size:18px;flex:none}
.sndrow{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:16px}.sndrow span{width:70px}.sndrow input{flex:1;accent-color:var(--gold);height:32px}
.gold{color:var(--gold);font-weight:600}
.layout{display:grid;gap:12px}
@media(max-width:700px){.layout .mapwrap{aspect-ratio:auto;height:min(56vh,560px);width:100%}}
@media(min-width:900px){.layout{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}.side{position:sticky;top:8px}}
.mapwrap{position:relative;border-radius:10px;overflow:hidden;background:#0c0d10;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px #3a3229;aspect-ratio:10/7;touch-action:none}
.mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapbtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid #4a4237;background:rgba(18,20,23,.82);display:grid;place-items:center;font-size:20px}
.picked{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:10px;background:rgba(18,20,23,.9);border:1px solid #4a4237}
.picked .t{flex:1;line-height:1.2}.picked .t b{font-family:Cinzel,serif}.picked .t span{color:var(--mute);font-size:14px;display:block}
.vitals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.bar{height:8px;border-radius:5px;background:#2a2e34;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
.vital small{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.trip{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;gap:6px}
.trip.enc{border-color:var(--ember);background:#2a1715}
.trip .row{display:flex;align-items:center;gap:10px}.trip .row b{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel+.panel{margin-top:12px}
.sub{color:var(--mute);font-size:14px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #4d5560;background:var(--panel2);font-weight:600}
.btn.pri{background:var(--frost2);border-color:#4a8cb3;color:#eaf7ff}
.btn.danger{background:#5a1f1a;border-color:#8a3a30}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.iconbtn:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible{outline:2px solid var(--frost);outline-offset:2px}
input,select{min-height:44px;font-size:16px;border-radius:10px;border:1px solid #4d5560;background:#14171a;padding:0 10px;width:100%}
.list{display:grid;gap:6px;margin-top:10px}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid transparent}
.item.on{border-color:#4a8cb3}
.item .t{flex:1;line-height:1.25}.item .t span{display:block;color:var(--mute);font-size:14px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid #4d5560;background:transparent;min-height:36px;font-size:14px}
.chip.on{background:var(--frost2);border-color:#4a8cb3}
.evc{display:flex;flex-direction:column;gap:8px;margin-top:10px}.evc .btn{width:100%;min-height:46px}
.dun{position:fixed;inset:0;z-index:8;overflow:auto;background:radial-gradient(90% 50% at 50% 0%,#2a2620 0%,#0d0e10 70%);padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
.dun .in{width:min(560px,100%);margin:0 auto;display:grid;gap:10px}
.dun .hd{display:flex;align-items:center;gap:8px}.dun .hd h2{flex:1;margin:0;font-size:20px}
.dun .card{background:var(--panel);border:1px solid #4a4237;border-radius:12px;padding:14px}
.dun .card.foe{border-color:var(--ember)}.dun .card.res{border-color:#5c6a52}
.dun .card h3{margin:0 0 6px;font-family:Cinzel,serif;font-size:17px}
.dun .card p{margin:6px 0}
.dun svg{width:100%;height:auto;display:block}
.dun .node{cursor:pointer}.dun .node:focus{outline:none}
.dun .node circle{fill:#24282d;stroke:#4d5560;stroke-width:2}
.dun .node.done circle{fill:#3a3427;stroke:#8a7a5c}
.dun .node.here circle{stroke:var(--gold);stroke-width:3}
.dun .node.next circle{stroke:var(--frost);stroke-width:3;animation:pulse 1.6s ease-in-out infinite}
.dun .node.boss circle{stroke:var(--ember)}
@keyframes pulse{50%{stroke-opacity:.35}}
@media (prefers-reduced-motion:reduce){.dun .node.next circle{animation:none}}
.dun .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px;margin-top:8px}
.skill small{display:flex;justify-content:space-between}.skill .bar{height:5px;margin-top:3px}
.log{display:grid;gap:4px;margin-top:8px;font-size:15px}
.log div{padding:6px 0;border-bottom:1px solid #2a2e34}
.log time{color:var(--mute);font-size:13px;margin-right:6px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:rgba(14,16,19,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5;backdrop-filter:blur(6px)}
.tab{border:0;background:none;padding:8px 2px 10px;min-height:56px;color:var(--mute);font-size:12px;display:grid;justify-items:center;gap:2px;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.on{color:var(--frost)}
.tab .dot{position:absolute;top:6px;right:calc(50% - 16px);width:9px;height:9px;border-radius:50%;background:var(--gold)}
.modal{position:fixed;inset:0;background:rgba(5,6,8,.72);display:grid;place-items:end center;z-index:10;padding:12px}
@media(min-width:700px){.modal{place-items:center}}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid #4a4237;border-radius:14px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet.enc{border-color:var(--ember)}
.danger-low{color:#8fd08f}.danger-medium{color:var(--gold)}.danger-high{color:var(--ember)}
.flog{font-size:14px;margin-top:10px;max-height:260px;overflow:auto;border-top:1px solid var(--line)}
.flog div{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:6px;padding:4px 0;border-bottom:1px solid #2a2e34}
.flog .r{color:var(--frost)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#24292f;border:1px solid #4d5560;border-radius:10px;padding:10px 14px;z-index:20;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.races{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.race{text-align:left;padding:10px;border-radius:10px;border:1px solid #4d5560;background:var(--panel2);min-height:44px}
.race.on{border-color:var(--frost);background:#1c2c38}
.race b{font-family:Cinzel,serif;display:block}.race span{font-size:13px;color:var(--mute)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--mute)}.status.live i{background:var(--sp)}
.hide{display:none!important}
.rule{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;background:var(--panel2);border-radius:10px}
.rule .n{color:var(--frost);font-weight:600}
.rule .acts{display:flex;gap:4px}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.slot{padding:8px 10px;border-radius:10px;background:var(--panel2);font-size:14px}.slot span{color:var(--mute);display:block;font-size:12px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* ---- Skyrim look: smoky panels, thin silver rules, centred small-caps headings */
.panel{background:linear-gradient(180deg,rgba(26,28,31,.96),rgba(14,15,17,.96));border:1px solid rgba(228,220,200,.16);border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 24px rgba(0,0,0,.35)}
.panel>h2{display:flex;align-items:center;gap:12px;justify-content:center;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#efe8d6;margin:2px 0 6px}
.panel>h2::before,.panel>h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(228,220,200,.45))}
.panel>h2::after{background:linear-gradient(90deg,rgba(228,220,200,.45),transparent)}
.panel h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#cfc6b0;border-bottom:1px solid rgba(228,220,200,.12);padding-bottom:4px}
.item{background:rgba(255,255,255,.035);border:0;border-left:2px solid transparent;border-radius:2px}
.item.on{border-left-color:var(--gold);background:linear-gradient(90deg,rgba(226,187,100,.12),rgba(255,255,255,.03))}
.btn{border-radius:3px;border-color:rgba(228,220,200,.28);background:rgba(255,255,255,.04);letter-spacing:.03em}
.btn.pri{background:rgba(143,211,255,.12);border-color:rgba(143,211,255,.55);color:#eaf7ff}
.btn.danger{background:rgba(214,90,74,.16);border-color:rgba(214,90,74,.6)}
.chip{border-radius:2px;border-color:rgba(228,220,200,.22)}
.chip.on{background:rgba(255,255,255,.1);border-color:rgba(228,220,200,.7);color:#fff}
.trip{border-radius:4px;background:linear-gradient(180deg,rgba(26,28,31,.96),rgba(14,15,17,.96));border-color:rgba(228,220,200,.16)}
.tabs{background:linear-gradient(180deg,rgba(14,15,17,.92),rgba(6,7,8,.98));border-top:1px solid rgba(228,220,200,.18)}
.tab.on{color:#f4ecd8}.tab.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:#e8e1cf}
.sheet{border-radius:4px;background:linear-gradient(180deg,rgba(26,28,31,.98),rgba(12,13,15,.98));border-color:rgba(228,220,200,.22)}
input,select{border-radius:3px;border-color:rgba(228,220,200,.22);background:rgba(0,0,0,.35)}
/* ---- the Skyrim / SkyUI menu */
.sky{position:fixed;inset:0;z-index:9;background:radial-gradient(120% 70% at 0% 0%,#15171a 0%,#050607 70%);display:flex;justify-content:center}
.sky-in{width:min(720px,100%);display:flex;flex-direction:column;height:100%;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.sky-top{display:flex;align-items:center;gap:8px}
.sky-pages{flex:1;display:flex;justify-content:center;gap:6px}
.sky-page{background:none;border:0;border-bottom:2px solid transparent;color:#8c877a;font-family:Cinzel,serif;font-size:15px;letter-spacing:.2em;text-transform:uppercase;padding:10px 10px;min-height:44px}
.sky-page.on{color:#f4ecd8;border-bottom-color:#e8e1cf}
.sky-cats{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:6px;border-top:1px solid rgba(228,220,200,.14);border-bottom:1px solid rgba(228,220,200,.14);padding:4px 0}
.sky-cats::-webkit-scrollbar{display:none}
.sky-cat{flex:none;display:grid;justify-items:center;gap:2px;min-width:64px;min-height:52px;background:none;border:0;color:#8c877a;font-size:11px;padding:4px 6px;border-radius:2px}
.sky-cat svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.sky-cat.on{color:#f4ecd8;background:rgba(255,255,255,.07)}
.sky-title{font-family:Cinzel,serif;letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:#cfc6b0;margin:8px 4px 2px}
.sky-cols{display:grid;grid-template-columns:minmax(0,1fr) 3.4em 3.2em 3.8em;gap:8px;align-items:center}
.sky-cols2{display:grid;grid-template-columns:minmax(0,1fr) 4em;gap:8px;align-items:center}
.sky-head{padding:4px 10px;color:#8c877a;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.sky-head button,.sky-head span{background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-align:right;padding:6px 0}
.sky-head>:first-child{text-align:left}
.sky-list{flex:1;overflow:auto;display:flex;flex-direction:column;border-top:1px solid rgba(228,220,200,.1)}
.sky-row{background:none;border:0;border-left:2px solid transparent;text-align:right;padding:9px 10px;min-height:44px;color:#ddd5c2;font-size:16px}
.sky-row .nm{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sky-row .nm i{font-style:normal;color:#8c877a}.sky-row .nm .ench{color:#9fd0f0}.sky-row .nm .stolen{color:var(--ember)}
.sky-row .nm small{display:block;color:#8c877a;font-size:12px}
.sky-row .nm .bar{display:block;height:3px;margin-top:4px;max-width:180px}
.sky-row .nm .eqm{flex:none;width:12px;margin-right:4px;color:#f3d98b;font-size:12px;text-shadow:0 0 6px rgba(255,210,120,.6)}
.sky-row.eq{background:linear-gradient(90deg,rgba(243,217,139,.09),transparent 70%)}
.sky-row.sel{background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.02));border-left-color:#e8e1cf;color:#fff}
.sky-empty{padding:16px 10px}
.sky-detail{border-top:1px solid rgba(228,220,200,.18);padding:10px 6px 4px;max-height:44vh;overflow:auto}
.sky-detail h3{font-family:Cinzel,serif;font-size:19px;letter-spacing:.06em;color:#f4ecd8;text-transform:none;border:0;padding:0}
.sky-stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin:6px 0}
.sky-stats div{display:flex;gap:6px;align-items:baseline}.sky-stats span{color:#8c877a;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.sky-detail p{margin:4px 0}
.sky-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sky-acts .btn{flex:1 1 auto}

%3E%3Crect%20transform%3D%22translate%280%2026%29%20scale%281%20-1%29%20rotate%2845%2012%2012%29%22%20x%3D%2210.5%22%20y%3D%2210.5%22%20width%3D%223%22%20height%3D%223%22%20fill%3D%22%23d9d4c7%22/%3E%3C/svg%3E");--sk-c4:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2226%22%20height%3D%2226%22%20viewBox%3D%220%200%2026%2026%22%3E%3Cg%20transform%3D%22translate%2826%2026%29%20scale%28-1%20-1%29%22%20fill%3D%22none%22%20stroke%3D%22%23d9d4c7%22%20stroke-width%3D%221.1%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M1.5%2024%20V7%20Q1.5%201.5%207%201.5%20H24%22/%3E%3Cpath%20d%3D%22M5%2018%20V9%20Q5%205%209%205%20H18%22%20stroke-opacity%3D%22.55%22/%3E%3Cpath%20d%3D%22M9%209%20l3%203%22%20stroke-opacity%3D%22.7%22/%3E%3C/g%3E%3Crect%20transform%3D%22translate%2826%2026%29%20scale%28-1%20-1%29%20rotate%2845%2012%2012%29%22%20x%3D%2210.5%22%20y%3D%2210.5%22%20width%3D%223%22%20height%3D%223%22%20fill%3D%22%23d9d4c7%22/%3E%3C/svg%3E");--sk-orn:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22120%22%20height%3D%2210%22%20viewBox%3D%220%200%20120%2010%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20x2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23d9d4c7%22%20stop-opacity%3D%220%22/%3E%3Cstop%20offset%3D%22.5%22%20stop-color%3D%22%23d9d4c7%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23d9d4c7%22%20stop-opacity%3D%220%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20d%3D%22M0%205%20H52%20M68%205%20H120%22%20stroke%3D%22url%28%23g%29%22%20stroke-width%3D%221%22/%3E%3Cpath%20d%3D%22M60%201%20L64%205%20L60%209%20L56%205Z%22%20fill%3D%22none%22%20stroke%3D%22%23d9d4c7%22/%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%225%22%20r%3D%221.2%22%20fill%3D%22%23d9d4c7%22/%3E%3C/svg%3E")}
body{background:radial-gradient(130% 70% at 50% 0%,#1a1d21 0%,#0b0c0e 62%,#060708 100%);color:var(--sk-ink)}
.sub{color:var(--sk-mute)}
/* panels: smoked glass, no box, silver corners */
#side .panel,.dun .card,.sheet{background:linear-gradient(180deg,rgba(0,0,0,.80),rgba(0,0,0,.68)),var(--tex,none);background-size:auto,160px 160px;border:0;border-radius:0;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45)}
#side .panel::before,.dun .card::before,.sheet::before{content:"";position:absolute;inset:0;border:0;border-top:1px solid transparent;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,var(--sk-line2) 18%,var(--sk-line2) 82%,transparent) 1;pointer-events:none;border-radius:0}
#side .panel::after,.dun .card::after,.sheet::after{content:"";position:absolute;inset:4px;pointer-events:none;background:var(--sk-c1) left top/22px 22px no-repeat,var(--sk-c2) right top/22px 22px no-repeat,var(--sk-c3) left bottom/22px 22px no-repeat,var(--sk-c4) right bottom/22px 22px no-repeat;opacity:.75;border:0}
.dun .card,.sheet{position:relative}
.dun .card.foe{box-shadow:inset 0 0 0 1px rgba(214,90,74,.35),0 10px 30px rgba(0,0,0,.45)}
/* headings: condensed small caps between fading rules */
#side .panel>h2,.sheet>h2,.dun .card>h3{font-family:var(--sk-ui);font-weight:600;font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:#f4f0e6;text-shadow:0 1px 2px #000}
#side .panel>h2::before{background:linear-gradient(90deg,transparent,var(--sk-line2))}#side .panel>h2::after{background:linear-gradient(90deg,var(--sk-line2),transparent)}
#side .panel h3,.sheet h3{font-family:var(--sk-ui);font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#d6d1c5;border-bottom:0;padding-bottom:6px;background:linear-gradient(90deg,var(--sk-line2),transparent) left bottom/100% 1px no-repeat}
/* list rows: SkyUI lines, white bar when selected */
.item{background:transparent;border:0;border-radius:0;border-bottom:1px solid rgba(236,232,222,.07);padding:9px 6px}
.list{gap:0}
.item:hover{background:linear-gradient(90deg,rgba(255,255,255,.06),transparent 80%)}
.item.on{background:var(--sk-sel);border-left:0;box-shadow:inset 2px 0 0 #ece8de}
.item .t{font-size:16px}.item .t span{color:var(--sk-mute)}
.item .num.gold,.item .gold{color:#e9d9a8}
/* buttons: thin outlined small caps; primary glows white, danger smoulders */
.btn{border-radius:1px;border:1px solid rgba(236,232,222,.26);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01));color:#ece8de;font-family:var(--sk-ui);font-weight:600;letter-spacing:.09em;text-transform:uppercase;font-size:15px}
.btn.sm{font-size:13px;letter-spacing:.07em;min-height:38px}
.btn:hover:not(:disabled){border-color:rgba(236,232,222,.55);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03))}
.btn.pri{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06));border-color:rgba(255,255,255,.62);color:#fff;text-shadow:0 0 8px rgba(255,255,255,.35)}
.btn.pri:hover:not(:disabled){background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.09));border-color:#fff}
.btn.danger{background:linear-gradient(180deg,rgba(176,52,40,.32),rgba(120,28,20,.18));border-color:rgba(214,90,74,.62);color:#f6dcd6}
.btn:disabled{opacity:.38}
input,select,textarea{border-radius:1px;border:0;border-bottom:1px solid var(--sk-line2);background:rgba(255,255,255,.05);color:var(--sk-ink)}
input:focus,select:focus{outline:none;border-bottom-color:#fff;background:rgba(255,255,255,.09)}
/* category chips and segmented tabs: SkyUI header strip, white underline on the active one */
.chip{border:0;border-radius:0;background:none;color:var(--sk-mute);font-family:var(--sk-ui);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:13px;padding:6px 10px;border-bottom:2px solid transparent}
.chip.on{color:#fff;background:linear-gradient(0deg,rgba(255,255,255,.12),transparent);border-bottom-color:#ece8de}
.seg{border:0;border-top:1px solid var(--sk-line);border-bottom:1px solid var(--sk-line);border-radius:0}
.seg button{font-family:var(--sk-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--sk-mute)}
.seg button.on{background:var(--sk-sel);color:#fff;box-shadow:inset 0 -2px 0 #ece8de}
/* town: the place list reads like Skyrim's dialogue options, centred, no boxes */
.chips:has(>[data-act=shop]){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin:8px 0 4px;padding:6px 0;border-top:1px solid var(--sk-line);border-bottom:1px solid var(--sk-line)}
.chips:has(>[data-act=shop]) .chip{text-transform:none;letter-spacing:.02em;font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-weight:500;font-size:16px;color:#bdb7a9;min-height:40px;border:0;text-align:center;padding:6px 4px}
.chips:has(>[data-act=shop]) .chip.on{color:#fff;background:radial-gradient(60% 100% at 50% 50%,rgba(255,255,255,.16),transparent 75%);text-shadow:0 0 10px rgba(255,255,255,.4)}
/* who you're talking to: Skyrim's dialogue header */
.npctalk{background:radial-gradient(80% 120% at 50% 0%,rgba(255,255,255,.06),transparent 70%);border:0;border-radius:0;border-top:1px solid var(--sk-line);border-bottom:1px solid var(--sk-line);padding:10px 6px}
.npct b{font-family:var(--sk-ui);font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:15px;color:#fff}
.npcrole{letter-spacing:.14em!important;color:var(--sk-mute)!important}
.npct q{font-style:normal;color:#ece8de;font-size:16px;quotes:none}
/* barter: your purse vs the trader, SkyUI's bottom line */
.barter-head{font-family:var(--sk-ui);letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--sk-mute);border-top:1px solid var(--sk-line);border-bottom:1px solid var(--sk-line);padding:8px 4px;margin:8px 0 4px}
.barter-head b{font-size:16px;letter-spacing:.02em}
/* modals: Skyrim message box, centred */
.modal{place-items:center;background:radial-gradient(80% 60% at 50% 50%,rgba(0,0,0,.55),rgba(0,0,0,.82))}
.sheet{border-radius:0;padding:20px 18px}
.sheet>h2{font-size:18px;text-align:center}
.sheet>p{text-align:center;font-size:16px}
.sheet:has(img.art.death){box-shadow:inset 0 0 80px rgba(120,20,14,.55),0 0 0 1px rgba(160,40,30,.45),0 20px 60px rgba(0,0,0,.7)}
.sheet:has(img.art.death)>h2{font-family:Cinzel,serif;font-size:26px;letter-spacing:.3em;color:#e9c8c0;text-shadow:0 0 18px rgba(200,40,30,.6)}
/* level up: three Skyrim choices */
.panel:has([data-act=lvl]) .grid2{gap:10px!important}
.btn[data-act=lvl]{min-height:76px;display:flex;flex-direction:column;justify-content:center;gap:6px;font-size:14px;letter-spacing:.18em;border-color:rgba(236,232,222,.3);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.2))}
.btn[data-act=lvl]::after{content:"";display:block;height:5px;width:70%;margin:0 auto;border-radius:3px}
.btn[data-a=health]::after{background:linear-gradient(90deg,#7a1d18,#d24a3e)}.btn[data-a=magicka]::after{background:linear-gradient(90deg,#1d3f7a,#4f8fe0)}.btn[data-a=stamina]::after{background:linear-gradient(90deg,#1f5a2a,#5fbf6a)}
/* tactics: rule cards as SkyUI rows */
.rcard{background:transparent;border:0;border-radius:0;border-bottom:1px solid rgba(236,232,222,.08);border-left:2px solid rgba(236,232,222,.25);padding:10px 8px}
.rcard.dead{border-left-color:#b5473a}.rlist{gap:4px}
/* the skills menu (Pack): finer SkyUI type */
.sky{background:radial-gradient(120% 70% at 0% 0%,#121416 0%,#030304 72%)}
.sky-row{font-family:var(--sk-ui);font-weight:500;font-size:17px;letter-spacing:.02em;border-bottom:1px solid rgba(236,232,222,.05)}
.sky-row.sel{background:var(--sk-sel);border-left-color:#fff}
.sky-head{font-family:var(--sk-ui);font-weight:600;font-size:12px;letter-spacing:.2em}
.sky-cat{font-family:var(--sk-ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.sky-page{font-family:var(--sk-ui);font-weight:600;letter-spacing:.28em}
.sky-detail{background:linear-gradient(0deg,rgba(255,255,255,.04),transparent);border-top:0;background-image:var(--sk-orn);background-repeat:no-repeat;background-position:center top;background-size:100% 10px;padding-top:16px}
.sky-detail h3{font-family:var(--sk-ui);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:20px}
.sky-stats span{font-family:var(--sk-ui);letter-spacing:.16em}
.sky-foot{font-family:var(--sk-ui);letter-spacing:.16em}
/* the Journal: Skyrim's quest book — parchment pages, ink type, ribbon bookmarks */
#side[data-tab=log] .panel{background:radial-gradient(130% 90% at 50% 40%,#efe3c4 0%,#e2d1a8 62%,#c9b386 100%);color:#3a2c1c;box-shadow:0 0 0 1px #6b5640,0 8px 26px rgba(0,0,0,.55),inset 0 0 40px rgba(110,80,40,.35)}
#side[data-tab=log] .panel::before{border-image:linear-gradient(90deg,transparent,rgba(90,62,30,.5) 18%,rgba(90,62,30,.5) 82%,transparent) 1}
#side[data-tab=log] .panel::after{filter:invert(1) sepia(1) saturate(2) hue-rotate(-10deg) brightness(.45);opacity:.6}
#side[data-tab=log] .panel>h2{font-family:Cinzel,serif;color:#3a2a17;text-shadow:none;letter-spacing:.14em}
#side[data-tab=log] .panel>h2::before{background:linear-gradient(90deg,transparent,rgba(90,62,30,.55))}#side[data-tab=log] .panel>h2::after{background:linear-gradient(90deg,rgba(90,62,30,.55),transparent)}
#side[data-tab=log] .panel h3{color:#4a3720;background:linear-gradient(90deg,rgba(90,62,30,.5),transparent) left bottom/100% 1px no-repeat}
#side[data-tab=log] .sub,#side[data-tab=log] .item .t span,#side[data-tab=log] .log time{color:#6b5640}
#side[data-tab=log] .item{border-bottom-color:rgba(90,62,30,.18)}
#side[data-tab=log] .item.on{background:linear-gradient(90deg,rgba(90,62,30,.16),transparent 80%);box-shadow:inset 2px 0 0 #5a3e1e}
#side[data-tab=log] .item .t,#side[data-tab=log] p,#side[data-tab=log] .log div{color:#3a2c1c}
#side[data-tab=log] .log div{border-bottom-color:rgba(90,62,30,.18)}
#side[data-tab=log] .gold,#side[data-tab=log] .num.gold{color:#7a4f10}
#side[data-tab=log] .btn{color:#3a2a17;border-color:rgba(90,62,30,.55);background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.08));text-shadow:none}
#side[data-tab=log] .btn.pri{background:linear-gradient(180deg,#5a3e1e,#3d2911);color:#f4e9cc;border-color:#2e1f0d}
#side[data-tab=log] .btn.danger{background:linear-gradient(180deg,#7a2a1c,#521a10);color:#f6dcd6}
#side[data-tab=log] .chip{color:#6b5640}#side[data-tab=log] .chip.on{color:#2e1f0d;border-bottom-color:#5a3e1e;background:linear-gradient(0deg,rgba(90,62,30,.15),transparent)}
#side[data-tab=log] input,#side[data-tab=log] select{background:rgba(255,255,255,.4);color:#2e1f0d;border-bottom-color:rgba(90,62,30,.6)}
#side[data-tab=log] .chatlog{background:rgba(255,255,255,.25);border-color:rgba(90,62,30,.3);color:#2e1f0d}
#side[data-tab=log] .bar{background:rgba(90,62,30,.2)}
#side[data-tab=log] a{color:#5a3e1e}
#side[data-tab=log] .danger-high{color:#9b2a1c}#side[data-tab=log] .danger-medium{color:#8a5a12}#side[data-tab=log] .danger-low{color:#2f6a2a}
.jnav{gap:2px!important}.jnav .chip{background:linear-gradient(180deg,#4a2a22,#2c1712);color:#e9d9b8;letter-spacing:.14em;font-size:12px;border-radius:0 0 3px 3px;border:0;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.jnav .chip:nth-child(3n+2){background:linear-gradient(180deg,#273a4a,#14202a)}.jnav .chip:nth-child(3n){background:linear-gradient(180deg,#36402a,#1c2314)}
/* the stars of a skill (perk constellation, skyui.js) */
.skc{position:relative;margin:8px 0 6px;border-top:1px solid var(--sk-line);border-bottom:1px solid var(--sk-line);background:radial-gradient(120% 90% at 50% 100%,#14233a 0%,#070b12 70%);overflow:hidden}
.skc svg{display:block;width:100%;height:auto}
.skc .lbl{font-family:var(--sk-ui);fill:#cfd6e4;font-size:11px;letter-spacing:.08em}
.skc .st{cursor:pointer}
.skc .st circle.core{fill:#9aa7bd}.skc .st.on circle.core{fill:#fff}.skc .st.can circle.core{fill:#cfe3ff}
.skc .st .glow{fill:url(#skglow);opacity:0}.skc .st.on .glow{opacity:.9}.skc .st.can .glow{opacity:.5}
.skc line{stroke:#5f6f88;stroke-width:1}.skc line.on{stroke:#e8f0ff;stroke-width:1.4}
.skc .twinkle{animation:sktw 3.2s ease-in-out infinite}
@keyframes sktw{50%{opacity:.25}}
.item.skflash{animation:skflash 1.2s ease-out}
@keyframes skflash{from{background:rgba(255,255,255,.28)}}
/* dungeon screen */
.dun{background:radial-gradient(90% 50% at 50% 0%,#1c1a17 0%,#060607 72%)}
.dun .hd h2{font-family:var(--sk-ui);font-weight:600;letter-spacing:.2em;text-transform:uppercase}
/* skill checks (guild jobs, locks): a thin chance gauge */
.chance{font-family:var(--sk-ui);letter-spacing:.1em}
@media (prefers-reduced-motion:reduce){.skc .twinkle,.item.skflash{animation:none}}
.skc .st:focus{outline:none}.skc .st:focus-visible circle.core{stroke:#fff;stroke-width:2}
.chips:has(>[data-act=pskill]){flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--sk-line);border-bottom:1px solid var(--sk-line);padding:2px 0;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.chips:has(>[data-act=pskill])::-webkit-scrollbar{display:none}.chips:has(>[data-act=pskill]) .chip{flex:none}
.chips:has(>[data-act=shop]) .chip{min-height:36px}
.slot{background:transparent;border-radius:0;border-top:1px solid var(--sk-line);font-family:var(--sk-ui);letter-spacing:.08em}
/* tips and the guide offer: a Skyrim loading-screen hint — dark, centred rule, gold only on the title */
.tut{border:0;border-radius:0;background:linear-gradient(180deg,rgba(0,0,0,.82),rgba(0,0,0,.7));box-shadow:0 0 0 1px rgba(0,0,0,.5);position:relative;padding:14px 16px;border-top:1px solid transparent;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,rgba(226,187,100,.55) 20%,rgba(226,187,100,.55) 80%,transparent) 1}
.tut .tut-h{font-family:var(--sk-ui);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:14px;color:#efe2bd}
.tut p{color:#ddd6c6}

/* ---- Tab compass menu (tabmenu.js) */

.tw-top,.tw-rose,.tw-hint,.tw-quick,.tw-bar{position:relative;z-index:2}

.tw-rosesvg .rg{fill:none;stroke:rgba(236,226,200,.55);stroke-width:1.4}.tw-rosesvg .rg.thin{stroke-width:.8;stroke:rgba(236,226,200,.35)}.tw-rosesvg .dash{stroke-dasharray:2 6}

.tw-ring{transform-origin:150px 150px;animation:twspin 120s linear infinite}.tw-ring2{transform-origin:150px 150px;animation:twspin 60s linear infinite reverse}

.rs-d1{fill:rgba(170,160,140,.55)}.rs-d2{fill:rgba(90,84,74,.7)}

.tw[data-glow=up] .tw-rosesvg{transform:translateY(calc(var(--pull,0)*-10px))}.tw[data-glow=down] .tw-rosesvg{transform:translateY(calc(var(--pull,0)*10px))}
.tw[data-glow=left] .tw-rosesvg{transform:translateX(calc(var(--pull,0)*-10px))}.tw[data-glow=right] .tw-rosesvg{transform:translateX(calc(var(--pull,0)*10px))}
.tw-dir{position:absolute;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;color:var(--sk-ink);padding:8px 10px;min-width:96px;cursor:pointer;font-family:var(--sk-ui);transition:transform .15s,text-shadow .15s}

.tw-up{top:0}.tw-down{bottom:0}.tw-left{left:-6px}.tw-right{right:-6px}
.tw-left,.tw-right{min-width:84px}

.tw[data-glow=up] .tw-up b,.tw[data-glow=down] .tw-down b,.tw[data-glow=left] .tw-left b,.tw[data-glow=right] .tw-right b{color:#fff3cf;text-shadow:0 0 12px rgba(255,220,140,.9),0 2px 8px #000}

.tw-tt{display:flex;flex-direction:column;min-width:0;flex:1}.tw-tt b{font-family:var(--sk-ui);font-size:15px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.twbtn{position:fixed;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:6;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#2a2c30,#0b0c0e);border:1.5px solid rgba(226,187,100,.7);box-shadow:0 4px 14px rgba(0,0,0,.6),0 0 10px rgba(226,187,100,.2);display:grid;place-items:center;cursor:pointer;padding:0}

/* ---- motion design (motion.js): only transform/opacity move; everything sits behind html.mo-on */
:root{--mo-out:cubic-bezier(.2,.8,.2,1);--mo-back:cubic-bezier(.34,1.56,.64,1);--mo-io:cubic-bezier(.65,0,.35,1)}
.top{position:relative}
#moxp{position:absolute;left:6%;right:6%;bottom:-1px;height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;pointer-events:none}
#moxp b{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#8a6a2a,#e2bb64 70%,#fff0c4);transition:transform .55s var(--mo-out)}
#moxp s{position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,250,230,.85),transparent);transform:translateX(-120%);opacity:0;text-decoration:none}
.mo-on #moxp.mo-shine s{animation:moshine .9s var(--mo-io) .15s}
@keyframes moshine{0%{opacity:1;transform:translateX(-120%)}100%{opacity:0;transform:translateX(420%)}}
html:not(.mo-on) #moxp b{transition:none}
/* tab underline that glides */
.mo-uline{position:absolute;left:0;bottom:0;width:100px;height:2px;transform-origin:0 50%;background:linear-gradient(90deg,transparent,#e2bb64 25%,#fff0c4 50%,#e2bb64 75%,transparent);pointer-events:none;transition:transform .32s var(--mo-out);z-index:1}
html:not(.mo-on) .mo-uline{display:none}
.mo-on .tabs .mo-uline{top:0;bottom:auto}
/* button feedback */
.mo-on .btn,.mo-on .mi,.mo-on .sky-row,.mo-on .sky-cat,.mo-on .sky-page,.mo-on .tab,.mo-on .iconbtn,.mo-on .chip{transition:transform .09s var(--mo-out)}
.mo-on .btn:active,.mo-on .mi:active,.mo-on .sky-row:active,.mo-on .chip:active,.mo-on .iconbtn:active{transform:scale(.96)}
.mo-on .tab:active{transform:translateY(1px) scale(.95)}
.mo-on .mo-press{animation:mopress .42s var(--mo-out)}
@keyframes mopress{0%{box-shadow:0 0 0 0 rgba(226,187,100,.55)}100%{box-shadow:0 0 0 9px rgba(226,187,100,0)}}
/* rows ripple in */
.mo-on .mo-st{animation:most .36s var(--mo-out) both;animation-delay:calc(var(--mo-i,0) * 32ms)}
@keyframes most{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.mo-lite .mo-st{animation-duration:.22s}
/* full-screen menu: enter from the side it was opened from, page slides */
.mo-on .sky.mo-enter{animation:mosky .34s var(--mo-out)}
.mo-on .sky.mo-enter.mo-from-r .sky-in{animation:mofr .38s var(--mo-out)}
.mo-on .sky.mo-enter.mo-from-l .sky-in{animation:mofl .38s var(--mo-out)}
.mo-on .sky.mo-enter.mo-from-t .sky-in{animation:moft .38s var(--mo-out)}
.mo-on .sky.mo-enter.mo-from-b .sky-in{animation:mofb .38s var(--mo-out)}
@keyframes mosky{from{opacity:0}}
@keyframes mofr{from{opacity:0;transform:translateX(40px)}}@keyframes mofl{from{opacity:0;transform:translateX(-40px)}}
@keyframes moft{from{opacity:0;transform:translateY(-40px)}}@keyframes mofb{from{opacity:0;transform:translateY(40px)}}
.mo-on .mo-page-r{animation:mopr .3s var(--mo-out)}.mo-on .mo-page-l{animation:mopl .3s var(--mo-out)}
@keyframes mopr{from{opacity:0;transform:translateX(28px)}}@keyframes mopl{from{opacity:0;transform:translateX(-28px)}}
/* popups: soft blur fade + pop; content swaps crossfade */
.mo-on .modal.mo-pop{animation:momodal .22s var(--mo-out);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.mo-lite .modal.mo-pop{-webkit-backdrop-filter:none;backdrop-filter:none}
.mo-on .modal.mo-pop .sheet{animation:mosheet .34s var(--mo-back)}
.mo-on .modal.mo-swap .sheet{animation:moswap .16s var(--mo-out)}
@keyframes momodal{from{opacity:0}}
@keyframes mosheet{from{opacity:0;transform:translateY(16px) scale(.94)}}
@keyframes moswap{from{opacity:.4}}
/* leaving: the old popup / menu / loading card fades instead of vanishing */
.mo-ghost{animation:moghost .22s var(--mo-out) forwards!important;pointer-events:none!important}
.mo-ghost .sheet,.mo-ghost .sky-in{animation:moghostin .22s var(--mo-out) forwards!important}
@keyframes moghost{to{opacity:0}}@keyframes moghostin{to{transform:translateY(10px) scale(.97)}}
/* toasts bounce in */
.mo-on .toast.pop{animation:motoast .42s var(--mo-back)}
.mo-on #hudlog .toast.pop{animation:mohud .42s var(--mo-back)}
@keyframes motoast{0%{opacity:0;transform:translate(-50%,22px) scale(.92)}100%{opacity:1;transform:translate(-50%,0)}}
@keyframes mohud{0%{opacity:0;transform:translateX(-26px)}100%{opacity:1;transform:none}}
/* numbers */
.mo-on #goldv.mo-up{animation:monum .5s var(--mo-out)}.mo-on #goldv.mo-down{animation:monumd .5s var(--mo-out)}
@keyframes monum{30%{transform:translateY(-2px) scale(1.12);color:#ffe7a6}}@keyframes monumd{30%{transform:translateY(1px) scale(.95);color:#e9a08a}}
#goldv{display:inline-block}
.mo-on #lvlb.mo-lvl{animation:molvl .9s var(--mo-back)}
@keyframes molvl{0%{transform:scale(1)}35%{transform:scale(1.35);box-shadow:0 0 18px rgba(240,205,120,.9)}100%{transform:scale(1)}}
/* things fly to your pack */
.mo-fly{position:fixed;width:28px;height:28px;z-index:30;pointer-events:none;border-radius:50%;will-change:transform,opacity}
i.mo-fly{background:radial-gradient(circle,#fff0c4 0,#e2bb64 45%,rgba(226,187,100,0) 70%)}
img.mo-fly{object-fit:contain;filter:drop-shadow(0 0 6px rgba(240,205,120,.9))}
.mo-on .mo-catch{animation:mocatch .4s var(--mo-back)}
@keyframes mocatch{40%{transform:scale(1.18)}}
/* level-up constellation */
.mo-const{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 30vh - 80px);transform:translateX(-50%);z-index:29;pointer-events:none;animation:moconst 2.6s ease forwards;background:radial-gradient(closest-side,rgba(4,6,12,.82),rgba(4,6,12,.55) 60%,rgba(4,6,12,0));border-radius:50%;padding:20px 30px}
.mo-const line{stroke:rgba(245,222,160,.95);stroke-width:1.6;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:moline .5s var(--mo-out) forwards;animation-delay:calc(var(--d) + .12s)}
.mo-const circle{fill:#fff6dc;filter:drop-shadow(0 0 4px #f0d38a);transform:scale(0);animation:mostar .45s var(--mo-back) forwards;animation-delay:var(--d)}
@keyframes moline{to{stroke-dashoffset:0}}@keyframes mostar{to{transform:scale(1)}}
@keyframes moconst{0%{opacity:0}8%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-14px)}}
/* arriving in a town */
.mo-veil{position:fixed;inset:0;z-index:8;pointer-events:none;display:grid;place-items:center;background:radial-gradient(70% 50% at 50% 45%,rgba(4,5,6,.55),rgba(4,5,6,.85));animation:moveil 1.9s ease forwards}
.mo-vname{text-align:center;color:#f3e6c4;text-shadow:0 2px 10px #000;animation:movname 1.9s var(--mo-out) forwards}
.mo-vname small{display:block;font:600 11px/1 var(--sk-ui,sans-serif);letter-spacing:.4em;text-transform:uppercase;color:#b9ab8a;margin-bottom:8px}
.mo-vname b{display:block;font:700 30px/1.1 Cinzel,Georgia,serif;letter-spacing:.14em}
.mo-vname i{display:block;height:1px;margin:10px auto 0;width:180px;background:linear-gradient(90deg,transparent,#e2bb64,transparent);transform:scaleX(0);animation:movline .8s var(--mo-out) .25s forwards}
@keyframes moveil{0%{opacity:0}18%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes movname{0%{opacity:0;transform:translateY(10px);letter-spacing:.3em}25%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
@keyframes movline{to{transform:scaleX(1)}}
/* title: mist and embers */
.mo-amb{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0;--px:0;--py:0}
.mo-amb .mist{position:absolute;left:-30%;width:160%;height:45%;border-radius:50%;background:radial-gradient(closest-side,rgba(200,210,220,.10),rgba(200,210,220,0));will-change:transform}
.mo-amb .m1{bottom:8%;animation:momist1 26s linear infinite alternate}
.mo-amb .m2{bottom:28%;opacity:.7;animation:momist2 34s linear infinite alternate}
@keyframes momist1{from{transform:translate(calc(var(--px) * -14px - 6%),calc(var(--py) * -6px))}to{transform:translate(calc(var(--px) * -14px + 6%),calc(var(--py) * -6px))}}
@keyframes momist2{from{transform:translate(calc(var(--px) * -26px + 5%),calc(var(--py) * -10px))}to{transform:translate(calc(var(--px) * -26px - 7%),calc(var(--py) * -10px))}}
.mo-amb .emb span{position:absolute;bottom:-8px;width:3px;height:3px;border-radius:50%;background:#ffcf7a;box-shadow:0 0 6px #ff9a3c;opacity:0;animation:moember var(--t) linear infinite;animation-delay:var(--d)}
@keyframes moember{0%{opacity:0;transform:translate(0,0)}10%{opacity:.9}100%{opacity:0;transform:translate(var(--x),-70vh)}}
html:not(.mo-on) .mo-amb{display:none}

.gbeds{width:100%;margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.gbed{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border:1px solid rgba(214,178,94,.35);border-radius:8px;background:rgba(40,60,30,.25)}
.gplant{display:flex;flex-wrap:wrap;gap:4px;width:100%}
/* road encounters (encounters.js): choices stack so long labels stay readable */
.evc.encc{display:grid;grid-template-columns:1fr;gap:6px}
.evc.encc .btn{text-align:left;white-space:normal;line-height:1.25;padding:9px 12px}
.evc.encc .btn.danger{border-color:rgba(196,87,46,.7)}

/* ===================================================================== AAA pass: design tokens, depth, colour coding [OURS]
   Tokens: spacing --s1..--s6, type --fs-*, metals --gold-N and --steel-N, elements --el-X, quality tiers --q-X, schools --sch-X,
   skill groups --cat-X. Painted UI textures dropped in the game folder arrive as --asset-X (see assets.js). */
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --fs-xs:11px;--fs-sm:13px;--fs-md:15px;--fs-lg:18px;--fs-xl:22px;
  --gold-1:#f4dc9a;--gold-2:#e2bb64;--gold-3:#9b7a35;--steel-1:#e9eef3;--steel-2:#9aa6b2;--steel-3:#4a525b;
  --el-fire:#ff8c42;--el-frost:#9fdcff;--el-shock:#d6bcff;--el-poison:#9fe26a;--el-heal:#d6e88a;
  --q-common:#ece8de;--q-fine:#7fdc7f;--q-superior:#6fb6ff;--q-exquisite:#c48cff;--q-legendary:#ffcf5a;--q-unique:#ff9a3c;
  --sch-destruction:#ff8c5a;--sch-restoration:#f2dc84;--sch-alteration:#8fd0c8;--sch-conjuration:#b49aff;--sch-illusion:#f19ad8;--sch-mysticism:#86b7ff;--sch-shout:#e8d7b0;--sch-power:#e2bb64;
  --cat-warrior:#ff7a6a;--cat-mage:#7fb2ff;--cat-thief:#7fd98c;--cat-crafting:#e2bb64;--cat-social:#e9a9d6;--cat-movement:#9fe0d8;
  --buff:#8fe38a;--debuff:#ff7f72;--stolen:#ff6a5a;--ease:cubic-bezier(.2,.8,.2,1)}
/* depth: panels get a soft vignette and a crisp gold hairline; painted panel texture when present */
.panel{box-shadow:inset 0 1px 0 rgba(244,220,154,.10),inset 0 0 0 1px rgba(0,0,0,.55),inset 0 -40px 60px -40px rgba(0,0,0,.55),0 10px 28px rgba(0,0,0,.42)}
:root.has-ui-panel .panel{background:linear-gradient(180deg,rgba(20,22,25,.80),rgba(8,9,11,.88)),var(--asset-panel) center/512px repeat}
:root.has-ui-parchment .qcard,:root.has-ui-parchment .parch{background-image:linear-gradient(rgba(240,226,190,.10),rgba(240,226,190,.10)),var(--asset-parchment)!important;background-size:auto,512px!important}
:root.has-ui-frame .modal .sheet{border:24px solid transparent;border-image:var(--asset-frame) 96 fill / 24px stretch}
h2{letter-spacing:.06em;text-shadow:0 1px 0 #000,0 0 18px rgba(226,187,100,.12)}
.sub{color:#b9b2a1}
/* buttons: one shape, clear press and focus */
.btn,.chip,.iconbtn,.sky-row,.sky-cat,.tab{transition:background-color .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease),transform .12s var(--ease),box-shadow .18s var(--ease)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.985);box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.btn:focus-visible,.chip:focus-visible,.sky-row:focus-visible,.tab:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.btn:disabled{opacity:.45;filter:saturate(.4)}
.btn.pri{box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 16px rgba(255,255,255,.06)}
/* vitals: richer health / magicka / stamina with segments and a glow */
.hb .track i{position:relative;box-shadow:0 0 8px currentColor}
.hb.hp .track i{color:rgba(228,80,64,.55)}.hb.mp .track i{color:rgba(80,140,240,.55)}.hb.sp .track i{color:rgba(90,190,100,.5)}
.hb .track i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.35) 9px 10px),linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%)}
.bar i{box-shadow:0 0 6px rgba(255,255,255,.08)}
/* quest / objective banners: a readable plate, and out of the way when a menu is open */
.pban{background:radial-gradient(ellipse at center,rgba(4,5,6,.94) 0,rgba(4,5,6,.86) 55%,rgba(4,5,6,0) 78%)}
body:has(#sky) #pbanners{opacity:0;transition:opacity .25s}
body:has(#sky) .toast{top:auto!important;bottom:calc(58px + env(safe-area-inset-bottom))!important}
/* floating buttons: glass discs that don't shout over the page */
.favbtn,.twbtn{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);background:rgba(10,11,13,.62)!important;box-shadow:0 0 0 1px rgba(226,187,100,.45),0 6px 16px rgba(0,0,0,.5)!important}
/* loading skeletons and empty states */
.skel{position:relative;overflow:hidden;background:rgba(255,255,255,.05);border-radius:2px;min-height:14px}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:skel 1.3s infinite}
@keyframes skel{to{transform:translateX(100%)}}
.sky-empty,.empty{padding:22px 14px;text-align:center;color:#b9b2a1;border:1px dashed rgba(236,232,222,.18);margin:12px;font-style:italic}
/* painted loading cards */
.loadcard.haspic{background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.15) 40%,rgba(0,0,0,.85)),var(--ldbg) center/cover no-repeat}
:root.has-ui-compass .tw-rose{background:var(--asset-compass) center/72% no-repeat}
:root.has-ui-compass .tw-rose>svg.tw-rosesvg{opacity:0}
:root.has-ui-nightsky .tw-bigw,:root.has-ui-nightsky .skc{background-image:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.55)),var(--asset-nightsky);background-size:cover;background-position:center}

/* ---------------------------------------------------------------- colour coding */
.q-common{color:var(--q-common)}.q-fine{color:var(--q-fine)}.q-superior{color:var(--q-superior)}.q-exquisite{color:var(--q-exquisite)}.q-legendary{color:var(--q-legendary)}.q-unique{color:var(--q-unique)}

.sky-row .nm[class*=" q-"]::before,.sky-row .nm[class^="q-"]::before{content:"";flex:none;width:3px;align-self:stretch;margin-right:6px;background:currentColor;opacity:.75;border-radius:1px}
.sky-row .nm.q-common::before{opacity:.18}
.tierline{margin:2px 0 6px;font:600 var(--fs-xs)/1 var(--sk-ui,"Barlow Condensed",sans-serif);letter-spacing:.18em;text-transform:uppercase}
.is-stolen,.sky-row .nm.is-stolen{color:var(--stolen)!important}.stolen{color:var(--stolen)}
.sch-destruction{--sch:var(--sch-destruction)}.sch-restoration{--sch:var(--sch-restoration)}.sch-alteration{--sch:var(--sch-alteration)}.sch-conjuration{--sch:var(--sch-conjuration)}.sch-illusion{--sch:var(--sch-illusion)}.sch-mysticism{--sch:var(--sch-mysticism)}.sch-shout{--sch:var(--sch-shout)}.sch-power{--sch:var(--sch-power)}
.sk-nm[class*="sch-"] small{color:var(--sch,#9d978a)!important;opacity:.9}
.sky-cols2 .sk-nm[class*="sch-"]+.num,.sky-row .num.mag{color:#8fb8ff}
h3[class*="sch-"]{color:var(--sch,#ece8de)}
.el-fire{--elc:var(--el-fire)}.el-frost{--elc:var(--el-frost)}.el-shock{--elc:var(--el-shock)}.el-poison{--elc:var(--el-poison)}.el-heal{--elc:var(--el-heal)}
.sk-nm[class*="el-"]:not(.el-none)>span{color:color-mix(in srgb,var(--elc) 30%,#ece8de)}
h3.el-fire,h3.el-frost,h3.el-shock,h3.el-poison,h3.el-heal{color:var(--elc);text-shadow:0 0 12px color-mix(in srgb,var(--elc) 40%,transparent)}
.cc-line{border-left:2px solid var(--elc);padding-left:6px}
.flog .cc-line span:last-child{color:color-mix(in srgb,var(--elc) 35%,#e9e2d0)}
.cat-warrior{--cat:var(--cat-warrior)}.cat-mage{--cat:var(--cat-mage)}.cat-thief{--cat:var(--cat-thief)}.cat-crafting{--cat:var(--cat-crafting)}.cat-social{--cat:var(--cat-social)}.cat-movement{--cat:var(--cat-movement)}
.sky-row .nm[class*="cat-"]{color:color-mix(in srgb,var(--cat) 55%,#ece8de)}
.sky-row .nm[class*="cat-"] .bar i{background:var(--cat)!important;box-shadow:0 0 6px var(--cat)}
h3[class*="cat-"]{color:var(--cat)}
.buff,b.buff{color:var(--buff)}.debuff,b.debuff{color:var(--debuff)}
.econ-up{color:var(--debuff)!important}.econ-down{color:var(--buff)!important}
.qcard{border-left:3px solid var(--qt,transparent)!important}
.qt-main{--qt:#e2bb64}.qt-sol{--qt:#9a8c7a}.qt-war{--qt:#c8504a}.qt-guild{--qt:#6fa8d8}.qt-daedric{--qt:#a46ad8}.qt-side{--qt:#7fae7a}.qt-misc{--qt:#8a8478}
.ccsw.qt-main,.ccsw.qt-sol,.ccsw.qt-war,.ccsw.qt-guild,.ccsw.qt-daedric,.ccsw.qt-side{color:var(--qt)}
.cclegend{margin:10px 0 8px;padding:8px 10px;border:1px solid rgba(236,232,222,.14);background:rgba(0,0,0,.25)}
.cclegend b{display:block;font:600 11px/1 Cinzel,Georgia,serif;letter-spacing:.2em;text-transform:uppercase;color:#cfc6b0;margin-bottom:6px}
.cclegend p{display:flex;flex-wrap:wrap;gap:4px 10px;margin:4px 0;font-size:12.5px}
.ccsw{white-space:nowrap}.ccsw[class*="sch-"]{color:var(--sch)}.ccsw[class*="el-"]{color:var(--elc)}.ccsw[class*="cat-"]{color:var(--cat)}
/* spellbook.js: tiers, school/element colour coding, support spells, rituals */
.sb-tiers{display:flex;gap:4px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.sb-tier{flex:0 0 auto;font:600 11px/1 "Barlow Semi Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:5px 8px;border-radius:999px;border:1px solid rgba(214,178,94,.28);background:rgba(10,11,13,.5);color:#cbbf9f}

.sb-tier.tier-apprentice.on{color:#9fe0a0}.sb-tier.tier-adept.on{color:#8cc4ff}.sb-tier.tier-expert.on{color:#c79cff}.sb-tier.tier-master.on{color:#ffd27a}
.sky-row.sch-destruction .nm>span{border-left:3px solid #e2733a;padding-left:6px}
.sky-row.sch-restoration .nm>span{border-left:3px solid #e8d36a;padding-left:6px}
.sky-row.sch-alteration .nm>span{border-left:3px solid #7fb8c9;padding-left:6px}
.sky-row.sch-conjuration .nm>span{border-left:3px solid #a07aff;padding-left:6px}
.sky-row.sch-illusion .nm>span{border-left:3px solid #ff8fd0;padding-left:6px}
.sky-row.sch-mysticism .nm>span{border-left:3px solid #5fd0c0;padding-left:6px}
.sky-row.el-fire small{color:#ff9a5a}.sky-row.el-frost small{color:#9fd6ff}.sky-row.el-shock small{color:#c8b0ff}.sky-row.el-sun small{color:#ffe28a}
.sky-row.sb-sup small{color:#9affc0}
.sb-note{margin:6px 0 8px;padding:6px 8px;border-left:2px solid rgba(214,178,94,.6);background:rgba(214,178,94,.06)}
.sb-rituals{margin:6px 0 10px;padding:8px;border:1px solid rgba(214,178,94,.28);border-radius:8px;background:rgba(10,11,13,.35)}
.sb-rituals h3{margin:0 0 4px}
.sb-rit.sch-destruction .t{border-left:3px solid #e2733a;padding-left:6px}.sb-rit.sch-restoration .t{border-left:3px solid #e8d36a;padding-left:6px}.sb-rit.sch-alteration .t{border-left:3px solid #7fb8c9;padding-left:6px}
.sb-rit.sch-conjuration .t{border-left:3px solid #a07aff;padding-left:6px}.sb-rit.sch-illusion .t{border-left:3px solid #ff8fd0;padding-left:6px}.sb-rit.sch-mysticism .t{border-left:3px solid #5fd0c0;padding-left:6px}
.sb-done{color:#ffd27a;font-weight:600}
.sb-rit{gap:8px}.sb-rit .t{flex:1 1 auto;min-width:0}.sb-way{flex:0 0 46%;font-size:12px;line-height:1.3;color:#9affc0;text-align:right}
/* AI settings, AND/OR rules, share codes, preview (aiset.js, sneak2.js) */
.aiset{margin:6px 0 10px;padding:8px 10px}.aiset>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;font-weight:600;list-style:none}
.aiset>summary::-webkit-details-marker{display:none}.aiset>summary::before{content:"▸";transition:transform .15s}.aiset[open]>summary::before{transform:rotate(90deg)}
.airow{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-top:1px solid rgba(236,232,222,.08)}.airow-l{font-size:14px;letter-spacing:.04em}.airow-l small{display:block;opacity:.7;font-size:12px;letter-spacing:0}
.aiseg{display:flex;flex-wrap:wrap;gap:6px}.aiseg .chip,.airow>.chip{min-height:40px}
.aislide{width:100%;accent-color:var(--gold,#c9a45a);min-height:32px}.airow .num{font-size:13px;opacity:.85}

.aispells{max-height:150px;overflow:auto}.chip.sm{min-height:34px;padding:0 10px;font-size:13px}
.tcrow{display:flex;gap:6px;align-items:center}.tcrow select{flex:1;min-width:0}.tcrow .chip{flex:0 0 auto}.tjoin{align-self:center;margin:2px 0}
.rcard .rdrag{cursor:grab;touch-action:none}.rcard.dragging{opacity:.6;outline:1px dashed var(--gold,#c9a45a)}.rcard.dropat{box-shadow:0 -3px 0 var(--gold,#c9a45a)}
#sharein{width:100%;font-family:GameIcons,monospace;font-size:12px;min-height:64px;background:#11100c;color:inherit;border:1px solid #3a3226;border-radius:6px;padding:6px}
.aiprev{margin-top:8px}.aiprev b{color:var(--gold,#c9a45a)}.sneak2{margin:6px 0 0}
/* party play (partyplay.js): ready check chips, the leader / following card */
.ppcard{border-color:rgba(214,178,94,.45)!important;background:linear-gradient(180deg,rgba(40,34,22,.55),rgba(16,15,12,.6))}

.pprc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}

.ppchip.ok{border-color:rgba(143,224,138,.7);color:#c8f0c0;background:rgba(30,60,30,.45)}
.ppchip.no{border-color:rgba(232,101,58,.7);color:#f4b8a0;background:rgba(70,25,15,.45)}
.ppfollow{font-size:12px;padding:3px 8px;border-color:rgba(214,178,94,.55);color:#f0d890}
/* followers: their own pack, perks and style (followers2.js) */
.fol2 .fol2head{align-items:flex-start}
.fol2 .fol2head .t{flex:1;min-width:0}
.fol2 .fol2xp{height:5px;margin:5px 0 3px}
.fol2 .fol2xp i{background:linear-gradient(90deg,#b98a3a,#e8c46a)}
.fol2 .fol2tabs{margin:8px 0}
.fol2 .fol2gear .slot b{color:#e8dcc0;font-weight:600;margin-top:2px}
.fol2 .fol2skills{margin:6px 0 10px}
.fol2 .fol2skills .slot .bar{height:4px;margin-top:4px}
.fol2 .fol2skills .slot .bar i{background:linear-gradient(90deg,#6f8fb8,#bcd6ff)}
.fol2 .fol2list .item.on{box-shadow:inset 3px 0 0 #8fc0ff}
.fol2 .fol2sky{margin:6px 0}
/* foe perks (foeperks.js) */
.foeperks{margin:2px 0 6px;font-size:.86em;color:#e0c48a}.foeperks b{color:#f0d9a0}.foeperks span{color:#ffb36b}.foeperks small{opacity:.7}
.foeperks.el-fire span{color:#ff8a4c}.foeperks.el-frost span{color:#8fd3ff}.foeperks.el-shock span{color:#c9a7ff}.foeperks.el-heal span{color:#9be38b}
.flog .fpline span:last-child{color:#ffb36b;font-style:italic}
/* party loot vote (lootvote.js) */
.lv-list{display:flex;flex-direction:column;gap:6px;margin:8px 0;max-height:52vh;overflow:auto}
.lv-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid rgba(214,178,94,.25);border-radius:8px;background:rgba(0,0,0,.25)}
.lv-row .nm{flex:1;min-width:0;display:flex;flex-direction:column}.lv-row .nm small{opacity:.7;color:#ffb36b}
.lv-row.won{border-color:#e0c060;box-shadow:0 0 8px rgba(224,192,96,.35)}
.lv-tag{font-size:.8em;color:#e0c48a}.lv-gold{color:#f0d070;margin:4px 0}.lv-timer{text-align:center}
.lv-dice{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.lv-dice em{font-size:.75em;opacity:.7}
.lv-dice .die{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:6px;background:#efe3c4;color:#2a1d10;font-style:normal;font-weight:700;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);animation:lvroll .9s ease-out}
.lv-dice small{font-size:.72em;margin-right:6px;opacity:.85}
.lv-dice .plus{font-size:.75em;color:#9be38b;margin-left:-2px}

.lv-wait h3{margin:0 0 4px}
@media (prefers-reduced-motion:reduce){.lv-dice .die{animation:none}}

/* turn-based fights (tbfight.js): initiative bar, live scene, AP pips, thumb-reachable action grid */
.tbf{position:fixed;inset:0;z-index:70;background:#08090b radial-gradient(90% 70% at 50% 30%,#171a20,#060709);display:flex;justify-content:center;overflow:auto;color:var(--ink,#e8e2d4)}

.tbini i{font-style:normal;opacity:.55;margin-left:4px;font-size:10px}.tbini.me{border-color:rgba(120,180,255,.45)}.tbini.foe{border-color:rgba(230,90,70,.5)}.tbini.ally{border-color:rgba(140,210,140,.45)}
.tbini.now{background:rgba(214,178,94,.25);border-color:var(--gold,#d6b25e);transform:scale(1.08)}.tbini.gone{opacity:.4}
.tbff{flex:none;min-width:36px;min-height:36px;border-radius:8px;border:1px solid rgba(214,178,94,.3);background:transparent;color:inherit}.tbff.on{background:rgba(214,178,94,.3)}
.tbscene{min-height:150px;border-radius:10px;overflow:hidden;background:rgba(0,0,0,.35)}.tbscene .fscene{width:100%}
.tbvit{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tbvit small{display:flex;justify-content:space-between;font-size:12px;opacity:.9}
.tbbar{height:7px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:3px}.tbbar i{display:block;height:100%;transition:width .45s ease}
.tbbar.hp i{background:linear-gradient(90deg,#9b2a22,#d4483a)}.tbbar.mp i{background:linear-gradient(90deg,#24508f,#4d8de0)}.tbbar.sp i{background:linear-gradient(90deg,#2f6b2b,#5fae4f)}
.tbbar.foe i{background:linear-gradient(90deg,#7a1f17,#e0613f)}
.tballies{display:flex;gap:8px;flex-wrap:wrap}.tbal{flex:1 1 30%;min-width:90px}.tbal small{font-size:11px;opacity:.8}
.tbst{display:flex;gap:4px;margin-top:4px}.tbst .st{font-style:normal;font-size:11px;padding:1px 5px;border-radius:6px;background:rgba(20,22,26,.8)}
.tbap{display:flex;align-items:center;gap:4px;min-height:22px;font-size:12px}.tbap em{margin-left:auto;color:var(--gold,#d6b25e);font-style:normal;font-family:Cinzel,serif}

/* continue / skip */

#hudlane :is(.bark,.folbark){position:static;top:auto;left:auto;max-width:100%;box-sizing:border-box}
#hudlane .hl-say>.gone{opacity:0;transition:opacity .6s}
/* the objective: a thin line hanging under the compass */
.hudobj{position:absolute;top:40px;left:10px;right:52px;z-index:3;display:flex;justify-content:center;align-items:center;gap:6px;height:20px;pointer-events:none;
  font:500 12px/20px "Barlow Semi Condensed",system-ui,sans-serif;color:#efe8d6;text-shadow:0 1px 2px #000,0 0 6px #000;white-space:nowrap;overflow:hidden}
.hudobj.hide{display:none}
.hudobj .ho-d{flex:none;width:6px;height:6px;background:#f1cd72;transform:rotate(45deg);box-shadow:0 0 6px rgba(241,205,114,.6)}
.hudobj .ho-t{min-width:0;overflow:hidden;text-overflow:ellipsis;padding:0 10px;background:linear-gradient(90deg,transparent,rgba(6,7,9,.55) 18%,rgba(6,7,9,.55) 82%,transparent)}
.hudobj .ho-t b{font-weight:600;letter-spacing:.03em}
.hudobj .ho-w{color:rgba(233,226,208,.7);margin-left:6px}.hudobj .ho-w::before{content:"· "}
.hudobj .ho-t small{font:700 10px/1 "Barlow Condensed",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#f1cd72;margin-right:7px}
.hudobj.flash .ho-t{background:linear-gradient(90deg,transparent,rgba(6,7,9,.82) 12%,rgba(6,7,9,.82) 88%,transparent)}
.hudobj.flash .ho-d{animation:hudpulse 1.1s ease-in-out 3}
/* map buttons: one slim capsule instead of four loose circles; the compass gets the room back */
.mapbtns{gap:0;border-radius:19px;background:rgba(8,9,11,.66);box-shadow:0 0 0 1px rgba(226,187,100,.38),0 2px 8px rgba(0,0,0,.45);overflow:hidden}
.mapbtns .iconbtn{width:36px;height:36px;border:0;border-radius:0;background:transparent;box-shadow:none;font-size:18px}
.mapbtns .iconbtn+.iconbtn{border-top:1px solid rgba(226,187,100,.2)}
.mapbtns .sneakbtn.on,.mapbtns .sneakbtn.huntbtn.on{box-shadow:inset 0 0 0 1px rgba(226,187,100,.55)}
.compass{right:52px}
/* bars: like Skyrim, a full bar fades away; tap the bars to see them */
.hb.full{opacity:0;transition:opacity .9s ease .6s}
.vitals.peek .hb.full,.vitals:focus-within .hb.full{opacity:.6;transition-delay:0s}
@media (hover:hover){.vitals:hover .hb.full{opacity:.6;transition-delay:0s}}
.hline .carry.light{opacity:0;transition:opacity .6s}
.vitals.peek .hline .carry.light{opacity:1}
@media (hover:hover){.vitals:hover .hline .carry.light{opacity:1}}
/* ★ favourites lives in the top bar next to Search and Menu */
.top{grid-template-columns:auto minmax(0,1fr) auto auto auto auto;grid-template-areas:"l w f v s g" "l m m m m m"}
.top #favTop{grid-area:v;width:38px;height:38px;border-radius:50%;color:#f1cd72;flex:none;background:rgba(10,11,13,.55);border:1px solid rgba(226,187,100,.38);box-shadow:inset 0 0 8px rgba(0,0,0,.6)}
.top #favTop .hico{width:19px;height:19px;fill:rgba(241,205,114,.18)}
body:not(.fav-docked) #favTop,body.fav-docked #favBtn{display:none!important}
@media (max-width:374px){.top .iconbtn .ibl{display:none}.top{column-gap:6px}}
/* the one floating button: smaller, and it moves (hud2.js sets right/bottom) */
.twbtn{width:46px;height:46px;transition:opacity .2s,transform .2s,bottom .25s ease,right .25s ease}
.twbtn svg{width:27px;height:27px}
body:has(#twBtn) .app{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
/* the bottom bar: names fit (hud2.js shrinks long ones), no keyboard letters on small screens */
.mn-bar .tab .mn-l{text-overflow:ellipsis}
@media (max-width:600px){.tab .hk{display:none!important}}
@media (max-width:440px){.mn-bar .tab{letter-spacing:0}.mn-bar .tab .mn-l{text-transform:none;font-size:10.5px;letter-spacing:.01em}}
@media (prefers-reduced-motion:reduce){#hudlane,.twbtn,.hb.full{transition:none}.hudobj.flash .ho-d{animation:none}}
/* patch notes: a header that stays put while the list scrolls (‹ Back on the title page, ✕ in the popup) */
.pnbar{position:sticky;z-index:5;display:flex;align-items:center;gap:8px;min-height:52px;background:linear-gradient(180deg,#0e0f12,#0a0b0d);border-bottom:1px solid rgba(214,178,94,.3);box-shadow:0 6px 14px rgba(0,0,0,.45)}
.pnbar h2{flex:1;margin:0!important;text-align:center;letter-spacing:.12em;text-transform:uppercase;font-size:17px}
.pnbar .pnback{flex:none;min-width:72px;min-height:44px;padding:0 12px;border:1px solid rgba(214,178,94,.4);border-radius:4px;background:rgba(0,0,0,.35);color:#f0e2b6;font:600 15px "Barlow Semi Condensed",sans-serif;letter-spacing:.04em;cursor:pointer}
.pnbar .pnback:active{background:rgba(214,178,94,.18)}
.pnbar .pnback.pnx{min-width:44px;font-size:18px}
.pnbar.pn-page::after{content:"";flex:none;width:72px}
.pnbar.pn-sheet::before{content:"";flex:none;width:44px}
.title .page .pnbar{top:-7vh;margin:-18px -18px 10px;padding:4px 10px;border-radius:4px 4px 0 0}
.sheet.pnsheet .pnbar{top:-20px;margin:-20px -18px 10px;padding:4px 10px}
html.art-pixel .pnbar,html.art-pixel .pnbar .pnback{border-radius:0}
/* combat2.js: the immersive fight screen (the scene is the screen, cards float in it, a skill bar at the bottom) */
#tbf.c2{overflow:hidden;background:#050506}
#tbf.c2 .tbin{max-width:none;width:100%;height:100%;min-height:0;padding:0;display:block;position:relative;overflow:hidden}
#tbf.c2 .tbstage{position:absolute;inset:0;border:0;border-radius:0;box-shadow:none;overflow:hidden;background:#0b0c0e}
#tbf.c2 .c2bd{position:absolute;left:-40px;top:-40px;width:calc(100% + 80px);height:calc(100% + 80px);z-index:0;filter:blur(24px) brightness(.5) saturate(1.2);opacity:0;transition:opacity .8s;pointer-events:none}
#tbf.c2 .c2bd.on{opacity:1}
#tbf.c2.pixel .c2bd{left:0;top:0;width:100%;height:100%;filter:brightness(.4) saturate(1.1);image-rendering:pixelated}
#tbf.c2 .tbstage .tbscene{position:absolute;inset:0;min-height:0;border-radius:0;background:none;z-index:1}
#tbf.c2 .tbscene .fscene{position:absolute;left:var(--c2cx,0px);top:var(--c2cy,48px);width:var(--c2cw,100%);height:var(--c2ch,auto);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent),linear-gradient(180deg,transparent,#000 8%,#000 90%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent),linear-gradient(180deg,transparent,#000 8%,#000 90%,transparent);mask-composite:intersect}
#tbf.c2 .tbscene .fscene canvas{display:block;width:100%;height:100%}
#tbf.c2 .c2shake .tbscene{animation:c2shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes c2shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,2px)}40%,60%{transform:translate(6px,-1px)}}
#tbf.c2 .tbstage::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;transition:box-shadow .6s}
#tbf.c2.c2mine .tbstage::after{box-shadow:inset 0 0 70px rgba(226,187,100,.16)}
#tbf.c2.c2theirs .tbstage::after{box-shadow:inset 0 0 80px rgba(190,50,30,.22)}
#tbf.c2.c2turn .tbstage::after{animation:c2turn 1.1s ease-out}
@keyframes c2turn{0%{box-shadow:inset 0 0 0 rgba(255,220,140,0)}30%{box-shadow:inset 0 0 120px rgba(255,220,140,.45)}}
#tbf.c2 .tbbub{display:none}
#tbf.c2 .fitarrow{z-index:2}
#tbf.c2 .tbban{top:36%;z-index:5;padding:12px 0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.62) 18%,rgba(0,0,0,.62) 82%,transparent)}
#tbf.c2 .tbhint{bottom:calc(var(--c2dock,180px) + 110px)}
/* the turn order: a slim ribbon of portraits */
#tbf.c2 .tbtop{position:absolute;left:0;right:0;top:0;z-index:6;padding:calc(6px + env(safe-area-inset-top)) 8px 12px;gap:6px;background:linear-gradient(180deg,rgba(5,5,6,.88),rgba(5,5,6,.5) 65%,transparent);pointer-events:none}
#tbf.c2 .tbtop>*{pointer-events:auto}
#tbf.c2 .tbtop>b.c2rd{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:1px solid rgba(226,187,100,.75);background:radial-gradient(circle at 40% 35%,#3d311d,#110d07);font:700 16px/1 Cinzel,serif;color:#f3d98b;box-shadow:0 0 12px rgba(226,187,100,.25),inset 0 0 6px #000}
#tbf.c2 .tbtop>b.c2rd small{font:600 7px/1 "Barlow Semi Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-bottom:2px}
#tbf.c2 .tbord{gap:4px;align-items:center;padding:3px 2px}
#tbf.c2 .tbini{display:flex;align-items:center;gap:4px;padding:2px;border-radius:999px;background:rgba(10,10,12,.62);border:1px solid rgba(255,255,255,.14);font:600 11px/1 "Barlow Semi Condensed",sans-serif;color:#e9e1cc;transition:transform .25s,opacity .25s,box-shadow .25s}
#tbf.c2 .tbini .c2pt{flex:none;width:26px;height:26px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#1a1712;box-shadow:0 0 0 1.5px #9fb6d8}
#tbf.c2 .tbini.foe .c2pt{box-shadow:0 0 0 1.5px #e0614a;background:radial-gradient(circle,#4a1610,#1a0806)}
#tbf.c2 .tbini.ally .c2pt{box-shadow:0 0 0 1.5px #8fd08f}
#tbf.c2 .tbini .c2pt img,#tbf.c2 .tbini .c2pt canvas{display:block;width:100%;height:100%}
#tbf.c2 .c2gl{font-size:13px;line-height:1;color:#f3e7c8}
#tbf.c2 .tbini .c2nm{display:none;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tbf.c2 .tbini i{margin:0 5px 0 0;font-size:10px;opacity:.6}
#tbf.c2 .tbini.now{transform:scale(1.1);background:rgba(60,48,24,.85);border-color:#e2bb64;box-shadow:0 0 12px rgba(226,187,100,.45)}
#tbf.c2 .tbini.now .c2nm{display:block;padding-left:2px}
#tbf.c2 .tbini.gone{opacity:.35;filter:grayscale(1)}
#tbf.c2 .tbtop .tbff{width:36px;height:36px;min-width:36px;min-height:36px;border-radius:50%;background:rgba(10,10,12,.62);border:1px solid rgba(214,178,94,.4)}
#tbf.c2 .tbtop .tbff.on{background:rgba(214,178,94,.32)}
/* boss bar and big-attack warnings: under the ribbon */
#tbf.c2 .bfwrap{position:absolute;z-index:5;left:50%;transform:translateX(-50%);top:var(--c2top,48px);width:min(620px,calc(100% - 16px));margin:0}
/* everything that floats in the scene */
#tbf.c2 .c2ov{position:absolute;inset:0;z-index:3;pointer-events:none}
#tbf.c2 .c2ov>*{pointer-events:auto}
/* the foe's nameplate over its head */
#tbf.c2 .c2ov .tbu.foe{position:absolute;left:calc(var(--c2fx,70%) - 95px);top:var(--c2top,48px);width:min(200px,54vw);padding:5px 8px 6px;border-radius:9px;background:linear-gradient(180deg,rgba(24,12,9,.8),rgba(10,7,6,.66));border:1px solid rgba(230,110,80,.5);box-shadow:0 8px 20px rgba(0,0,0,.5);transition:left .3s ease,top .3s ease,box-shadow .2s,border-color .2s}
#tbf.c2 .c2ov .tbu.foe::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);background:rgba(10,7,6,.8);border-right:1px solid rgba(230,110,80,.5);border-bottom:1px solid rgba(230,110,80,.5)}
#tbf.c2 .tbu.foe .nm{font:700 12.5px/1.2 Cinzel,serif;color:#ffd9c9;text-shadow:0 1px 2px #000;margin-bottom:3px}
#tbf.c2 .tbu.foe .nm .arch{font-family:"Barlow Semi Condensed",sans-serif;font-size:9.5px}
#tbf.c2 .tbu.foe .tbbar.big{height:11px;border-radius:6px}
#tbf.c2 .tbu.foe .tbbar.big .num{font-size:9.5px;line-height:11px}
#tbf.c2 .tbu.foe .tbst{margin-top:4px;flex-wrap:wrap}
#tbf.c2 .tbu.foe .tbst .st{font-size:11px;padding:0 4px}
#tbf.c2 .tbu.foe .tbint{font-size:11px;padding:1px 6px;box-shadow:0 0 8px rgba(255,80,50,.25)}
#tbf.c2 .tbu.foe.c2low{border-color:#ff5a3c;box-shadow:0 0 16px rgba(255,60,30,.45)}
#tbf.c2 .tbu.foe.c2stun{animation:c2wob 1.4s ease-in-out infinite}
@keyframes c2wob{25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
#tbf.c2 .c2stars{position:absolute;left:var(--c2fx);top:calc(var(--c2fy) + 2px);width:64px;height:20px;margin-left:-32px;pointer-events:none!important}
#tbf.c2 .c2stars i{position:absolute;left:50%;top:50%;font-style:normal;font-size:14px;color:#ffe680;text-shadow:0 0 6px #ffb800;animation:c2orbit 1.2s linear infinite}
#tbf.c2 .c2stars i:nth-child(2){animation-delay:-.4s}#tbf.c2 .c2stars i:nth-child(3){animation-delay:-.8s}
@keyframes c2orbit{0%{transform:translate(-50%,-50%) translate(26px,0) scale(1)}25%{transform:translate(-50%,-50%) translate(0,7px) scale(1.2)}50%{transform:translate(-50%,-50%) translate(-26px,0) scale(1)}75%{transform:translate(-50%,-50%) translate(0,-7px) scale(.7);opacity:.6}100%{transform:translate(-50%,-50%) translate(26px,0) scale(1)}}
/* slim bars over your head; a drop spot on your figure */
#tbf.c2 .c2head{position:absolute;left:var(--c2hx);top:var(--c2hy);transform:translate(-50%,-100%);width:clamp(48px,calc(var(--c2cw,400px) * .1),92px);display:flex;flex-direction:column;gap:1.5px;padding:2px;border-radius:3px;background:rgba(0,0,0,.6);box-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none!important}
#tbf.c2 .c2head i{display:block;height:4px;border-radius:2px;background:linear-gradient(180deg,#ff6a50,#b3241a);transition:width .5s}
#tbf.c2 .c2head i.m{height:2.5px;background:#5b98ff}#tbf.c2 .c2head i.s{height:2.5px;background:#86d860}
#tbf.c2 .c2hot{position:absolute;left:var(--c2hx);top:var(--c2hy);width:calc(var(--c2ch,300px) * .26);height:calc(var(--c2ch,300px) * .44);margin-left:calc(var(--c2ch,300px) * -.13);border-radius:40%;transition:box-shadow .15s}
#tbf.c2 .c2hot.drop-ok{box-shadow:0 0 0 2px rgba(130,190,255,.55),0 0 26px rgba(130,190,255,.35)}
#tbf.c2 .c2hot.drop-hot{box-shadow:0 0 0 3px #f3d98b,0 0 30px rgba(243,217,139,.6)!important;border:0!important}
/* your HUD: health orb, magicka and stamina arcs, statuses */
#tbf.c2 .c2ov .tbu.me{position:absolute;left:6px;bottom:calc(var(--c2dock,180px) + 6px);display:grid;grid-template-columns:86px minmax(0,1fr);column-gap:6px;row-gap:3px;align-content:end;align-items:end;width:min(270px,calc(100% - 150px));padding:0;border:0;border-radius:44px 12px 12px 44px;background:radial-gradient(120% 100% at 0% 100%,rgba(0,0,0,.55),rgba(0,0,0,0) 70%);box-shadow:none;overflow:visible}
#tbf.c2 .tbu.me>*{grid-column:2;min-width:0;margin:0}
#tbf.c2 .tbu.me>.c2orb{grid-column:1;grid-row:1 / span 6;align-self:end}
#tbf.c2 .tbu.me>.tbbar.big,#tbf.c2 .tbu.me>.tbsub{display:none}
#tbf.c2 .tbu.me>.nm{font:700 12px/1.15 Cinzel,serif;color:#f3e7c8;text-shadow:0 1px 3px #000;justify-content:flex-start;gap:4px}
#tbf.c2 .tbu.me .tbst{margin:0}#tbf.c2 .tbu.me .tbst .st{font-size:10.5px}
#tbf.c2 .tbu.me .tbward{margin:0}
#tbf.c2 .tbu.me .fitm{top:-6px;right:auto;left:62px}
#tbf.c2 .tbu.me.drop-ok .c2glass,#tbf.c2 .tbu.me.fc-tgt .c2glass{box-shadow:0 0 0 3px rgba(130,190,255,.6),0 0 22px rgba(130,190,255,.45)}
#tbf.c2 .tbu.me.drop-ok,#tbf.c2 .tbu.me.drop-hot{outline:0;transform:none}
#tbf.c2 .c2orb{position:relative;width:86px;height:86px}
#tbf.c2 .c2arcs{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#tbf.c2 .c2arcs path{fill:none;stroke-width:6.5;stroke-linecap:round;transition:stroke-dasharray .5s}
#tbf.c2 .c2arcs .tr{stroke:rgba(0,0,0,.6)}
#tbf.c2 .c2arcs .mp{stroke:#5b98ff;filter:drop-shadow(0 0 3px rgba(91,152,255,.8))}
#tbf.c2 .c2arcs .sp{stroke:#86d860;filter:drop-shadow(0 0 3px rgba(134,216,96,.8))}
#tbf.c2 .c2glass{position:absolute;inset:10px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#2c0e0c,#090303);border:2px solid #b8913f;box-shadow:inset 0 0 14px #000,0 0 10px rgba(0,0,0,.8)}
#tbf.c2 .c2glass .liq{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#ff5d46,#a6170f 55%,#5c0706);transition:height .7s cubic-bezier(.3,.7,.3,1)}
#tbf.c2 .c2glass .liq::before{content:"";position:absolute;left:0;top:-4px;width:200%;height:8px;background:radial-gradient(ellipse at 50% 100%,#ff6d55 0 55%,transparent 58%) 0 0/16px 8px repeat-x;animation:c2wave 2.2s linear infinite}
@keyframes c2wave{to{transform:translateX(-50%)}}
#tbf.c2 .c2glass .inc{position:absolute;left:0;right:0;z-index:1;background:repeating-linear-gradient(-45deg,rgba(255,236,210,.55) 0 3px,rgba(0,0,0,0) 3px 7px);animation:c2blink 1.3s ease-in-out infinite}
@keyframes c2blink{50%{opacity:.35}}
#tbf.c2 .c2glass::after{content:"";position:absolute;left:16%;top:7%;width:52%;height:30%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,255,.32),transparent 70%);pointer-events:none}
#tbf.c2 .c2glass b.num{position:absolute;left:0;right:0;top:30%;z-index:2;text-align:center;font:700 20px/1 "Barlow Semi Condensed",sans-serif;color:#fff;text-shadow:0 1px 3px #000}
#tbf.c2 .c2glass small.num{position:absolute;left:0;right:0;top:58%;z-index:2;text-align:center;font:600 10px/1 "Barlow Semi Condensed",sans-serif;color:#f3dcd0;opacity:.85;text-shadow:0 1px 2px #000}
#tbf.c2 .c2mpn,#tbf.c2 .c2spn{position:absolute;bottom:-2px;font:700 10px/1 "Barlow Semi Condensed",sans-serif;text-shadow:0 1px 2px #000,0 0 4px #000}
#tbf.c2 .c2mpn{left:0;color:#a9c8ff}#tbf.c2 .c2spn{right:0;color:#c3f3a6}
#tbf.c2 .c2orb.low .c2glass{animation:c2low 1s ease-in-out infinite}
@keyframes c2low{50%{box-shadow:inset 0 0 14px #000,0 0 18px rgba(255,40,20,.8);border-color:#ff5a3c}}
/* followers and party members: small plates in the scene */
#tbf.c2 .c2ov .tbparty{position:absolute;right:6px;bottom:calc(var(--c2dock,180px) + 6px);display:flex;flex-wrap:wrap-reverse;justify-content:flex-end;gap:4px;width:auto;max-width:136px;margin:0;grid-template-columns:none}
#tbf.c2 .c2ov .tbparty.many{max-width:136px}
#tbf.c2 .c2ov .tbparty .tbu.ally{width:132px;padding:3px 6px 4px;border-radius:8px;background:rgba(8,12,8,.66);border:1px solid rgba(140,210,140,.35);box-shadow:0 3px 10px rgba(0,0,0,.45)}
#tbf.c2 .c2ov .tbparty.many .tbu.ally{width:64px;padding:2px 4px 3px}
#tbf.c2 .tbparty .tbu.ally .nm{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#tbf.c2 .tbparty .tbu.ally .tbbar.mid{height:9px}#tbf.c2 .tbparty .tbu.ally .tbbar .num{font-size:8.5px;line-height:9px}
#tbf.c2 .tbparty .tbu.ally .fairow{display:none}
#tbf.c2 .tbparty .tbu.ally.down{opacity:.6;filter:grayscale(.7)}
/* the fight log: a short fading feed */
#tbf.c2 .c2ov .tblog{position:absolute;left:6px;top:var(--c2top,48px);display:flex;flex-direction:column;justify-content:flex-end;width:auto;max-width:62%;min-height:0;max-height:62px;flex:none;overflow:hidden;padding:2px 4px;margin:0;background:rgba(8,10,14,.42);border:0;border-radius:6px;font-size:11.5px;line-height:1.25;text-shadow:0 1px 2px #000,0 0 6px #000,0 0 2px #000;-webkit-mask-image:linear-gradient(180deg,transparent,#000 30px);mask-image:linear-gradient(180deg,transparent,#000 30px);-webkit-mask-size:100% 62px;mask-size:100% 62px;-webkit-mask-position:bottom;mask-position:bottom;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
#tbf.c2 .c2ov .tblog .tbl{flex:none;padding:0}

/* the skill bar */

/* ==== PC fit (tests/pcfit_ui.py): on a wide landscape screen the game fills the window, the page never scrolls; only side lists do ==== */
@media (min-width:1100px) and (orientation:landscape){
  html,body{height:100%;overflow:hidden}
  html:not(.pcmap) body #app.app{max-width:none;width:100%;margin:0;height:100vh;display:flex;flex-direction:column;padding:0 16px calc(var(--mn-h,56px) + 8px)}
  html:not(.pcmap) .app>.top{flex:none}
  html:not(.pcmap) .app>.layout{flex:1 1 0;min-height:0;grid-template-columns:minmax(0,1fr) clamp(440px,33vw,860px);grid-template-rows:minmax(0,1fr);align-items:stretch}
  html:not(.pcmap) .app>.layout>div:first-child{display:flex;flex-direction:column;min-height:0}
  html:not(.pcmap) .app>.layout .mapwrap{aspect-ratio:auto;flex:1 1 0;min-height:160px}
  html:not(.pcmap) .app>.layout>.side{position:static;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
  .sky-in{width:min(1800px,100%)}
  #side{container-type:inline-size;container-name:pcside}
  /* the compass's Skills page: wider on a big screen, the skill stars beside the list instead of under it */
  body.tw-char #side{padding-bottom:16px}
  body.tw-char #side>*{max-width:min(1180px,100%)}
  body.tw-char #side>.tw-starp{max-width:min(1640px,100%);width:100%}
  /* the Skills stars want room: the side panel takes the bigger share while they're open */
  html:not(.pcmap) .app>.layout:has(>#side>.tw-starp .tw-bigw){grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
  /* the classic fight: the scene big on the left, who's who and your actions on the right; nothing scrolls (the immersive one, .c2, fills the window itself) */
  .tbf:not(.c2) .tbin{max-width:min(1560px,100%);padding-left:16px;padding-right:16px;display:grid;grid-template-columns:minmax(0,1fr) clamp(400px,30vw,560px);grid-template-rows:auto auto minmax(0,1fr);column-gap:18px;align-content:center;align-items:start}
  .tbf:not(.c2) .tbin>*{grid-column:2;min-width:0}
  .tbf:not(.c2) .tbin>.tbstage{grid-column:1;grid-row:1/4;align-self:center;justify-self:center;width:min(100%,calc((100vh - 40px) * 1.45))}
  .tbf:not(.c2) .tbin>.tbdock{align-self:end}
  .tbf:not(.c2) .tbin .tbord{flex-wrap:wrap;overflow:visible}
  #side:has(>.tw-starp .tw-bigw){display:flex;flex-direction:column}

#fhints .fhint{position:absolute;box-sizing:border-box;width:max-content;padding:7px 12px;pointer-events:auto;cursor:pointer;background:rgba(9,10,12,.94);border:1px solid rgba(214,178,94,.5);border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,.55);color:#ece3cb;font:500 13.5px/1.3 "Barlow Semi Condensed","Barlow",sans-serif;letter-spacing:.02em;animation:fhin .25s ease-out}
