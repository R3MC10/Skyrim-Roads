name: Hourly game update
# Game updates go out once per full hour: if main changed since the last build, start a build.
# Hotfix: run "Build the Android app" by hand (Actions tab > Run workflow) to ship at once.
# GitHub skips scheduled runs a lot, so every push to main also starts this: it waits until an hour
# has passed since the last release, then builds. A newer push cancels the waiting run (concurrency),
# so there is always at most one release per hour and every merge reaches phones.
on:
  push:
    branches: [main]
  schedule:
    # GitHub often skips crons at minute 0 (busiest time); run off-peak at :07 (still once per hour).
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: hourly-release
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Wait until an hour has passed since the last release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          AT=$(gh release list --limit 1 --json publishedAt -q '.[0].publishedAt')
          if [ -z "$AT" ]; then exit 0; fi
          WAIT=$(( $(date -d "$AT" +%s) + 3600 - $(date +%s) ))
          if [ "$WAIT" -gt 0 ]; then echo "Last release at $AT, waiting ${WAIT}s"; sleep "$WAIT"; fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build if main changed since the last release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --tags
          LAST=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          BUSY=$(gh run list --workflow android.yml --limit 5 --json status -q '[.[]|select(.status!="completed")]|length')
          if [ "$BUSY" != "0" ]; then echo "A build is already running"; exit 0; fi
          if [ -n "$LAST" ] && [ "$(git rev-list -n1 "$LAST")" = "$(git rev-parse HEAD)" ]; then echo "Nothing new since $LAST"; exit 0; fi
          # nothing but docs/art changed: skip
          if [ -n "$LAST" ] && [ -z "$(git diff --name-only "$LAST" HEAD -- . ':!*.md' ':!art/**' ':!.github/workflows/cleanup.yml')" ]; then echo "Only docs changed"; exit 0; fi
          gh workflow run android.yml --ref main
          echo "Started a build (last release: $LAST)"
