name: Build the Android app
# Started once per full hour by hourly-release.yml when main changed.
# Hotfix: run this workflow by hand to ship at once.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: What changed since the last build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --tags
          LAST=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          { echo "CHANGES<<EOF_CHANGES"; if [ -n "$LAST" ]; then git log --no-merges --format='- %s' "$LAST"..HEAD | head -40; else git log -1 --format='- %s'; fi; echo "EOF_CHANGES"; } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle   # keep downloaded libraries between builds (Maven Central rate-limits busy runners)
      - name: Use the Android SDK already on the runner
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties && ls $ANDROID_HOME/platforms | tail -3
      - name: Unlock the signing key (stored encrypted, password lives in GitHub secrets)
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$SIGNING_PASSPHRASE" ]; then echo "::error::Add the SIGNING_PASSPHRASE secret (Settings > Secrets and variables > Actions)"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in android/app/roads.keystore.enc -out android/app/roads.keystore -pass env:SIGNING_PASSPHRASE
          printf 'storeFile=roads.keystore\nstorePassword=%s\nkeyAlias=roads\nkeyPassword=%s\n' "$SIGNING_PASSPHRASE" "$SIGNING_PASSPHRASE" > android/keystore.properties
      - run: npm ci
      - name: Put the game inside the app
        run: npm run sync
      - name: Keep the game files for the PC build
        uses: actions/upload-artifact@v4
        with:
          name: www
          path: www
          retention-days: 3
      - name: Build the APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: chmod +x gradlew && (./gradlew assembleRelease --no-daemon --stacktrace || (echo "Retrying once (downloads sometimes fail)"; sleep 90; ./gradlew assembleRelease --no-daemon --stacktrace --refresh-dependencies))
      - run: cp android/app/build/outputs/apk/release/app-release.apk RoadsOfTheNorth.apk
      - name: Pack the game files for quick in-app updates (no reinstall)
        run: |
          SHELL_V=$(grep -o 'int SHELL = [0-9]*' android/app/src/main/java/com/r3mc10/roadsofthenorth/UpdaterPlugin.java | grep -o '[0-9]*$')
          (cd www && zip -qr9 "../game-shell${SHELL_V}.zip" .)
      - name: Pack small patches from the last few builds (only the files that changed)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TO: ${{ github.run_number }}
        run: |
          SHELL_V=$(grep -o 'int SHELL = [0-9]*' android/app/src/main/java/com/r3mc10/roadsofthenorth/UpdaterPlugin.java | grep -o '[0-9]*$')
          FULL=$(stat -c %s "game-shell${SHELL_V}.zip")
          for tag in $(gh release list --limit 6 --json tagName -q '.[].tagName'); do
            FROM=${tag#build-}
            case "$FROM" in ''|*[!0-9]*) continue;; esac
            [ "$FROM" -lt "$TO" ] || continue
            gh release download "$tag" -p "game-shell${SHELL_V}.zip" -D "prev/$FROM" || continue
            unzip -q "prev/$FROM/game-shell${SHELL_V}.zip" -d "prev/$FROM/game" || continue
            node scripts/delta.mjs "prev/$FROM/game" www "$FROM" "$TO" "delta/$FROM" || continue
            (cd "delta/$FROM" && zip -qr9 "../../game-shell${SHELL_V}-from${FROM}.zip" .)
            SIZE=$(stat -c %s "game-shell${SHELL_V}-from${FROM}.zip")
            # not worth it when most of the game changed
            if [ $((SIZE * 10)) -ge $((FULL * 8)) ]; then rm "game-shell${SHELL_V}-from${FROM}.zip"; fi
          done
          ls -la game-shell*.zip
      - name: Write latest.json (newest build, file sizes and SHA-256 checksums the app checks)
        continue-on-error: true   # without it phones fall back to the GitHub API
        env:
          TO: ${{ github.run_number }}
        run: |
          SHELL_V=$(grep -o 'int SHELL = [0-9]*' android/app/src/main/java/com/r3mc10/roadsofthenorth/UpdaterPlugin.java | grep -o '[0-9]*$')
          node scripts/latestjson.mjs "$TO" "$SHELL_V" . > latest.json
          cat latest.json
      - name: Publish it as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Roads of the North (build ${{ github.run_number }})
          make_latest: true
          files: |
            RoadsOfTheNorth.apk
            game-shell*.zip
            latest.json
          body: |
            ${{ env.CHANGES }}

            ---
            Open this page on your Android phone, tap **RoadsOfTheNorth.apk**, then open the download.
            The first time, Android asks to allow installing apps from your browser: allow it.
            Newer builds install over the old one and keep your offline save.
            After that, the app updates itself in the background: no reinstalling needed.

            **PC (Windows):** download **RoadsOfTheNorth-PC-setup.exe** (installs, adds a Start menu icon) or **RoadsOfTheNorth-PC-portable.exe** (just run it).
            Windows may say "unrecognised app": click *More info*, then *Run anyway*. Esc works as Back; F11 toggles full screen.

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: www
          path: desktop/www
      - name: Build the PC app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm pkg set version=1.0.${{ github.run_number }}
          npm install --no-audit --no-fund
          npx electron-builder --win portable nsis --publish never
          dir dist
          # without this file the installed PC game can't update itself (build 100 shipped without one)
          if (-not (Test-Path dist/win-unpacked/resources/app-update.yml)) { Write-Error "app-update.yml missing: the PC app couldn't update itself"; exit 1 }
          Get-Content dist/win-unpacked/resources/app-update.yml
      - name: Add it to the same download page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: |
            desktop/dist/RoadsOfTheNorth-PC-setup.exe
            desktop/dist/RoadsOfTheNorth-PC-portable.exe
            desktop/dist/RoadsOfTheNorth-PC-setup.exe.blockmap
            desktop/dist/latest.yml
